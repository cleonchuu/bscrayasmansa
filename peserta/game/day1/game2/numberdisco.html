<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kiosk Input Jawaban - Number Disco</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      user-select: none;
    }

    /* Flash Screen */
    .flash-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
      font-weight: 900;
      color: white;
      text-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      animation: fadeIn 0.2s ease-in-out;
    }
    .flash-correct { background-color: #16a34a; }
    .flash-wrong { background-color: #dc2626; }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Freeze Screen */
    .freeze-screen {
      position: fixed;
      inset: 0;
      z-index: 9998;
      background: rgba(15, 23, 42, 0.98);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem;
      animation: fadeIn 0.3s ease-in-out;
    }

    .freeze-pulse {
      animation: pulseSoft 2s ease-in-out infinite;
    }
    @keyframes pulseSoft {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.85; }
    }

    /* Calc Button */
    .calc-btn {
      background: #334155;
      color: #ffffff;
      font-size: 1.8rem;
      font-weight: bold;
      border-radius: 1rem;
      padding: 1.1rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      transition: all 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .calc-btn:active:not(:disabled) {
      transform: scale(0.95);
      background: #475569;
    }
    .calc-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ═══════════════════════════════════════════════════════════
       PANEL LOCKED STATE — visual jelas biar tidak bingung
       ═══════════════════════════════════════════════════════════ */
    .panel-locked {
      opacity: 0.35 !important;
      filter: grayscale(1);
      cursor: not-allowed !important;
    }
    .tab-locked {
      opacity: 0.35 !important;
      filter: grayscale(1);
      cursor: not-allowed !important;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- FREEZE OVERLAY                                               -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <div id="freezeOverlay" class="freeze-screen hidden">
    <div class="w-24 h-24 bg-rose-500/10 border-2 border-rose-500/30 rounded-full flex items-center justify-center mb-6 freeze-pulse">
      <i id="freezeIcon" class="fas fa-lock text-5xl text-rose-500"></i>
    </div>
    <h2 id="freezeTitle" class="text-3xl md:text-4xl font-black text-rose-500 tracking-wider uppercase mb-2">
      SESI DIBEKUKAN
    </h2>
    <p id="freezeMessage" class="text-slate-400 text-sm md:text-base max-w-md mb-6">
      Harap tunggu instruksi panitia.
    </p>
    <div class="flex items-center gap-2 bg-slate-900 border border-slate-800 px-4 py-2 rounded-xl text-xs font-mono text-slate-400">
      <span class="w-2 h-2 rounded-full bg-rose-500 animate-ping"></span>
      Status: <span id="freezeStatusText" class="text-rose-400 font-bold uppercase">WAITING</span>
    </div>
  </div>

  <!-- FLASH RESULT OVERLAY -->
  <div id="flashOverlay" class="flash-screen hidden"></div>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- MAIN CARD                                                    -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <main class="w-full max-w-xl bg-slate-800 border border-slate-700 rounded-3xl p-6 shadow-2xl relative overflow-hidden">

    <!-- HEADER -->
    <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-700/60">
      <div>
        <h1 class="text-xl font-black text-amber-400 tracking-wide">🎯 KIOSK PESERTA</h1>
        <p class="text-xs text-slate-400 mt-0.5">Number Disco Fast Play</p>
      </div>
      <div class="flex items-center gap-3">
        <div id="timerDisplay" class="bg-amber-500/20 border border-amber-500/50 px-3 py-1.5 rounded-xl text-xs font-bold text-amber-300 hidden">
          ⏱️ Sisa: <span id="timerText">05:00</span>
        </div>
        <div id="statusBadge" class="bg-slate-900 border border-slate-700 px-3 py-1.5 rounded-xl text-xs font-semibold text-slate-300">
          Status: <span id="statusText" class="text-rose-400 font-bold">FROZEN</span>
        </div>
      </div>
    </div>

    <!-- STEP 1: PILIH SEKOLAH -->
    <div id="stepSchool" class="space-y-4">
      <label class="block text-sm font-medium text-slate-300">1. Pilih Sekolah Peserta:</label>
      <div id="schoolList" class="grid grid-cols-1 gap-3 max-h-80 overflow-y-auto pr-1"></div>
    </div>

    <!-- STEP 2: PILIH PESERTA -->
    <div id="stepStudent" class="space-y-4 hidden">
      <div class="flex items-center justify-between">
        <label class="block text-sm font-medium text-slate-300">2. Pilih Nama Peserta:</label>
        <button id="btnBackToSchool" class="text-xs text-amber-400 hover:underline">← Ganti Sekolah</button>
      </div>
      <div id="studentList" class="grid grid-cols-1 gap-3 max-h-80 overflow-y-auto pr-1"></div>
    </div>

    <!-- STEP 3: INPUT JAWABAN -->
    <div id="stepCalculator" class="space-y-4 hidden">
      <div class="bg-slate-900 border border-slate-700 p-3 rounded-2xl flex items-center justify-between">
        <div>
          <div id="selectedStudentName" class="font-bold text-lg text-white">Nama Peserta</div>
          <div id="selectedStudentSchool" class="text-xs text-slate-400">Asal Sekolah</div>
        </div>
        <button id="btnCancelCalc" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-slate-300">Batal</button>
      </div>

      <!-- Tab Pilihan Panel -->
      <div class="grid grid-cols-2 gap-3">
        <button id="tabBlue" onclick="switchPanel('blue')" class="py-2.5 px-3 rounded-xl border text-xs font-bold transition flex flex-col items-center gap-1 bg-blue-900/40 border-blue-500 text-blue-300">
          <span>TIM BIRU</span>
          <span id="badgeBlue" class="text-[10px] opacity-75">(Tersisa 2x)</span>
        </button>
        <button id="tabRed" onclick="switchPanel('red')" class="py-2.5 px-3 rounded-xl border text-xs font-bold transition flex flex-col items-center gap-1 bg-slate-900 border-slate-700 text-slate-400">
          <span>TIM MERAH</span>
          <span id="badgeRed" class="text-[10px] opacity-75">(Tersisa 2x)</span>
        </button>
      </div>

      <!-- Dual Panel Display -->
      <div class="grid grid-cols-2 gap-3">
        <div id="panelBlue" onclick="switchPanel('blue')" class="cursor-pointer border-2 rounded-2xl p-3 bg-slate-950 text-right transition border-blue-500 ring-2 ring-blue-500/30">
          <div class="text-[10px] font-bold text-blue-400 uppercase tracking-wider text-left">
            Jawaban Biru <span id="lockIconBlue" class="hidden">🔒</span>
          </div>
          <div id="displayBlue" class="text-3xl font-mono font-bold tracking-wider text-amber-400 min-h-[40px] flex items-center justify-end break-all">-</div>
        </div>
        <div id="panelRed" onclick="switchPanel('red')" class="cursor-pointer border-2 rounded-2xl p-3 bg-slate-950 text-right transition border-slate-700 opacity-60">
          <div class="text-[10px] font-bold text-red-400 uppercase tracking-wider text-left">
            Jawaban Merah <span id="lockIconRed" class="hidden">🔒</span>
          </div>
          <div id="displayRed" class="text-3xl font-mono font-bold tracking-wider text-amber-400 min-h-[40px] flex items-center justify-end break-all">-</div>
        </div>
      </div>

      <!-- Keypad -->
      <div class="grid grid-cols-4 gap-2.5">
        <button class="calc-btn" onclick="appendCalc('7')">7</button>
        <button class="calc-btn" onclick="appendCalc('8')">8</button>
        <button class="calc-btn" onclick="appendCalc('9')">9</button>
        <button class="calc-btn text-red-400" onclick="clearCalc()">C</button>
        <button class="calc-btn" onclick="appendCalc('4')">4</button>
        <button class="calc-btn" onclick="appendCalc('5')">5</button>
        <button class="calc-btn" onclick="appendCalc('6')">6</button>
        <button class="calc-btn text-amber-400" onclick="deleteCalc()">⌫</button>
        <button class="calc-btn" onclick="appendCalc('1')">1</button>
        <button class="calc-btn" onclick="appendCalc('2')">2</button>
        <button class="calc-btn" onclick="appendCalc('3')">3</button>
        <button class="calc-btn text-sky-400" onclick="toggleNegative()">-</button>
        <button class="calc-btn col-span-4" onclick="appendCalc('0')">0</button>
      </div>

      <button id="btnSubmitAnswer" onclick="submitAnswer()" class="w-full py-4 mt-2 bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-600 hover:to-yellow-600 text-slate-950 font-black text-xl rounded-2xl shadow-lg transition transform active:scale-95 flex items-center justify-center">
        <span id="btnSubmitText">SUBMIT JAWABAN 🚀</span>
      </button>
    </div>

  </main>

  <script>
    // ═══════════════════════════════════════════════════════════
    // LOGGER
    // ═══════════════════════════════════════════════════════════
    const DEBUG = true;
    const LOG = {
      ok:    (t, m, d) => DEBUG && console.log(`%c[${t}] ✅ ${m}`, 'color:#10b981;font-weight:bold', d ?? ''),
      info:  (t, m, d) => DEBUG && console.log(`%c[${t}] ℹ️ ${m}`, 'color:#3b82f6;font-weight:bold', d ?? ''),
      warn:  (t, m, d) => DEBUG && console.warn(`%c[${t}] ⚠️ ${m}`, 'color:#f59e0b;font-weight:bold', d ?? ''),
      error: (t, m, d) => DEBUG && console.error(`%c[${t}] ❌ ${m}`, 'color:#ef4444;font-weight:bold', d ?? ''),
      step:  (t, m, d) => DEBUG && console.log(`%c[${t}] ➡️ ${m}`, 'color:#a855f7;font-weight:bold', d ?? '')
    };

    // ═══════════════════════════════════════════════════════════
    // KONFIGURASI
    // ═══════════════════════════════════════════════════════════
    const SUPABASE_URL = 'https://endlrberfaxqhjrpvoss.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_ts7-cOhRLAKGP4dqa4nExA_6hCktIHa';
    const supabaseClient = window.supabase
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
      : null;

    const SCORE_CONFIG = {
      MAX_POINT: 40,
      MIN_POINT: 20,
      TOTAL_TIME_SECONDS: 300
    };

    const DEFAULT_QUOTA = 2;

    // ═══════════════════════════════════════════════════════════
    // STATE
    // ═══════════════════════════════════════════════════════════
    let allUsers = [];
    let selectedSchool = '';
    let selectedStudent = null;

    let isFrozen = true;
    let frozenReason = '';
    let isSubmitting = false;

    let timerInterval = null;
    let timerStartMs = null;
    let lastTimerSecond = -1;

    let lastControlSig = '';

    // Number Disco state
    let activePanel = 'blue';
    let valBlue = "-";
    let valRed = "-";
    let inputLeftBlue = DEFAULT_QUOTA;
    let inputLeftRed = DEFAULT_QUOTA;
    let targetAnswerBlue = null;
    let targetAnswerRed = null;

    let lastQuestionSig = '';

    // DOM
    const stepSchool = document.getElementById('stepSchool');
    const stepStudent = document.getElementById('stepStudent');
    const stepCalculator = document.getElementById('stepCalculator');
    const schoolList = document.getElementById('schoolList');
    const studentList = document.getElementById('studentList');
    const timerDisplay = document.getElementById('timerDisplay');
    const timerText = document.getElementById('timerText');

    // ═══════════════════════════════════════════════════════════
    // FREEZE / UNFREEZE
    // ═══════════════════════════════════════════════════════════
    function freezeKiosk(reason, statusText) {
      isFrozen = true;
      frozenReason = reason || '';

      stopTimer();
      timerStartMs = null;
      lastTimerSecond = -1;

      const overlay = document.getElementById('freezeOverlay');
      const title = document.getElementById('freezeTitle');
      const msg = document.getElementById('freezeMessage');
      const status = document.getElementById('freezeStatusText');
      const icon = document.getElementById('freezeIcon');
      const badge = document.getElementById('statusText');

      if (reason === 'timeout') {
        title.textContent = "WAKTU HABIS!";
        title.className = "text-3xl md:text-4xl font-black text-rose-500 tracking-wider uppercase mb-2";
        icon.className = "fas fa-hourglass-end text-5xl text-rose-500";
        msg.textContent = "Waktu sesi telah berakhir. Harap tunggu instruksi panitia.";
        status.textContent = "TIMEOUT";
        status.className = "text-rose-400 font-bold uppercase";
        badge.textContent = "TIMEOUT";
        badge.className = "text-rose-400 font-bold";
      } else {
        title.textContent = "SESI DIBEKUKAN";
        title.className = "text-3xl md:text-4xl font-black text-amber-500 tracking-wider uppercase mb-2";
        icon.className = "fas fa-lock text-5xl text-amber-500";
        msg.textContent = "Sesi belum dimulai atau sudah dihentikan. Harap tunggu instruksi panitia.";
        status.textContent = "WAITING";
        status.className = "text-amber-400 font-bold uppercase";
        badge.textContent = "FROZEN";
        badge.className = "text-amber-400 font-bold";
      }

      overlay.classList.remove('hidden');
      disableAllButtons();
      timerDisplay.classList.add('hidden');

      LOG.warn('KIOSK', 'Frozen: ' + reason);
    }

    function unfreezeKiosk() {
      isFrozen = false;
      frozenReason = '';

      const overlay = document.getElementById('freezeOverlay');
      overlay.classList.add('hidden');

      enableAllButtons();

      // ⭐ Re-apply panel locks setelah unfreeze
      // supaya panel yang locked tetap terlihat locked
      updatePanelLocks();

      const badge = document.getElementById('statusText');
      badge.textContent = "READY";
      badge.className = "text-emerald-400 font-bold";

      LOG.ok('KIOSK', 'Unfrozen');
    }

    function disableAllButtons() {
      document.querySelectorAll('button').forEach(b => { b.disabled = true; });
      document.querySelectorAll('input').forEach(i => { i.disabled = true; });
    }

    function enableAllButtons() {
      document.querySelectorAll('button').forEach(b => { b.disabled = false; });
      document.querySelectorAll('input').forEach(i => { i.disabled = false; });
    }

    // ═══════════════════════════════════════════════════════════
    // TIMER
    // ═══════════════════════════════════════════════════════════
    function startRealtimeTimer() {
      stopTimer();

      if (!timerStartMs) {
        LOG.warn('TIMER', 'timerStartMs belum di-set');
        return;
      }

      timerDisplay.classList.remove('hidden');
      lastTimerSecond = -1;

      const tick = () => {
        const now = Date.now();
        const elapsedSeconds = Math.floor((now - timerStartMs) / 1000);
        const remainingSeconds = Math.max(0, SCORE_CONFIG.TOTAL_TIME_SECONDS - elapsedSeconds);

        const mins = Math.floor(remainingSeconds / 60);
        const secs = remainingSeconds % 60;
        timerText.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

        if (remainingSeconds <= 30) {
          timerText.parentElement.className = "bg-rose-500/20 border border-rose-500/50 px-3 py-1.5 rounded-xl text-xs font-bold text-rose-300";
        } else if (remainingSeconds <= 60) {
          timerText.parentElement.className = "bg-amber-500/20 border border-amber-500/50 px-3 py-1.5 rounded-xl text-xs font-bold text-amber-300";
        } else {
          timerText.parentElement.className = "bg-emerald-500/20 border border-emerald-500/50 px-3 py-1.5 rounded-xl text-xs font-bold text-emerald-300";
        }

        if (remainingSeconds <= 0 && lastTimerSecond > 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          LOG.warn('TIMER', '⏰ Timer habis, freeze kiosk');
          freezeKiosk('timeout', 'timeout');
        }

        lastTimerSecond = remainingSeconds;
      };

      tick();
      timerInterval = setInterval(tick, 500);

      LOG.ok('TIMER', `Started. Remaining: ${SCORE_CONFIG.TOTAL_TIME_SECONDS - Math.floor((Date.now() - timerStartMs) / 1000)}s`);
    }

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    // ═══════════════════════════════════════════════════════════
    // HITUNG SKOR
    // ═══════════════════════════════════════════════════════════
    function calculateScoreFromUpdatedAt(updatedAtString) {
      if (!updatedAtString) return SCORE_CONFIG.MIN_POINT;

      const startTime = new Date(updatedAtString).getTime();
      const now = Date.now();
      const elapsedSeconds = (now - startTime) / 1000;
      const remainingSeconds = Math.max(0, SCORE_CONFIG.TOTAL_TIME_SECONDS - elapsedSeconds);

      const range = SCORE_CONFIG.MAX_POINT - SCORE_CONFIG.MIN_POINT;
      const rawScore = SCORE_CONFIG.MIN_POINT + ((remainingSeconds / SCORE_CONFIG.TOTAL_TIME_SECONDS) * range);

      return parseFloat(rawScore.toFixed(2));
    }

    // ═══════════════════════════════════════════════════════════
    // LOAD PESERTA
    // ═══════════════════════════════════════════════════════════
    async function loadAllParticipants() {
      if (!supabaseClient) return;

      const { data, error } = await supabaseClient
        .from('users')
        .select('*')
        .eq('role', 'peserta');

      if (error) {
        LOG.error('KIOSK', 'Gagal ambil data peserta', error);
        alert('Gagal mengambil data peserta');
        return;
      }

      allUsers = data || [];
      renderSchools();
    }

    function renderSchools() {
      const schools = [...new Set(allUsers.map(u => u.school_name))].filter(Boolean);
      schoolList.innerHTML = '';

      if (schools.length === 0) {
        schoolList.innerHTML = '<p class="text-slate-500 text-center py-4">Belum ada peserta terdaftar.</p>';
        return;
      }

      schools.forEach(school => {
        const btn = document.createElement('button');
        btn.className = 'w-full text-left p-4 bg-slate-700 hover:bg-slate-600 border border-slate-600 rounded-2xl font-bold text-slate-100 flex items-center justify-between transition';
        btn.innerHTML = `<span>🏫 ${school}</span> <span class="text-xs text-amber-400">Pilih →</span>`;
        btn.onclick = () => selectSchool(school);
        if (isFrozen) btn.disabled = true;
        schoolList.appendChild(btn);
      });
    }

    function selectSchool(schoolName) {
      selectedSchool = schoolName;
      stepSchool.classList.add('hidden');
      stepStudent.classList.remove('hidden');

      const filteredStudents = allUsers.filter(u => u.school_name === schoolName);
      studentList.innerHTML = '';

      filteredStudents.forEach(student => {
        const btn = document.createElement('button');
        btn.className = 'w-full text-left p-4 bg-slate-700 hover:bg-slate-600 border border-slate-600 rounded-2xl font-bold text-slate-100 flex items-center justify-between transition';
        btn.innerHTML = `<span>👤 ${student.full_name}</span> <span class="text-xs text-amber-400">Jawab →</span>`;
        btn.onclick = () => openCalculator(student);
        if (isFrozen) btn.disabled = true;
        studentList.appendChild(btn);
      });
    }

    document.getElementById('btnBackToSchool').onclick = () => {
      stepStudent.classList.add('hidden');
      stepSchool.classList.remove('hidden');
    };

    document.getElementById('btnCancelCalc').onclick = resetToStart;

    async function openCalculator(student) {
      if (isFrozen) {
        alert('Sesi belum dimulai atau sedang dibekukan.');
        return;
      }

      selectedStudent = student;
      valBlue = "-";
      valRed = "-";
      document.getElementById('displayBlue').textContent = "-";
      document.getElementById('displayRed').textContent = "-";

      document.getElementById('selectedStudentName').textContent = student.full_name;
      document.getElementById('selectedStudentSchool').textContent = student.school_name;

      stepStudent.classList.add('hidden');
      stepCalculator.classList.remove('hidden');

      // ⭐ Reset active panel ke biru setiap buka kalkulator
      activePanel = 'blue';

      await loadQuestionData();
      await checkInputLimits();
      startRealtimeTimer();

      LOG.ok('KIOSK', `Calculator opened for ${student.full_name}`);
    }

    // ═══════════════════════════════════════════════════════════
    // LOAD DATA SOAL
    // ═══════════════════════════════════════════════════════════
    async function loadQuestionData() {
      const { data, error } = await supabaseClient
        .from('system_number_disco_question')
        .select('blue_answer, red_answer, generated_at, updated_at')
        .eq('id', 1)
        .maybeSingle();

      if (error || !data) {
        LOG.error('KIOSK', 'Gagal load soal', error);
        return;
      }

      targetAnswerBlue = data.blue_answer;
      targetAnswerRed = data.red_answer;

      const timestamp = data.generated_at || data.updated_at;
      timerStartMs = new Date(timestamp).getTime();

      LOG.ok('KIOSK', `Soal loaded: Blue=${targetAnswerBlue}, Red=${targetAnswerRed}`);
      LOG.info('KIOSK', `Timer start: ${timestamp}`);
    }

    // ═══════════════════════════════════════════════════════════
    // KUOTA PESERTA
    // ═══════════════════════════════════════════════════════════
    async function getOrInitInputLeft(userUniqueId, color) {
      let { data } = await supabaseClient
        .from('system_input_max_number_disco')
        .select('input_left')
        .eq('user_unique_id', userUniqueId)
        .eq('color', color)
        .maybeSingle();

      if (!data) {
        const { data: newData } = await supabaseClient
          .from('system_input_max_number_disco')
          .insert([{ user_unique_id: userUniqueId, color: color, input_left: DEFAULT_QUOTA }])
          .select('input_left')
          .single();

        return newData ? newData.input_left : DEFAULT_QUOTA;
      }

      return data.input_left;
    }

    async function checkInputLimits() {
      if (!selectedStudent) return;

      inputLeftBlue = await getOrInitInputLeft(selectedStudent.unique_id, 'blue');
      inputLeftRed = await getOrInitInputLeft(selectedStudent.unique_id, 'red');

      LOG.info('QUOTA', `Blue=${inputLeftBlue}, Red=${inputLeftRed}`);

      updatePanelLocks();
    }

    // ═══════════════════════════════════════════════════════════
    // ✅ UPDATE PANEL LOCKS (FIXED VERSION)
    // - Lock visual per panel (bukan paksa switch)
    // - Auto-switch HANYA kalau panel aktif sekarang locked
    // - Badge "HABIS" saat kuota 0
    // - Lock icon muncul saat locked
    // ═══════════════════════════════════════════════════════════
    function updatePanelLocks() {
      const pBlue = document.getElementById('panelBlue');
      const pRed = document.getElementById('panelRed');
      const tabBlue = document.getElementById('tabBlue');
      const tabRed = document.getElementById('tabRed');
      const badgeBlue = document.getElementById('badgeBlue');
      const badgeRed = document.getElementById('badgeRed');
      const lockIconBlue = document.getElementById('lockIconBlue');
      const lockIconRed = document.getElementById('lockIconRed');
      const btnSubmit = document.getElementById('btnSubmitAnswer');
      const btnText = document.getElementById('btnSubmitText');

      const blueLocked = inputLeftBlue <= 0;
      const redLocked = inputLeftRed <= 0;

      LOG.info('LOCKS', `BlueLocked=${blueLocked}, RedLocked=${redLocked}, active=${activePanel}`);

      // ═══════════════════════════════════════════════════════
      // 1. UPDATE BADGE
      // ═══════════════════════════════════════════════════════
      badgeBlue.textContent = blueLocked ? '🔒 HABIS' : `(Tersisa ${inputLeftBlue}x)`;
      badgeRed.textContent  = redLocked  ? '🔒 HABIS' : `(Tersisa ${inputLeftRed}x)`;

      // ═══════════════════════════════════════════════════════
      // 2. UPDATE LOCK ICON
      // ═══════════════════════════════════════════════════════
      if (blueLocked) lockIconBlue.classList.remove('hidden');
      else lockIconBlue.classList.add('hidden');

      if (redLocked) lockIconRed.classList.remove('hidden');
      else lockIconRed.classList.add('hidden');

      // ═══════════════════════════════════════════════════════
      // 3. AUTO-SWITCH HANYA KALAU PANEL AKTIF LOCKED
      // ═══════════════════════════════════════════════════════
      const activeIsLocked =
        (activePanel === 'blue' && blueLocked) ||
        (activePanel === 'red' && redLocked);

      if (activeIsLocked) {
        if (!blueLocked) {
          activePanel = 'blue';
          LOG.info('LOCKS', 'Auto-switch → blue');
        } else if (!redLocked) {
          activePanel = 'red';
          LOG.info('LOCKS', 'Auto-switch → red');
        }
      }

      // ═══════════════════════════════════════════════════════
      // 4. VISUAL: PANEL BIRU
      // ═══════════════════════════════════════════════════════
      if (blueLocked) {
        // Biru LOCKED — visual abu-abu
        pBlue.className = "cursor-not-allowed border-2 rounded-2xl p-3 bg-slate-950 text-right transition border-slate-800 panel-locked";
        tabBlue.className = "py-2.5 px-3 rounded-xl border text-xs font-bold transition flex flex-col items-center gap-1 bg-slate-950 border-slate-800 text-slate-600 tab-locked";
        tabBlue.disabled = true;
      } else if (activePanel === 'blue') {
        // Biru AKTIF
        pBlue.className = "cursor-pointer border-2 rounded-2xl p-3 bg-slate-950 text-right transition border-blue-500 ring-2 ring-blue-500/30";
        tabBlue.className = "py-2.5 px-3 rounded-xl border text-xs font-bold transition flex flex-col items-center gap-1 bg-blue-900/40 border-blue-500 text-blue-300";
        tabBlue.disabled = false;
      } else {
        // Biru IDLE (available tapi tidak aktif)
        pBlue.className = "cursor-pointer border-2 rounded-2xl p-3 bg-slate-950 text-right transition border-slate-700 opacity-60";
        tabBlue.className = "py-2.5 px-3 rounded-xl border text-xs font-bold transition flex flex-col items-center gap-1 bg-slate-900 border-slate-700 text-slate-400";
        tabBlue.disabled = false;
      }

      // ═══════════════════════════════════════════════════════
      // 5. VISUAL: PANEL MERAH
      // ═══════════════════════════════════════════════════════
      if (redLocked) {
        // Merah LOCKED — visual abu-abu
        pRed.className = "cursor-not-allowed border-2 rounded-2xl p-3 bg-slate-950 text-right transition border-slate-800 panel-locked";
        tabRed.className = "py-2.5 px-3 rounded-xl border text-xs font-bold transition flex flex-col items-center gap-1 bg-slate-950 border-slate-800 text-slate-600 tab-locked";
        tabRed.disabled = true;
      } else if (activePanel === 'red') {
        // Merah AKTIF
        pRed.className = "cursor-pointer border-2 rounded-2xl p-3 bg-slate-950 text-right transition border-red-500 ring-2 ring-red-500/30";
        tabRed.className = "py-2.5 px-3 rounded-xl border text-xs font-bold transition flex flex-col items-center gap-1 bg-red-900/40 border-red-500 text-red-300";
        tabRed.disabled = false;
      } else {
        // Merah IDLE
        pRed.className = "cursor-pointer border-2 rounded-2xl p-3 bg-slate-950 text-right transition border-slate-700 opacity-60";
        tabRed.className = "py-2.5 px-3 rounded-xl border text-xs font-bold transition flex flex-col items-center gap-1 bg-slate-900 border-slate-700 text-slate-400";
        tabRed.disabled = false;
      }

      // ═══════════════════════════════════════════════════════
      // 6. SUBMIT BUTTON STATE
      // ═══════════════════════════════════════════════════════
      if (isFrozen) {
        btnSubmit.disabled = true;
        btnText.textContent = "MENUNGGU SESI...";
        return;
      }

      if (blueLocked && redLocked) {
        btnSubmit.disabled = true;
        btnText.textContent = "BATAS PENGISIAN HABIS 🔒";
        return;
      }

      btnSubmit.disabled = false;
      btnText.textContent = "SUBMIT JAWABAN 🚀";
    }

    // ═══════════════════════════════════════════════════════════
    // ✅ SWITCH PANEL (FIXED)
    // - Block kalau panel locked
    // - Update activePanel + visual via updatePanelLocks
    // ═══════════════════════════════════════════════════════════
    function switchPanel(panel) {
      if (isFrozen) return;

      if (panel === 'blue' && inputLeftBlue <= 0) {
        LOG.warn('PANEL', 'Panel Biru locked, tidak bisa switch');
        return;
      }
      if (panel === 'red' && inputLeftRed <= 0) {
        LOG.warn('PANEL', 'Panel Merah locked, tidak bisa switch');
        return;
      }

      activePanel = panel;
      updatePanelLocks();
      LOG.info('PANEL', 'Switched to: ' + panel);
    }

    // ═══════════════════════════════════════════════════════════
    // KEYPAD (FIXED — cek lock lebih ketat)
    // ═══════════════════════════════════════════════════════════
    function appendCalc(val) {
      if (isFrozen) return;

      if (activePanel === 'blue') {
        if (inputLeftBlue <= 0) {
          LOG.warn('INPUT', 'Panel Biru locked, input ditolak');
          return;
        }
        if (valBlue === "-" || valBlue === "0") valBlue = val;
        else if (valBlue === "-0") valBlue = "-" + val;
        else if (valBlue.length < 10) valBlue += val;
        document.getElementById('displayBlue').textContent = valBlue;
      } else {
        if (inputLeftRed <= 0) {
          LOG.warn('INPUT', 'Panel Merah locked, input ditolak');
          return;
        }
        if (valRed === "-" || valRed === "0") valRed = val;
        else if (valRed === "-0") valRed = "-" + val;
        else if (valRed.length < 10) valRed += val;
        document.getElementById('displayRed').textContent = valRed;
      }
    }

    function toggleNegative() {
      if (isFrozen) return;
      if (activePanel === 'blue') {
        if (inputLeftBlue <= 0) return;
        if (valBlue.startsWith("-")) valBlue = valBlue.substring(1);
        else valBlue = "-" + valBlue;
        document.getElementById('displayBlue').textContent = valBlue;
      } else {
        if (inputLeftRed <= 0) return;
        if (valRed.startsWith("-")) valRed = valRed.substring(1);
        else valRed = "-" + valRed;
        document.getElementById('displayRed').textContent = valRed;
      }
    }

    function clearCalc() {
      if (isFrozen) return;
      if (activePanel === 'blue') {
        if (inputLeftBlue <= 0) return;
        valBlue = "-";
        document.getElementById('displayBlue').textContent = "-";
      } else {
        if (inputLeftRed <= 0) return;
        valRed = "-";
        document.getElementById('displayRed').textContent = "-";
      }
    }

    function deleteCalc() {
      if (isFrozen) return;
      if (activePanel === 'blue') {
        if (inputLeftBlue <= 0) return;
        if (valBlue !== "-" && valBlue.length > 0) {
          valBlue = valBlue.slice(0, -1);
          if (valBlue === "" || valBlue === "-") valBlue = "-";
        }
        document.getElementById('displayBlue').textContent = valBlue;
      } else {
        if (inputLeftRed <= 0) return;
        if (valRed !== "-" && valRed.length > 0) {
          valRed = valRed.slice(0, -1);
          if (valRed === "" || valRed === "-") valRed = "-";
        }
        document.getElementById('displayRed').textContent = valRed;
      }
    }

    // ═══════════════════════════════════════════════════════════
    // SUBMIT (FIXED — refresh kuota sebelum & sesudah submit)
    // ═══════════════════════════════════════════════════════════
    async function submitAnswer() {
      if (isSubmitting || isFrozen || !selectedStudent) return;

      // Re-check timer
      if (timerStartMs) {
        const elapsed = Math.floor((Date.now() - timerStartMs) / 1000);
        const remaining = SCORE_CONFIG.TOTAL_TIME_SECONDS - elapsed;
        if (remaining <= 0) {
          LOG.warn('SUBMIT', 'Timer sudah habis, submit ditolak');
          alert('Waktu sudah habis!');
          freezeKiosk('timeout', 'timeout');
          return;
        }
      }

      isSubmitting = true;
      stopTimer();
      document.getElementById('btnSubmitText').textContent = 'MEMPROSES...';

      const inserts = [];
      const results = [];
      const limitsToUpdate = [];

      // Re-fetch soal terbaru (anti race condition)
      await loadQuestionData();

      // ⭐ Re-fetch kuota terbaru dari DB (anti race condition dengan admin)
      inputLeftBlue = await getOrInitInputLeft(selectedStudent.unique_id, 'blue');
      inputLeftRed = await getOrInitInputLeft(selectedStudent.unique_id, 'red');

      LOG.info('SUBMIT', `Kuota realtime: Blue=${inputLeftBlue}, Red=${inputLeftRed}`);

      // Evaluasi Biru
      if (valBlue !== "-" && valBlue !== "-0" && inputLeftBlue > 0) {
        const isCorrectBlue = Number(valBlue) === targetAnswerBlue;
        const scoreBlue = isCorrectBlue ? calculateScoreFromUpdatedAt(new Date(timerStartMs).toISOString()) : 0;

        inserts.push({
          user_unique_id: selectedStudent.unique_id,
          game_name: 'Number Disco Blue',
          score_obtained: scoreBlue
        });
        results.push({
          team: 'BIRU',
          val: valBlue,
          isCorrect: isCorrectBlue,
          earnedScore: scoreBlue,
          colorClass: 'text-blue-300'
        });
        limitsToUpdate.push({ color: 'blue', newLeft: inputLeftBlue - 1 });
      }

      // Evaluasi Merah
      if (valRed !== "-" && valRed !== "-0" && inputLeftRed > 0) {
        const isCorrectRed = Number(valRed) === targetAnswerRed;
        const scoreRed = isCorrectRed ? calculateScoreFromUpdatedAt(new Date(timerStartMs).toISOString()) : 0;

        inserts.push({
          user_unique_id: selectedStudent.unique_id,
          game_name: 'Number Disco Red',
          score_obtained: scoreRed
        });
        results.push({
          team: 'MERAH',
          val: valRed,
          isCorrect: isCorrectRed,
          earnedScore: scoreRed,
          colorClass: 'text-rose-300'
        });
        limitsToUpdate.push({ color: 'red', newLeft: inputLeftRed - 1 });
      }

      if (inserts.length === 0) {
        alert("Silakan isi setidaknya satu jawaban (Biru atau Merah)!");
        isSubmitting = false;
        document.getElementById('btnSubmitText').textContent = 'SUBMIT JAWABAN 🚀';
        startRealtimeTimer();
        return;
      }

      // Insert ke game_scores
      const { error: scoreErr } = await supabaseClient
        .from('game_scores')
        .insert(inserts);

      if (scoreErr) {
        LOG.error('SUBMIT', 'Gagal insert score', scoreErr);
        alert("Gagal mengirim jawaban: " + scoreErr.message);
        isSubmitting = false;
        document.getElementById('btnSubmitText').textContent = 'SUBMIT JAWABAN 🚀';
        startRealtimeTimer();
        return;
      }

      // Update kuota di DB
      for (const item of limitsToUpdate) {
        await supabaseClient
          .from('system_input_max_number_disco')
          .update({ input_left: item.newLeft })
          .eq('user_unique_id', selectedStudent.unique_id)
          .eq('color', item.color);
      }

      // ⭐ Update state lokal setelah DB update
      for (const item of limitsToUpdate) {
        if (item.color === 'blue') inputLeftBlue = item.newLeft;
        if (item.color === 'red') inputLeftRed = item.newLeft;
      }

      LOG.ok('SUBMIT', `Submitted: ${results.map(r => r.team + '=' + r.val).join(', ')}`);
      LOG.info('SUBMIT', `Sisa kuota: Blue=${inputLeftBlue}, Red=${inputLeftRed}`);

      triggerFlashEffect(results);
    }

    function triggerFlashEffect(results) {
      const overlay = document.getElementById('flashOverlay');
      const allCorrect = results.every(r => r.isCorrect);

      overlay.className = `flash-screen ${allCorrect ? 'flash-correct' : 'flash-wrong'}`;

      let html = `<div class="text-[0.6em] mb-4">${allCorrect ? '🎉 SEMUA BENAR!' : 'HASIL EVALUASI'}</div>`;
      html += `<div class="flex flex-col gap-3 text-2xl font-bold bg-black/40 p-6 rounded-3xl border border-white/20 min-w-[320px]">`;

      results.forEach(res => {
        const icon = res.isCorrect ? `✅ +${res.earnedScore} PTS` : '❌ SALAH';
        html += `
          <div class="flex items-center justify-between gap-6 border-b border-white/10 pb-2 last:border-0 last:pb-0">
            <span class="${res.colorClass}">${res.team} (${res.val}):</span>
            <span>${icon}</span>
          </div>
        `;
      });

      html += `</div>`;
      overlay.innerHTML = html;
      overlay.classList.remove('hidden');

      setTimeout(() => {
        overlay.classList.add('hidden');
        isSubmitting = false;
        document.getElementById('btnSubmitText').textContent = 'SUBMIT JAWABAN 🚀';
        resetToStart();
        loadAllParticipants();
      }, 3000);
    }

    function resetToStart() {
      stopTimer();
      lastTimerSecond = -1;
      timerDisplay.classList.add('hidden');

      valBlue = "-";
      valRed = "-";
      selectedStudent = null;
      selectedSchool = '';

      stepCalculator.classList.add('hidden');
      stepStudent.classList.add('hidden');
      stepSchool.classList.remove('hidden');
    }

    // ═══════════════════════════════════════════════════════════
    // LISTENER CONTROL
    // ═══════════════════════════════════════════════════════════
    async function checkControlState() {
      const { data, error } = await supabaseClient
        .from('system_number_disco_control')
        .select('action, trigger_id, updated_at')
        .eq('id', 1)
        .maybeSingle();

      if (error || !data) return;

      const sig = `${data.action}|${data.trigger_id}|${data.updated_at}`;
      if (sig === lastControlSig) return;
      lastControlSig = sig;

      LOG.step('KIOSK', `Control action: ${data.action}, trigger: ${data.trigger_id}`);

      if (data.action === 'START_GAME') {
        unfreezeKiosk();
        await loadQuestionData();
        startRealtimeTimer();
        LOG.ok('KIOSK', 'Session started');
      } else if (data.action === 'RESET') {
        freezeKiosk('reset', 'waiting');
        resetToStart();
        LOG.warn('KIOSK', 'Session reset');
      }
    }

    function subscribeControl() {
      supabaseClient.channel('kiosk_control_channel')
        .on('postgres_changes', {
          event: 'UPDATE',
          schema: 'public',
          table: 'system_number_disco_control'
        }, () => {
          checkControlState();
        })
        .subscribe((status) => {
          LOG.info('REALTIME', 'Kiosk control channel: ' + status);
        });

      setInterval(checkControlState, 2000);
    }

    // ═══════════════════════════════════════════════════════════
    // REALTIME QUESTION UPDATE
    // ═══════════════════════════════════════════════════════════
    function subscribeQuestionUpdate() {
      supabaseClient.channel('kiosk_question_channel')
        .on('postgres_changes', {
          event: 'UPDATE',
          schema: 'public',
          table: 'system_number_disco_question'
        }, async (payload) => {
          if (!payload.new) return;
          handleQuestionUpdate(payload.new);
        })
        .subscribe((status) => {
          LOG.info('REALTIME', 'Kiosk question channel: ' + status);
        });

      setInterval(async () => {
        const { data } = await supabaseClient
          .from('system_number_disco_question')
          .select('blue_answer, red_answer, generated_at, updated_at')
          .eq('id', 1)
          .maybeSingle();

        if (data) handleQuestionUpdate(data);
      }, 3000);
    }

    function handleQuestionUpdate(data) {
      const timestamp = data.generated_at || data.updated_at;
      const sig = `${data.blue_answer}|${data.red_answer}|${timestamp}`;

      if (sig === lastQuestionSig) return;
      lastQuestionSig = sig;

      LOG.step('KIOSK', `Soal baru terdeteksi: Blue=${data.blue_answer}, Red=${data.red_answer}`);

      targetAnswerBlue = data.blue_answer;
      targetAnswerRed = data.red_answer;
      timerStartMs = new Date(timestamp).getTime();
      lastTimerSecond = -1;

      if (selectedStudent && !isFrozen) {
        startRealtimeTimer();
      }
    }

    // ═══════════════════════════════════════════════════════════
    // INIT
    // ═══════════════════════════════════════════════════════════
    async function init() {
      LOG.ok('INIT', '══════════ KIOSK BOOT ══════════');

      await loadAllParticipants();
      await checkControlState();

      if (lastControlSig === '') {
        freezeKiosk('initial', 'waiting');
      }

      subscribeControl();
      subscribeQuestionUpdate();

      LOG.ok('INIT', '══════════ KIOSK READY ══════════');
    }

    // Expose untuk onclick
    window.switchPanel = switchPanel;
    window.appendCalc = appendCalc;
    window.toggleNegative = toggleNegative;
    window.clearCalc = clearCalc;
    window.deleteCalc = deleteCalc;
    window.submitAnswer = submitAnswer;

    init();
  </script>
</body>
</html>
