<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arithmatic Bingo - Peserta</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    .bingo-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 6px;
    }
    .bingo-cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      border-radius: 8px;
      user-select: none;
      touch-action: manipulation;
    }
    @keyframes flashGreen {
      0%, 100% { box-shadow: 0 0 0 rgba(16, 185, 129, 0); }
      50% { box-shadow: 0 0 20px rgba(16, 185, 129, 0.9); }
    }
    .flash-correct { animation: flashGreen 0.5s ease-in-out; }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between max-w-md mx-auto p-4">

  <!-- AUDIO BELL -->
  <audio id="bellSound"
    src="https://endlrberfaxqhjrpvoss.supabase.co/storage/v1/object/public/sounds_effect/bell.mp3"
    preload="auto"></audio>

  <!-- DEBUG BADGE (hapus kalau sudah production) -->
  <div id="debugBadge"
       class="fixed top-2 right-2 text-[10px] font-mono bg-black/70 border border-white/10 rounded-lg px-2 py-1 text-slate-400 z-50 pointer-events-none">
    <span id="dbgState">booting</span> · <span id="dbgQ">#-</span> · <span id="dbgSync">--</span>
  </div>

  <!-- HEADER -->
  <div class="bg-slate-800 p-4 rounded-xl border border-white/10 flex justify-between items-center shadow-lg">
    <div>
      <p id="playerName" class="text-xs text-gray-400">Loading...</p>
      <h1 class="text-lg font-black text-amber-400">ARITHMATIC BINGO</h1>
    </div>
    <div class="text-right">
      <p class="text-[10px] text-gray-400 uppercase tracking-widest">Total Skor</p>
      <p id="totalScoreText" class="text-2xl font-black text-green-400">0</p>
    </div>
  </div>

  <!-- SOAL & TIMER -->
  <div class="my-4 bg-gradient-to-r from-amber-500/20 via-slate-800 to-indigo-500/20 p-4 rounded-xl border border-amber-500/30 text-center relative overflow-hidden">
    <div class="flex justify-between items-center mb-2">
      <span id="questionNum" class="text-xs font-bold text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded">Soal #-</span>
      <span id="timerDisplay" class="text-xs font-mono font-bold text-rose-400">
        <i class="fas fa-clock mr-1"></i>00:20
      </span>
    </div>
    <h2 id="questionText" class="text-2xl font-extrabold text-white my-2">Menunggu Admin...</h2>
    <p id="statusMsg" class="text-xs text-gray-400">Jawab sebelum waktu habis!</p>
  </div>

  <!-- TAB SELECTOR -->
  <div class="flex justify-between gap-1 mb-2">
    <button onclick="switchBoard(0)" id="tab-0" class="board-tab flex-1 py-1.5 text-xs font-bold rounded-lg bg-amber-500 text-slate-900">Papan 1</button>
    <button onclick="switchBoard(1)" id="tab-1" class="board-tab flex-1 py-1.5 text-xs font-bold rounded-lg bg-slate-800 text-gray-400">Papan 2</button>
    <button onclick="switchBoard(2)" id="tab-2" class="board-tab flex-1 py-1.5 text-xs font-bold rounded-lg bg-slate-800 text-gray-400">Papan 3</button>
    <button onclick="switchBoard(3)" id="tab-3" class="board-tab flex-1 py-1.5 text-xs font-bold rounded-lg bg-slate-800 text-gray-400">Papan 4</button>
    <button onclick="switchBoard(4)" id="tab-4" class="board-tab flex-1 py-1.5 text-xs font-bold rounded-lg bg-slate-800 text-gray-400">Papan 5</button>
  </div>

  <!-- GRID -->
  <div id="gridContainer" class="bingo-grid bg-slate-800/80 p-3 rounded-2xl border border-white/5 shadow-2xl flex-1"></div>

<script>
// ═══════════════════════════════════════════════════════════
// KONFIG
// ═══════════════════════════════════════════════════════════
const SUPABASE_URL = 'https://endlrberfaxqhjrpvoss.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ts7-cOhRLAKGP4dqa4nExA_6hCktIHa';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const QUESTION_DURATION = 20;      // detik
const POLL_INTERVAL_MS = 1000;     // fallback polling
const TIMER_TICK_MS = 200;         // resolusi timer display
const FLUSH_DEBOUNCE_MS = 500;     // debounce insert skor
const TAG = '[KIOSK]';

// ═══════════════════════════════════════════════════════════
// LOGGER
// ═══════════════════════════════════════════════════════════
const LOG = {
  ok:   (m, d) => console.log(`%c${TAG} ✅ ${m}`, 'color:#10b981;font-weight:bold', d ?? ''),
  info: (m, d) => console.log(`%c${TAG} ℹ️ ${m}`, 'color:#3b82f6;font-weight:bold', d ?? ''),
  warn: (m, d) => console.warn(`%c${TAG} ⚠️ ${m}`, 'color:#f59e0b;font-weight:bold', d ?? ''),
  err:  (m, d) => console.error(`%c${TAG} ❌ ${m}`, 'color:#ef4444;font-weight:bold', d ?? '')
};

// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
const STATE = {
  // User
  user: null,

  // Papan
  boards: [],
  boardStates: [],
  lineBonusClaimed: [[], [], [], [], []],
  currentBoardIndex: 0,

  // Soal aktif
  activeQuestionNum: 0,
  activeAnswer: null,
  isQuestionActive: false,

  // Timer
  timerInterval: null,
  timerEndAt: 0,

  // Skor
  scoreAccumulated: 0,
  pendingPoints: 0,
  flushTimer: null,

  // Guard
  isProcessing: false,

  // Signature tracking
  lastProcessedSig: '',
  lastQuestionNum: 0,

  // Realtime
  realtimeConnected: false
};

// ═══════════════════════════════════════════════════════════
// UI HELPERS
// ═══════════════════════════════════════════════════════════
const UI = {
  setText(id, txt) { const el = document.getElementById(id); if (el) el.textContent = txt; },
  setHTML(id, html) { const el = document.getElementById(id); if (el) el.innerHTML = html; },
  debug(state, qNum, sync = null) {
    UI.setText('dbgState', state);
    UI.setText('dbgQ', `#${qNum}`);
    if (sync !== null) UI.setText('dbgSync', sync);
  }
};

// ═══════════════════════════════════════════════════════════
// AUDIO
// ═══════════════════════════════════════════════════════════
function playBell() {
  const bell = document.getElementById('bellSound');
  if (!bell) return;
  try {
    bell.currentTime = 0;
    bell.play().catch(() => LOG.warn('Autoplay diblokir browser'));
  } catch (e) { LOG.warn('Bell error', e); }
}

// ═══════════════════════════════════════════════════════════
// USER INIT
// ═══════════════════════════════════════════════════════════
function initUser() {
  try {
    const sess = localStorage.getItem('userSession');
    if (!sess) {
      LOG.warn('Tidak ada userSession, redirect ke login');
      window.location.href = '/login.html';
      return false;
    }
    STATE.user = JSON.parse(sess);
    if (!STATE.user?.unique_id) {
      LOG.err('userSession tidak punya unique_id', STATE.user);
      return false;
    }
    UI.setText('playerName', STATE.user.full_name || STATE.user.unique_id);
    LOG.ok('User ready', STATE.user.unique_id);
    return true;
  } catch (e) {
    LOG.err('initUser exception', e);
    return false;
  }
}

// ═══════════════════════════════════════════════════════════
// GENERATE BOARD (99 unik + 26 duplikat = 125 angka untuk 5 papan)
// ═══════════════════════════════════════════════════════════
function generateBingoBoards() {
  STATE.boards = [];
  STATE.boardStates = [];
  STATE.lineBonusClaimed = [[], [], [], [], []];

  const primaryPool = Array.from({ length: 99 }, (_, i) => i + 1);
  const duplicatePool = [...primaryPool].sort(() => Math.random() - 0.5).slice(0, 26);
  const finalPool = [...primaryPool, ...duplicatePool].sort(() => Math.random() - 0.5);

  for (let b = 0; b < 5; b++) {
    const board = [];
    const stateBoard = [];
    for (let r = 0; r < 5; r++) {
      for (let c = 0; c < 5; c++) {
        const val = finalPool.pop();
        board.push(val);
        stateBoard.push({ val, status: 'default', row: r, col: c });
      }
    }
    STATE.boards.push(board);
    STATE.boardStates.push(stateBoard);
  }
  LOG.ok('Board generated (5 papan × 25 angka)');
}

// ═══════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════
function renderBoard(boardIdx) {
  const container = document.getElementById('gridContainer');
  if (!container) return;
  container.innerHTML = '';

  const state = STATE.boardStates[boardIdx];
  state.forEach((cell, idx) => {
    const btn = document.createElement('button');
    btn.className = 'bingo-cell text-sm transition-all duration-200 ';

    if (cell.status === 'default') {
      btn.className += 'bg-slate-700 text-white hover:bg-slate-600 active:scale-95';
    } else if (cell.status === 'correct') {
      btn.className += 'bg-emerald-500 text-slate-900 font-extrabold shadow-lg shadow-emerald-500/50';
    } else if (cell.status === 'wrong') {
      btn.className += 'bg-rose-600 text-white line-through opacity-60';
    }

    btn.textContent = String(cell.val).padStart(2, '0');
    btn.onclick = () => handleCellClick(boardIdx, idx);
    container.appendChild(btn);
  });
}

function switchBoard(idx) {
  STATE.currentBoardIndex = idx;
  document.querySelectorAll('.board-tab').forEach((tab, i) => {
    tab.className = i === idx
      ? 'board-tab flex-1 py-1.5 text-xs font-bold rounded-lg bg-amber-500 text-slate-900'
      : 'board-tab flex-1 py-1.5 text-xs font-bold rounded-lg bg-slate-800 text-gray-400';
  });
  renderBoard(idx);
}

// ═══════════════════════════════════════════════════════════
// CLICK HANDLER
// ═══════════════════════════════════════════════════════════
async function handleCellClick(boardIdx, cellIdx) {
  if (!STATE.isQuestionActive || STATE.activeAnswer === null) return;
  if (STATE.isProcessing) return;

  const cell = STATE.boardStates[boardIdx][cellIdx];
  if (cell.status !== 'default') return;

  STATE.isProcessing = true;

  if (cell.val === STATE.activeAnswer) {
    cell.status = 'correct';
    addPoints(1, 'Jawaban Benar (+1)');
    checkBingoBonus(boardIdx);
  } else {
    cell.status = 'wrong';
    addPoints(-1, 'Salah Tekan (-1)');
  }

  renderBoard(STATE.currentBoardIndex);
  STATE.isProcessing = false;
}

// ═══════════════════════════════════════════════════════════
// BINGO BONUS
// ═══════════════════════════════════════════════════════════
function checkBingoBonus(boardIdx) {
  const state = STATE.boardStates[boardIdx];

  for (let r = 0; r < 5; r++) {
    const tag = `R-${r}`;
    if (!STATE.lineBonusClaimed[boardIdx].includes(tag)) {
      const rowCells = state.filter(c => c.row === r);
      if (rowCells.every(c => c.status === 'correct')) {
        STATE.lineBonusClaimed[boardIdx].push(tag);
        addPoints(5, `BINGO Baris ${r + 1} (+5)`);
      }
    }
  }

  for (let c = 0; c < 5; c++) {
    const tag = `C-${c}`;
    if (!STATE.lineBonusClaimed[boardIdx].includes(tag)) {
      const colCells = state.filter(cell => cell.col === c);
      if (colCells.every(cell => cell.status === 'correct')) {
        STATE.lineBonusClaimed[boardIdx].push(tag);
        addPoints(5, `BINGO Kolom ${c + 1} (+5)`);
      }
    }
  }
}

// ═══════════════════════════════════════════════════════════
// POINTS (debounced)
// ═══════════════════════════════════════════════════════════
function addPoints(pts, reason) {
  STATE.scoreAccumulated += pts;
  STATE.pendingPoints += pts;

  UI.setText('totalScoreText', STATE.scoreAccumulated);
  UI.setText('statusMsg', reason);

  if (!STATE.flushTimer) {
    STATE.flushTimer = setTimeout(flushPendingPoints, FLUSH_DEBOUNCE_MS);
  }
}

async function flushPendingPoints() {
  if (STATE.flushTimer) {
    clearTimeout(STATE.flushTimer);
    STATE.flushTimer = null;
  }
  if (STATE.pendingPoints === 0) return;

  const toSend = STATE.pendingPoints;
  STATE.pendingPoints = 0;

  try {
    const { error } = await supabaseClient.from('game_scores').insert({
      user_unique_id: STATE.user.unique_id,
      game_name: 'Bingo Math',
      score_obtained: toSend
    });
    if (error) LOG.err('Insert score error', error);
    else LOG.ok(`Score flushed: ${toSend} pts`);
  } catch (e) {
    LOG.err('Insert exception', e);
    // Kembalikan poin ke pending kalau gagal
    STATE.pendingPoints += toSend;
  }
}

// ═══════════════════════════════════════════════════════════
// 🎯 RESET SESI BARU
// Dipanggil ketika admin memulai game baru (Q#1 dari Q#>1)
// atau saat admin clear (Q#0).
// ═══════════════════════════════════════════════════════════
function resetBoardsForNewSession(reason = 'new-session') {
  LOG.warn(`🔄 RESET SESI (${reason})`);

  // Flush sisa poin sesi lama
  flushPendingPoints();

  // Reset state papan & skor
  STATE.boards = [];
  STATE.boardStates = [];
  STATE.lineBonusClaimed = [[], [], [], [], []];
  STATE.currentBoardIndex = 0;
  STATE.scoreAccumulated = 0;
  STATE.pendingPoints = 0;
  STATE.isProcessing = false;

  // Reset state soal
  STATE.activeQuestionNum = 0;
  STATE.activeAnswer = null;
  STATE.isQuestionActive = false;
  STATE.lastQuestionNum = 0;

  // Reset timer
  if (STATE.timerInterval) {
    clearInterval(STATE.timerInterval);
    STATE.timerInterval = null;
  }
  STATE.timerEndAt = 0;

  // Reset signature (biar data berikutnya diproses)
  STATE.lastProcessedSig = '';

  // Regenerate papan baru
  generateBingoBoards();
  renderBoard(0);

  // Reset UI
  UI.setText('totalScoreText', 0);
  UI.setText('questionNum', 'Soal #-');
  UI.setText('questionText', 'Menunggu Admin...');
  UI.setText('statusMsg', 'Sesi baru! Bersiap...');
  UI.setHTML('timerDisplay', '<i class="fas fa-clock mr-1"></i>00:20');
  UI.debug('reset', 0);

  // Reset tab ke Papan 1
  document.querySelectorAll('.board-tab').forEach((tab, i) => {
    tab.className = i === 0
      ? 'board-tab flex-1 py-1.5 text-xs font-bold rounded-lg bg-amber-500 text-slate-900'
      : 'board-tab flex-1 py-1.5 text-xs font-bold rounded-lg bg-slate-800 text-gray-400';
  });

  LOG.ok('✅ Papan & skor sudah di-reset');
}

// ═══════════════════════════════════════════════════════════
// ⭐ CORE: PROCESS DATA DARI ADMIN
// Single entry point — semua update soal lewat sini
// ═══════════════════════════════════════════════════════════
function processQuestionData(data) {
  if (!data) return;

  // ─── Signature guard: skip kalau data sama persis ───
  const sig = `${data.question_number}|${data.start_time}|${data.is_active}`;
  if (sig === STATE.lastProcessedSig) return;
  STATE.lastProcessedSig = sig;

  const prevQNum = STATE.lastQuestionNum;
  const currQNum = data.question_number || 0;

  LOG.info(`Data masuk: Q#${currQNum}, active=${data.is_active}, prevQ=#${prevQNum}`);

  // ═══════════════════════════════════════════════════════
  // 🎯 DETEKSI SESI BARU
  // ═══════════════════════════════════════════════════════
  // Sesi baru terdeteksi kalau:
  //   (a) Soal #1 muncul & sebelumnya BUKAN #1 (dan bukan #0 yg baru reset)
  //   (b) Nomor soal turun tajam (misal #50 → #1) tapi BUKAN via clear (#0)
  // Kalau lewat clear (#0), akan di-handle di kondisi WAITING di bawah.
  const isNewSessionStart =
    currQNum === 1 && prevQNum > 1;

  const isNumberReset =
    currQNum > 0 && prevQNum > currQNum && currQNum > 1;

  if (isNewSessionStart || isNumberReset) {
    LOG.ok(`🎮 SESI BARU terdeteksi (prev #${prevQNum} → #${currQNum})`);
    resetBoardsForNewSession('detect-new-session');
    // lastProcessedSig sudah di-reset, tapi kita restore supaya Q#1 ini
    // tetap diproses di bawah
    STATE.lastProcessedSig = sig;
  }

  // ═══════════════════════════════════════════════════════
  // KONDISI A: Admin clear / belum mulai (Q#0 / is_active=false)
  // ═══════════════════════════════════════════════════════
  if (!data.is_active || currQNum === 0) {
    LOG.warn('State: WAITING / CLEARED');

    // Kalau sebelumnya ada sesi aktif → reset papan
    if (prevQNum > 0) {
      resetBoardsForNewSession('admin-clear');
      // Setelah reset, STATE.lastQuestionNum = 0. Restore signature.
      STATE.lastProcessedSig = sig;
    }

    STATE.isQuestionActive = false;
    STATE.activeAnswer = null;
    STATE.activeQuestionNum = 0;
    STATE.lastQuestionNum = 0;

    if (STATE.timerInterval) {
      clearInterval(STATE.timerInterval);
      STATE.timerInterval = null;
    }

    UI.setText('questionNum', 'Soal #-');
    UI.setText('questionText', 'Menunggu Admin...');
    UI.setText('statusMsg', 'Jawab sebelum waktu habis!');
    UI.setHTML('timerDisplay', '<i class="fas fa-clock mr-1"></i>00:20');
    UI.debug('waiting', 0);
    return;
  }

  // ═══════════════════════════════════════════════════════
  // KONDISI B: Soal valid
  // ═══════════════════════════════════════════════════════
  const isNewQuestion = currQNum !== STATE.lastQuestionNum;

  if (!isNewQuestion) {
    // Nomor soal sama → cek apakah timer lokal sudah habis
    if (STATE.isQuestionActive) {
      // Timer masih jalan, cukup update sync indicator
      UI.debug('active', currQNum, 'poll-ok');
      return;
    }
    LOG.info(`Resync Q#${currQNum} (timer lokal habis)`);
  }

  LOG.ok(`Proses soal #${currQNum}`);
  flushPendingPoints();

  STATE.lastQuestionNum = currQNum;
  STATE.activeQuestionNum = currQNum;
  STATE.activeAnswer = data.correct_answer;
  STATE.isQuestionActive = true;

  UI.setText('questionNum', `Soal #${currQNum}`);
  UI.setText('questionText', data.question_text || 'SIAP MEMULAI?');
  UI.setText('statusMsg', 'Cari jawaban di 5 papanmu!');
  UI.debug('active', currQNum);

  playBell();

  // ─── Timer sync dari start_time ───
  let remaining = QUESTION_DURATION;
  if (data.start_time) {
    const startMs = new Date(data.start_time).getTime();
    const elapsed = Math.floor((Date.now() - startMs) / 1000);
    remaining = Math.max(0, QUESTION_DURATION - elapsed);
    LOG.info(`Timer sync: elapsed=${elapsed}s, remaining=${remaining}s`);
  }
  startTimer(remaining);
}

// ═══════════════════════════════════════════════════════════
// TIMER (timestamp-based, anti-lag)
// ═══════════════════════════════════════════════════════════
function startTimer(secondsLeft) {
  if (STATE.timerInterval) {
    clearInterval(STATE.timerInterval);
    STATE.timerInterval = null;
  }

  if (secondsLeft <= 0) {
    LOG.warn('Soal masuk setelah waktu habis — langsung timeup');
    STATE.isQuestionActive = false;
    UI.setText('statusMsg', 'Waktu Habis! Soal ditutup.');
    UI.setText('questionText', '⏰ Menunggu soal berikutnya...');
    updateTimerDisplay(0);
    flushPendingPoints();
    UI.debug('timeup', STATE.activeQuestionNum);
    return;
  }

  STATE.timerEndAt = Date.now() + (secondsLeft * 1000);

  const tick = () => {
    const remaining = Math.max(0, Math.ceil((STATE.timerEndAt - Date.now()) / 1000));
    updateTimerDisplay(remaining);

    if (remaining <= 0) {
      clearInterval(STATE.timerInterval);
      STATE.timerInterval = null;
      STATE.isQuestionActive = false;
      UI.setText('statusMsg', 'Waktu Habis! Soal ditutup.');
      UI.setText('questionText', '⏰ Menunggu soal berikutnya...');
      UI.debug('timeup', STATE.activeQuestionNum);
      flushPendingPoints();
      LOG.warn(`⏰ Waktu habis Q#${STATE.activeQuestionNum}`);
    }
  };

  updateTimerDisplay(secondsLeft);
  STATE.timerInterval = setInterval(tick, TIMER_TICK_MS);
}

function updateTimerDisplay(seconds) {
  const s = seconds < 10 ? `0${seconds}` : seconds;
  UI.setHTML('timerDisplay', `<i class="fas fa-clock mr-1"></i>00:${s}`);
}

// ═══════════════════════════════════════════════════════════
// SUBSCRIBE: Realtime + Polling fallback
// ═══════════════════════════════════════════════════════════
function subscribeToAdmin() {
  // 1. Realtime listener
  supabaseClient
    .channel('kiosk_bingo_rt')
    .on('postgres_changes', {
      event: '*',
      schema: 'public',
      table: 'system_arithmatic_bingo'
    }, payload => {
      LOG.info('⚡ Realtime event');
      if (payload.new) processQuestionData(payload.new);
    })
    .subscribe(status => {
      LOG.info(`Realtime: ${status}`);
      STATE.realtimeConnected = (status === 'SUBSCRIBED');
      UI.debug(
        STATE.isQuestionActive ? 'active' : 'ready',
        STATE.lastQuestionNum,
        STATE.realtimeConnected ? 'rt' : 'poll'
      );
    });

  // 2. Polling fallback
  setInterval(async () => {
    try {
      const { data, error } = await supabaseClient
        .from('system_arithmatic_bingo')
        .select('*')
        .eq('id', 1)
        .maybeSingle();

      if (!error && data) processQuestionData(data);
      UI.debug(
        STATE.isQuestionActive ? 'active' : 'ready',
        STATE.lastQuestionNum,
        STATE.realtimeConnected ? 'rt' : 'poll'
      );
    } catch (e) { /* silent */ }
  }, POLL_INTERVAL_MS);
}

// ═══════════════════════════════════════════════════════════
// SAFETY FLUSH saat tab close
// ═══════════════════════════════════════════════════════════
window.addEventListener('beforeunload', () => {
  if (STATE.pendingPoints !== 0 && STATE.user) {
    try {
      supabaseClient.from('game_scores').insert({
        user_unique_id: STATE.user.unique_id,
        game_name: 'Bingo Math',
        score_obtained: STATE.pendingPoints
      });
    } catch (e) { /* silent */ }
  }
});

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
async function init() {
  LOG.ok('══════════ KIOSK BOOT ══════════');

  if (!initUser()) return;

  generateBingoBoards();
  renderBoard(0);
  UI.debug('ready', 0);

  // Fetch state awal
  try {
    const { data, error } = await supabaseClient
      .from('system_arithmatic_bingo')
      .select('*')
      .eq('id', 1)
      .maybeSingle();

    if (error) LOG.err('Initial fetch error', error);
    if (data) processQuestionData(data);
  } catch (e) { LOG.err('Initial fetch exception', e); }

  // Subscribe
  subscribeToAdmin();

  LOG.ok('══════════ KIOSK READY ══════════');
}

// Expose untuk onclick
window.switchBoard = switchBoard;
window.handleCellClick = handleCellClick;

// Start
init();
</script>
