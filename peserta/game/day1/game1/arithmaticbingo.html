<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Arithmatic Bingo - Peserta</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      overscroll-behavior: none;
    }

    /* ═══════════════════════════════════════════════════════════
       BINGO GRID
       ═══════════════════════════════════════════════════════════ */
    .bingo-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 6px;
    }
    .bingo-cell-wrap {
      position: relative;
      width: 100%;
      padding-bottom: 100%;
    }
    .bingo-cell {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      border-radius: 8px;
      user-select: none;
      touch-action: manipulation;
      -webkit-appearance: none;
      border: none;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.15s, background 0.2s;
    }

    /* ═══════════════════════════════════════════════════════════
       ANIMASI — FASE SOAL
       ═══════════════════════════════════════════════════════════ */

    /* Soal muncul: zoom + shake */
    @keyframes questionPop {
      0% { opacity: 0; transform: scale(0.5) rotate(-5deg); }
      60% { opacity: 1; transform: scale(1.08) rotate(2deg); }
      100% { opacity: 1; transform: scale(1) rotate(0); }
    }
    .anim-question-pop {
      animation: questionPop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    /* Background flash saat soal baru */
    @keyframes bgFlash {
      0% { background-color: rgba(245, 158, 11, 0.4); }
      100% { background-color: rgba(30, 41, 59, 0); }
    }
    .anim-bg-flash {
      animation: bgFlash 0.7s ease-out;
    }

    /* Waiting: badge pulse */
    @keyframes waitingPulse {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    .anim-waiting-dot {
      animation: waitingPulse 1s ease-in-out infinite;
    }

    /* ═══════════════════════════════════════════════════════════
       ANIMASI — TIMER
       ═══════════════════════════════════════════════════════════ */

    /* Timer kritis (≤5s): shake + heartbeat */
    @keyframes timerShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-2px); }
      75% { transform: translateX(2px); }
    }
    @keyframes timerHeartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }
    .anim-timer-critical {
      animation: timerShake 0.4s ease-in-out infinite,
                 timerHeartbeat 0.6s ease-in-out infinite;
      color: #f43f5e !important;
      text-shadow: 0 0 12px rgba(244, 63, 94, 0.9);
    }

    /* Timer warning (≤10s): pulse lembut */
    @keyframes timerWarning {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    .anim-timer-warning {
      animation: timerWarning 0.8s ease-in-out infinite;
      color: #f59e0b !important;
      text-shadow: 0 0 8px rgba(245, 158, 11, 0.6);
    }

    /* ═══════════════════════════════════════════════════════════
       ANIMASI — KLIK BENAR / SALAH
       ═══════════════════════════════════════════════════════════ */

    @keyframes correctPop {
      0% { transform: scale(1); }
      40% { transform: scale(1.3); box-shadow: 0 0 30px rgba(16,185,129,1); }
      100% { transform: scale(1); }
    }
    .anim-correct-pop {
      animation: correctPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes wrongShake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .anim-wrong-shake {
      animation: wrongShake 0.4s ease-in-out;
    }

    /* ═══════════════════════════════════════════════════════════
       ANIMASI — BINGO BONUS
       ═══════════════════════════════════════════════════════════ */

    @keyframes bingoBurst {
      0% { opacity: 0; transform: scale(0.3) rotate(-15deg); }
      50% { opacity: 1; transform: scale(1.15) rotate(5deg); }
      100% { opacity: 0; transform: scale(2) rotate(-5deg); }
    }
    .anim-bingo-burst {
      animation: bingoBurst 1.4s cubic-bezier(0.4, 0, 0.6, 1) forwards;
    }

    /* ═══════════════════════════════════════════════════════════
       ANIMASI — TIMEUP
       ═══════════════════════════════════════════════════════════ */

    @keyframes timeupFlash {
      0% { opacity: 0; transform: scale(0.5); }
      20% { opacity: 1; transform: scale(1.2); }
      40% { transform: scale(1); }
      100% { opacity: 1; transform: scale(1); }
    }
    .anim-timeup {
      animation: timeupFlash 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    /* ═══════════════════════════════════════════════════════════
       ANIMASI — SKOR
       ═══════════════════════════════════════════════════════════ */

    @keyframes scorePopUp {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-40px) scale(1.6); opacity: 0; }
    }
    .anim-score-popup {
      animation: scorePopUp 0.9s ease-out forwards;
      pointer-events: none;
    }

    @keyframes scoreFlashGreen {
      0% { transform: scale(1); color: #22c55e; }
      50% { transform: scale(1.3); color: #86efac; }
      100% { transform: scale(1); color: #22c55e; }
    }
    @keyframes scoreFlashRed {
      0% { transform: scale(1); color: #ef4444; }
      50% { transform: scale(0.85); color: #fca5a5; }
      100% { transform: scale(1); color: #ef4444; }
    }
    .anim-score-green { animation: scoreFlashGreen 0.5s ease-out; }
    .anim-score-red   { animation: scoreFlashRed 0.5s ease-out; }

    /* ═══════════════════════════════════════════════════════════
       ANIMASI — CONFETTI MINI
       ═══════════════════════════════════════════════════════════ */

    @keyframes confettiFall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(80px) rotate(720deg); opacity: 0; }
    }
    .confetti-piece {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 2px;
      pointer-events: none;
      animation: confettiFall 1s ease-out forwards;
    }

    /* ═══════════════════════════════════════════════════════════
       PULSE GLOW — SOAL AKTIF
       ═══════════════════════════════════════════════════════════ */

    @keyframes questionGlow {
      0%, 100% { box-shadow: 0 0 20px rgba(245, 158, 11, 0.3), inset 0 0 0 rgba(245, 158, 11, 0); }
      50% { box-shadow: 0 0 40px rgba(245, 158, 11, 0.7), inset 0 0 20px rgba(245, 158, 11, 0.1); }
    }
    .anim-question-glow {
      animation: questionGlow 2s ease-in-out infinite;
    }

    /* Screen shake global saat timeup */
    @keyframes screenShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    .anim-screen-shake {
      animation: screenShake 0.5s ease-in-out;
    }
  </style>
</head>

<script>
// ═══════════════════════════════════════════════════════════
// KONFIG
// ═══════════════════════════════════════════════════════════
const SUPABASE_URL = 'https://endlrberfaxqhjrpvoss.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ts7-cOhRLAKGP4dqa4nExA_6hCktIHa';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const QUESTION_DURATION = 20;
const POLL_INTERVAL_MS = 800;
const TIMER_TICK_MS = 200;
const FLUSH_DEBOUNCE_MS = 500;
const CLOCK_RESYNC_MS = 60000;
const TAG = '[KIOSK]';

// ═══════════════════════════════════════════════════════════
// LOGGER
// ═══════════════════════════════════════════════════════════
const LOG = {
  ok:   (m, d) => console.log(`%c${TAG} ✅ ${m}`, 'color:#10b981;font-weight:bold', d ?? ''),
  info: (m, d) => console.log(`%c${TAG} ℹ️ ${m}`, 'color:#3b82f6;font-weight:bold', d ?? ''),
  warn: (m, d) => console.warn(`%c${TAG} ⚠️ ${m}`, 'color:#f59e0b;font-weight:bold', d ?? ''),
  err:  (m, d) => console.error(`%c${TAG} ❌ ${m}`, 'color:#ef4444;font-weight:bold', d ?? '')
};

// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
const STATE = {
  user: null,
  boards: [],
  boardStates: [],
  lineBonusClaimed: [[], [], [], [], []],
  currentBoardIndex: 0,

  activeQuestionNum: 0,
  activeAnswer: null,
  isQuestionActive: false,

  timerInterval: null,
  timerEndAt: 0,
  lastTimerWarningState: '',  // '', 'warning', 'critical'

  scoreAccumulated: 0,
  pendingPoints: 0,
  flushTimer: null,

  isProcessing: false,
  lastSig: '',
  lastQuestionNum: 0,
  realtimeConnected: false,
  clockOffset: 0,
  clockSynced: false
};

// ═══════════════════════════════════════════════════════════
// UI HELPERS
// ═══════════════════════════════════════════════════════════
const UI = {
  setText(id, txt) { const el = document.getElementById(id); if (el) el.textContent = txt; },
  setHTML(id, html) { const el = document.getElementById(id); if (el) el.innerHTML = html; },
  debug(state, qNum, sync = null) {
    UI.setText('dbgState', state);
    UI.setText('dbgQ', `#${qNum}`);
    if (sync !== null) UI.setText('dbgSync', sync);
    UI.setText('dbgClock', `±${Math.round(STATE.clockOffset)}ms`);
  }
};

// ═══════════════════════════════════════════════════════════
// HAPTIC (getar HP)
// ═══════════════════════════════════════════════════════════
function vibrate(pattern) {
  if ('vibrate' in navigator) {
    try { navigator.vibrate(pattern); } catch (e) {}
  }
}

// ═══════════════════════════════════════════════════════════
// AUDIO
// ═══════════════════════════════════════════════════════════
function playBell() {
  const bell = document.getElementById('bellSound');
  if (!bell) return;
  try {
    bell.currentTime = 0;
    bell.play().catch(() => LOG.warn('Autoplay diblokir'));
  } catch (e) { LOG.warn('Bell error', e); }
}

function playBingo() {
  const b = document.getElementById('bingoSound');
  if (!b) return playBell();
  try {
    b.currentTime = 0;
    b.play().catch(() => playBell());
  } catch (e) { playBell(); }
}

// ═══════════════════════════════════════════════════════════
// ⭐ ANIMASI HELPERS
// ═══════════════════════════════════════════════════════════
function animAdd(el, className, duration = 800) {
  if (!el) return;
  el.classList.remove(className);
  void el.offsetWidth; // force reflow
  el.classList.add(className);
  setTimeout(() => el.classList.remove(className), duration);
}

function showBingoBurst(subText = '+5 POIN') {
  const el = document.getElementById('bingoBurst');
  if (!el) return;
  document.getElementById('bingoBurstSub').textContent = subText;
  el.classList.remove('hidden');
  el.classList.add('flex');
  animAdd(el.querySelector('div'), 'anim-bingo-burst', 1400);
  setTimeout(() => {
    el.classList.add('hidden');
    el.classList.remove('flex');
  }, 1400);
  playBingo();
  vibrate([50, 30, 50, 30, 100]);
}

function showTimeup() {
  const el = document.getElementById('timeupOverlay');
  if (!el) return;
  el.classList.remove('hidden');
  el.classList.add('flex');
  setTimeout(() => {
    el.classList.add('hidden');
    el.classList.remove('flex');
  }, 1800);
  // Screen shake
  animAdd(document.body, 'anim-screen-shake', 500);
  vibrate([200, 100, 200]);
}

function showScorePopup(points) {
  const container = document.getElementById('scorePopupContainer');
  if (!container) return;
  const el = document.createElement('div');
  const isPositive = points > 0;
  el.className = `absolute right-0 text-2xl font-black ${isPositive ? 'text-emerald-400' : 'text-rose-500'} anim-score-popup`;
  el.textContent = isPositive ? `+${points}` : `${points}`;
  container.appendChild(el);
  setTimeout(() => el.remove(), 900);
}

function flashScore(isPositive) {
  const el = document.getElementById('totalScoreText');
  if (!el) return;
  animAdd(el, isPositive ? 'anim-score-green' : 'anim-score-red', 500);
}

function spawnConfetti(anchorEl) {
  if (!anchorEl) return;
  const rect = anchorEl.getBoundingClientRect();
  const colors = ['#f59e0b', '#10b981', '#3b82f6', '#ef4444', '#a855f7'];
  for (let i = 0; i < 8; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = `${rect.left + rect.width / 2}px`;
    piece.style.top = `${rect.top + rect.height / 2}px`;
    piece.style.backgroundColor = colors[i % colors.length];
    piece.style.animationDelay = `${i * 40}ms`;
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 1200);
  }
}

// ═══════════════════════════════════════════════════════════
// ⭐ CLOCK SYNC
// ═══════════════════════════════════════════════════════════
async function syncClockOffset() {
  try {
    const t0 = Date.now();
    const { data, error } = await supabaseClient
      .from('system_arithmatic_bingo')
      .select('*')
      .eq('id', 1)
      .maybeSingle();
    const t1 = Date.now();

    if (error || !data) {
      STATE.clockOffset = 0;
      LOG.warn('Clock sync gagal, offset=0');
      return;
    }

    let serverTs = null;
    if (data.server_time) serverTs = new Date(data.server_time).getTime();
    else if (data.updated_at) serverTs = new Date(data.updated_at).getTime();

    if (!serverTs) {
      STATE.clockOffset = 0;
      return;
    }

    const rtt = t1 - t0;
    const localEstimate = t0 + (rtt / 2);
    STATE.clockOffset = serverTs - localEstimate;
    STATE.clockSynced = true;
    LOG.ok(`Clock offset: ${Math.round(STATE.clockOffset)}ms (RTT ${rtt}ms)`);
  } catch (e) {
    LOG.err('syncClockOffset exception', e);
    STATE.clockOffset = 0;
  }
}

function now() {
  return Date.now() + STATE.clockOffset;
}

// ═══════════════════════════════════════════════════════════
// USER
// ═══════════════════════════════════════════════════════════
function initUser() {
  try {
    const sess = localStorage.getItem('userSession');
    if (!sess) { window.location.href = '/login.html'; return false; }
    STATE.user = JSON.parse(sess);
    if (!STATE.user?.unique_id) return false;
    UI.setText('playerName', STATE.user.full_name || STATE.user.unique_id);
    LOG.ok('User ready', STATE.user.unique_id);
    return true;
  } catch (e) {
    LOG.err('initUser exception', e);
    return false;
  }
}

// ═══════════════════════════════════════════════════════════
// GENERATE BOARD
// ═══════════════════════════════════════════════════════════
function generateBingoBoards() {
  STATE.boards = [];
  STATE.boardStates = [];
  STATE.lineBonusClaimed = [[], [], [], [], []];

  const primaryPool = Array.from({ length: 99 }, (_, i) => i + 1);
  const duplicatePool = [...primaryPool].sort(() => Math.random() - 0.5).slice(0, 26);
  const finalPool = [...primaryPool, ...duplicatePool].sort(() => Math.random() - 0.5);

  for (let b = 0; b < 5; b++) {
    const board = [];
    const stateBoard = [];
    for (let r = 0; r < 5; r++) {
      for (let c = 0; c < 5; c++) {
        const val = finalPool.pop();
        board.push(val);
        stateBoard.push({ val, status: 'default', row: r, col: c });
      }
    }
    STATE.boards.push(board);
    STATE.boardStates.push(stateBoard);
  }
  LOG.ok('Board generated');
}

// ═══════════════════════════════════════════════════════════
// RENDER BOARD
// ═══════════════════════════════════════════════════════════
function renderBoard(boardIdx) {
  const container = document.getElementById('gridContainer');
  if (!container) return;
  container.innerHTML = '';

  const state = STATE.boardStates[boardIdx];
  state.forEach((cell, idx) => {
    const wrap = document.createElement('div');
    wrap.className = 'bingo-cell-wrap';

    const btn = document.createElement('button');
    btn.className = 'bingo-cell text-sm ';

    if (cell.status === 'default') {
      btn.className += 'bg-slate-700 text-white active:scale-95';
    } else if (cell.status === 'correct') {
      btn.className += 'bg-emerald-500 text-slate-900 font-extrabold shadow-lg shadow-emerald-500/50';
    } else if (cell.status === 'wrong') {
      btn.className += 'bg-rose-600 text-white line-through opacity-60';
    }

    btn.textContent = String(cell.val).padStart(2, '0');
    btn.onclick = () => handleCellClick(boardIdx, idx);
    wrap.appendChild(btn);
    container.appendChild(wrap);
  });
}

function switchBoard(idx) {
  STATE.currentBoardIndex = idx;
  document.querySelectorAll('.board-tab').forEach((tab, i) => {
    tab.className = i === idx
      ? 'board-tab flex-1 py-1.5 text-xs font-bold rounded-lg bg-amber-500 text-slate-900 transition-all'
      : 'board-tab flex-1 py-1.5 text-xs font-bold rounded-lg bg-slate-800 text-gray-400 transition-all';
  });
  renderBoard(idx);
}

// ═══════════════════════════════════════════════════════════
// CLICK HANDLER
// ═══════════════════════════════════════════════════════════
async function handleCellClick(boardIdx, cellIdx) {
  if (!STATE.isQuestionActive || STATE.activeAnswer === null) return;
  if (STATE.isProcessing) return;

  const cell = STATE.boardStates[boardIdx][cellIdx];
  if (cell.status !== 'default') return;

  STATE.isProcessing = true;

  // Cari elemen button yang diklik
  const wrap = document.getElementById('gridContainer').children[cellIdx];
  const btn = wrap?.querySelector('.bingo-cell');

  if (cell.val === STATE.activeAnswer) {
    cell.status = 'correct';
    animAdd(btn, 'anim-correct-pop', 500);
    spawnConfetti(btn);
    addPoints(1, 'Jawaban Benar (+1)');
    vibrate(30);
    checkBingoBonus(boardIdx);
  } else {
    cell.status = 'wrong';
    animAdd(btn, 'anim-wrong-shake', 400);
    addPoints(-1, 'Salah Tekan (-1)');
    vibrate([80, 40, 80]);
  }

  setTimeout(() => renderBoard(STATE.currentBoardIndex), 400);
  STATE.isProcessing = false;
}

// ═══════════════════════════════════════════════════════════
// BINGO BONUS
// ═══════════════════════════════════════════════════════════
function checkBingoBonus(boardIdx) {
  const state = STATE.boardStates[boardIdx];

  for (let r = 0; r < 5; r++) {
    const tag = `R-${r}`;
    if (!STATE.lineBonusClaimed[boardIdx].includes(tag)) {
      const rowCells = state.filter(c => c.row === r);
      if (rowCells.every(c => c.status === 'correct')) {
        STATE.lineBonusClaimed[boardIdx].push(tag);
        addPoints(5, `🎉 BINGO Baris ${r + 1}! (+5)`);
        showBingoBurst(`BINGO BARIS ${r + 1} · +5 POIN`);
      }
    }
  }

  for (let c = 0; c < 5; c++) {
    const tag = `C-${c}`;
    if (!STATE.lineBonusClaimed[boardIdx].includes(tag)) {
      const colCells = state.filter(cell => cell.col === c);
      if (colCells.every(cell => cell.status === 'correct')) {
        STATE.lineBonusClaimed[boardIdx].push(tag);
        addPoints(5, `🎉 BINGO Kolom ${c + 1}! (+5)`);
        showBingoBurst(`BINGO KOLOM ${c + 1} · +5 POIN`);
      }
    }
  }
}

// ═══════════════════════════════════════════════════════════
// POINTS
// ═══════════════════════════════════════════════════════════
function addPoints(pts, reason) {
  STATE.scoreAccumulated += pts;
  STATE.pendingPoints += pts;
  UI.setText('totalScoreText', STATE.scoreAccumulated);
  UI.setText('statusMsg', reason);

  // ⭐ Animasi skor
  flashScore(pts > 0);
  showScorePopup(pts);

  if (!STATE.flushTimer) {
    STATE.flushTimer = setTimeout(flushPendingPoints, FLUSH_DEBOUNCE_MS);
  }
}

async function flushPendingPoints() {
  if (STATE.flushTimer) {
    clearTimeout(STATE.flushTimer);
    STATE.flushTimer = null;
  }
  if (STATE.pendingPoints === 0) return;

  const toSend = STATE.pendingPoints;
  STATE.pendingPoints = 0;

  try {
    const { error } = await supabaseClient.from('game_scores').insert({
      user_unique_id: STATE.user.unique_id,
      game_name: 'Bingo Math',
      score_obtained: toSend
    });
    if (error) LOG.err('Insert score error', error);
    else LOG.ok(`Score flushed: ${toSend} pts`);
  } catch (e) {
    LOG.err('Insert exception', e);
    STATE.pendingPoints += toSend;
  }
}

// ═══════════════════════════════════════════════════════════
// RESET SESI BARU
// ═══════════════════════════════════════════════════════════
function resetBoardsForNewSession(reason = 'new-session') {
  LOG.warn(`🔄 RESET SESI (${reason})`);

  flushPendingPoints();

  STATE.boards = [];
  STATE.boardStates = [];
  STATE.lineBonusClaimed = [[], [], [], [], []];
  STATE.currentBoardIndex = 0;
  STATE.scoreAccumulated = 0;
  STATE.pendingPoints = 0;
  STATE.isProcessing = false;
  STATE.activeQuestionNum = 0;
  STATE.activeAnswer = null;
  STATE.isQuestionActive = false;
  STATE.lastQuestionNum = 0;
  STATE.lastTimerWarningState = '';

  if (STATE.timerInterval) {
    clearInterval(STATE.timerInterval);
    STATE.timerInterval = null;
  }
  STATE.timerEndAt = 0;

  generateBingoBoards();
  renderBoard(0);

  UI.setText('totalScoreText', 0);
  UI.setText('questionNum', 'Soal #-');
  UI.setText('questionText', 'Menunggu Admin...');
  UI.setText('statusMsg', 'Sesi baru! Bersiap...');
  UI.setHTML('timerDisplay', '<i class="fas fa-clock mr-1"></i>00:20');
  UI.debug('reset', 0);

  // Reset timer display class
  const timerEl = document.getElementById('timerDisplay');
  if (timerEl) timerEl.className = 'text-xs font-mono font-bold text-rose-400 transition-all';

  // Reset question card class
  const qCard = document.getElementById('questionCard');
  if (qCard) qCard.classList.remove('anim-question-glow');

  document.querySelectorAll('.board-tab').forEach((tab, i) => {
    tab.className = i === 0
      ? 'board-tab flex-1 py-1.5 text-xs font-bold rounded-lg bg-amber-500 text-slate-900 transition-all'
      : 'board-tab flex-1 py-1.5 text-xs font-bold rounded-lg bg-slate-800 text-gray-400 transition-all';
  });

  LOG.ok('✅ Papan & skor di-reset');
}

// ═══════════════════════════════════════════════════════════
// ⭐ CORE: PROCESS DATA DARI ADMIN
// ═══════════════════════════════════════════════════════════
function processQuestionData(data) {
  if (!data) return;

  const sig = `${data.question_number || 0}|${data.start_time || ''}|${data.is_active ? 1 : 0}`;
  if (sig === STATE.lastSig) return;
  STATE.lastSig = sig;

  const prevQNum = STATE.lastQuestionNum;
  const currQNum = data.question_number || 0;

  LOG.info(`Data masuk: Q#${currQNum}, active=${data.is_active}, prevQ=#${prevQNum}`);

  // Deteksi sesi baru
  const isNewSessionStart = (currQNum === 1 && prevQNum > 1);
  const isNumberReset = (currQNum > 0 && prevQNum > currQNum && currQNum > 1);

  if (isNewSessionStart || isNumberReset) {
    LOG.ok(`🎮 SESI BARU (prev #${prevQNum} → #${currQNum})`);
    resetBoardsForNewSession('detect-new-session');
    STATE.lastSig = sig;
  }

  // ═══ KONDISI A: WAITING / CLEARED ═══
  if (!data.is_active || currQNum === 0) {
    LOG.warn('State: WAITING / CLEARED');

    if (prevQNum > 0) {
      resetBoardsForNewSession('admin-clear');
      STATE.lastSig = sig;
    }

    STATE.isQuestionActive = false;
    STATE.activeAnswer = null;
    STATE.activeQuestionNum = 0;
    STATE.lastQuestionNum = 0;
    STATE.lastTimerWarningState = '';

    if (STATE.timerInterval) {
      clearInterval(STATE.timerInterval);
      STATE.timerInterval = null;
    }

    UI.setText('questionNum', 'Soal #-');
    UI.setText('questionText', 'Menunggu Admin...');
    UI.setText('statusMsg', 'Jawab sebelum waktu habis!');
    UI.setHTML('timerDisplay', '<i class="fas fa-clock mr-1"></i>00:20');
    UI.debug('waiting', 0);

    // Reset kelas timer
    const timerEl = document.getElementById('timerDisplay');
    if (timerEl) timerEl.className = 'text-xs font-mono font-bold text-rose-400 transition-all';

    const qCard = document.getElementById('questionCard');
    if (qCard) qCard.classList.remove('anim-question-glow');

    // Show waiting indicator
    const wi = document.getElementById('waitingIndicator');
    if (wi) wi.classList.remove('hidden');

    return;
  }

  // ═══ KONDISI B: Soal valid ═══
  const isNewQuestion = currQNum !== STATE.lastQuestionNum;

  if (!isNewQuestion) {
    if (STATE.isQuestionActive) {
      UI.debug('active', currQNum, 'poll-ok');
      return;
    }
    LOG.info(`Resync Q#${currQNum}`);
  }

  LOG.ok(`Proses soal #${currQNum}`);
  flushPendingPoints();

  STATE.lastQuestionNum = currQNum;
  STATE.activeQuestionNum = currQNum;
  STATE.activeAnswer = data.correct_answer;
  STATE.isQuestionActive = true;
  STATE.lastTimerWarningState = '';

  UI.setText('questionNum', `Soal #${currQNum}`);
  UI.setText('questionText', data.question_text || 'SIAP MEMULAI?');
  UI.setText('statusMsg', 'Cari jawaban di 5 papanmu!');
  UI.debug('active', currQNum);

  // ⭐ Animasi soal muncul
  const qCard = document.getElementById('questionCard');
  const qText = document.getElementById('questionText');
  if (qCard) {
    animAdd(qCard, 'anim-bg-flash', 700);
    qCard.classList.add('anim-question-glow');
  }
  if (qText) animAdd(qText, 'anim-question-pop', 600);

  // Sembunyikan waiting indicator
  const wi = document.getElementById('waitingIndicator');
  if (wi) wi.classList.add('hidden');

  playBell();
  vibrate(50);

  // Hitung timer pakai jam server
  let remaining = QUESTION_DURATION;
  if (data.start_time) {
    const startMs = new Date(data.start_time).getTime();
    const elapsed = Math.floor((now() - startMs) / 1000);
    remaining = Math.max(0, QUESTION_DURATION - elapsed);
    LOG.info(`Timer sync: elapsed=${elapsed}s, remaining=${remaining}s`);
  }
  startTimer(remaining);
}

// ═══════════════════════════════════════════════════════════
// TIMER dengan animasi warning
// ═══════════════════════════════════════════════════════════
function startTimer(secondsLeft) {
  if (STATE.timerInterval) {
    clearInterval(STATE.timerInterval);
    STATE.timerInterval = null;
  }

  if (secondsLeft <= 0) {
    LOG.warn('Soal masuk setelah waktu habis');
    STATE.isQuestionActive = false;
    UI.setText('statusMsg', 'Waktu Habis!');
    UI.setText('questionText', '⏰ Menunggu soal berikutnya...');
    updateTimerDisplay(0);
    showTimeup();
    flushPendingPoints();
    UI.debug('timeup', STATE.activeQuestionNum);
    return;
  }

  STATE.timerEndAt = now() + (secondsLeft * 1000);

  const tick = () => {
    const remaining = Math.max(0, Math.ceil((STATE.timerEndAt - now()) / 1000));
    updateTimerDisplay(remaining);

    if (remaining <= 0) {
      clearInterval(STATE.timerInterval);
      STATE.timerInterval = null;
      STATE.isQuestionActive = false;
      UI.setText('statusMsg', 'Waktu Habis! Soal ditutup.');
      UI.setText('questionText', '⏰ Menunggu soal berikutnya...');
      UI.debug('timeup', STATE.activeQuestionNum);
      showTimeup();
      flushPendingPoints();

      const qCard = document.getElementById('questionCard');
      if (qCard) qCard.classList.remove('anim-question-glow');

      LOG.warn(`⏰ Waktu habis Q#${STATE.activeQuestionNum}`);
    }
  };

  updateTimerDisplay(secondsLeft);
  STATE.timerInterval = setInterval(tick, TIMER_TICK_MS);
}

function updateTimerDisplay(seconds) {
  const s = seconds < 10 ? `0${seconds}` : seconds;
  const el = document.getElementById('timerDisplay');
  if (!el) return;

  el.innerHTML = `<i class="fas fa-clock mr-1"></i>00:${s}`;

  // ⭐ Animasi timer berdasarkan sisa waktu
  const newState = seconds <= 5 ? 'critical' : (seconds <= 10 ? 'warning' : '');
  if (newState !== STATE.lastTimerWarningState) {
    STATE.lastTimerWarningState = newState;
    el.classList.remove('anim-timer-warning', 'anim-timer-critical');

    if (newState === 'critical') {
      el.classList.add('anim-timer-critical');
      if (seconds === 5) vibrate(30);
    } else if (newState === 'warning') {
      el.classList.add('anim-timer-warning');
    }
  }
}

// ═══════════════════════════════════════════════════════════
// SUBSCRIBE
// ═══════════════════════════════════════════════════════════
function subscribeToAdmin() {
  supabaseClient
    .channel('kiosk_bingo_rt')
    .on('postgres_changes', {
      event: '*',
      schema: 'public',
      table: 'system_arithmatic_bingo'
    }, payload => {
      LOG.info('⚡ Realtime event');
      if (payload.new) processQuestionData(payload.new);
    })
    .subscribe(status => {
      LOG.info(`Realtime: ${status}`);
      STATE.realtimeConnected = (status === 'SUBSCRIBED');
      UI.debug(
        STATE.isQuestionActive ? 'active' : 'ready',
        STATE.lastQuestionNum,
        STATE.realtimeConnected ? 'rt' : 'poll'
      );
    });

  setInterval(async () => {
    try {
      const { data, error } = await supabaseClient
        .from('system_arithmatic_bingo')
        .select('*')
        .eq('id', 1)
        .maybeSingle();

      if (!error && data) processQuestionData(data);
      UI.debug(
        STATE.isQuestionActive ? 'active' : 'ready',
        STATE.lastQuestionNum,
        STATE.realtimeConnected ? 'rt' : 'poll'
      );
    } catch (e) {}
  }, POLL_INTERVAL_MS);
}

// ═══════════════════════════════════════════════════════════
// SAFETY FLUSH
// ═══════════════════════════════════════════════════════════
window.addEventListener('beforeunload', () => {
  if (STATE.pendingPoints !== 0 && STATE.user) {
    try {
      supabaseClient.from('game_scores').insert({
        user_unique_id: STATE.user.unique_id,
        game_name: 'Bingo Math',
        score_obtained: STATE.pendingPoints
      });
    } catch (e) {}
  }
});

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
async function init() {
  LOG.ok('══════════ KIOSK BOOT ══════════');

  if (!initUser()) return;

  generateBingoBoards();
  renderBoard(0);
  UI.debug('ready', 0);

  LOG.info('Syncing clock...');
  await syncClockOffset();

  try {
    const { data, error } = await supabaseClient
      .from('system_arithmatic_bingo')
      .select('*')
      .eq('id', 1)
      .maybeSingle();

    if (error) LOG.err('Initial fetch error', error);
    if (data) processQuestionData(data);
  } catch (e) { LOG.err('Initial fetch exception', e); }

  subscribeToAdmin();
  setInterval(syncClockOffset, CLOCK_RESYNC_MS);

  LOG.ok('══════════ KIOSK READY ══════════');
}

window.switchBoard = switchBoard;
window.handleCellClick = handleCellClick;

init();
</script>
