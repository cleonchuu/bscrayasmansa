<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arithmatic Bingo - Peserta</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    .bingo-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 6px;
    }
    .bingo-cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      border-radius: 8px;
      user-select: none;
      touch-action: manipulation;
    }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between max-w-md mx-auto p-4">

  <!-- AUDIO BEL PLAYER (SUPABASE BUCKET) -->
  <audio id="bellSound" src="https://endlrberfaxqhjrpvoss.supabase.co/storage/v1/object/public/sounds_effect/bell.mp3" preload="auto"></audio>

  <!-- Header Info -->
  <div class="bg-slate-800 p-4 rounded-xl border border-white/10 flex justify-between items-center shadow-lg">
    <div>
      <p id="playerName" class="text-xs text-gray-400">Loading...</p>
      <h1 class="text-lg font-black text-amber-400">ARITHMATIC BINGO</h1>
    </div>
    <div class="text-right">
      <p class="text-[10px] text-gray-400 uppercase tracking-widest">Total Skor</p>
      <p id="totalScoreText" class="text-2xl font-black text-green-400">0</p>
    </div>
  </div>

  <!-- Soal & Timer Section -->
  <div class="my-4 bg-gradient-to-r from-amber-500/20 via-slate-800 to-indigo-500/20 p-4 rounded-xl border border-amber-500/30 text-center relative overflow-hidden">
    <div class="flex justify-between items-center mb-2">
      <span id="questionNum" class="text-xs font-bold text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded">Soal #-</span>
      <span id="timerDisplay" class="text-xs font-mono font-bold text-rose-400"><i class="fas fa-clock mr-1"></i>00:20</span>
    </div>
    <h2 id="questionText" class="text-2xl font-extrabold text-white my-2">Menunggu Admin...</h2>
    <p id="statusMsg" class="text-xs text-gray-400">Jawab sebelum waktu habis!</p>
  </div>

  <!-- Tab Selector 5 Board Bingo -->
  <div class="flex justify-between gap-1 mb-2">
    <button onclick="switchBoard(0)" id="tab-0" class="board-tab flex-1 py-1.5 text-xs font-bold rounded-lg bg-amber-500 text-slate-900">Papan 1</button>
    <button onclick="switchBoard(1)" id="tab-1" class="board-tab flex-1 py-1.5 text-xs font-bold rounded-lg bg-slate-800 text-gray-400">Papan 2</button>
    <button onclick="switchBoard(2)" id="tab-2" class="board-tab flex-1 py-1.5 text-xs font-bold rounded-lg bg-slate-800 text-gray-400">Papan 3</button>
    <button onclick="switchBoard(3)" id="tab-3" class="board-tab flex-1 py-1.5 text-xs font-bold rounded-lg bg-slate-800 text-gray-400">Papan 4</button>
    <button onclick="switchBoard(4)" id="tab-4" class="board-tab flex-1 py-1.5 text-xs font-bold rounded-lg bg-slate-800 text-gray-400">Papan 5</button>
  </div>

  <!-- Grid Bingo (5x5) -->
  <div id="gridContainer" class="bingo-grid bg-slate-800/80 p-3 rounded-2xl border border-white/5 shadow-2xl flex-1">
    <!-- OVERLAY FREEZE -->
    <div id="freezeOverlay" class="absolute inset-0 z-40 bg-slate-950/85 backdrop-blur-sm flex flex-col items-center justify-center rounded-2xl pointer-events-none transition-opacity duration-300">
      <div class="p-5 bg-slate-800/80 rounded-full border border-amber-500/30 text-amber-400 mb-3 animate-pulse">
        <i class="fas fa-lock text-3xl"></i>
      </div>
      <h3 class="text-lg font-black text-white tracking-wide">PAPAN DIBEKUKAN</h3>
      <p class="text-xs text-slate-400 mt-1 px-6 text-center">Menunggu admin memulai permainan...</p>
    </div>
  </div>

  <script>
    // ═══════════════════════════════════════════════════════════
    // KONFIGURASI
    // ═══════════════════════════════════════════════════════════
    const supabaseUrl = 'https://endlrberfaxqhjrpvoss.supabase.co';
    const supabaseKey = 'sb_publishable_ts7-cOhRLAKGP4dqa4nExA_6hCktIHa';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    const QUESTION_DURATION = 20; // detik

    // ═══════════════════════════════════════════════════════════
    // STATE
    // ═══════════════════════════════════════════════════════════
    let currentBoardIndex = 0;
    let boards = [];              // 5 Board x 25 Angka = 125 Angka
    let boardStates = [];         // Status per sel
    let lineBonusClaimed = [[], [], [], [], []];

    let activeAnswer = null;
    let activeQuestionNum = 0;
    let timerInterval = null;
    let scoreAccumulated = 0;
    let userSession = null;
    let isQuestionActive = false;

    // Guard spam
    let isProcessing = false;

    // ✅ FITUR BARU: freeze & session tracking
    let isFrozen = true;              // default: beku saat load
    let currentSessionId = null;      // ID sesi game (dari start_time soal #1)
    let lastSessionId = null;         // untuk deteksi "game baru"

    // Debounce poin ke DB
    let pendingPoints = 0;
    let flushTimer = null;

    // Tracking soal
    let lastQuestionNum = -1;

    // ═══════════════════════════════════════════════════════════
    // AUDIO
    // ═══════════════════════════════════════════════════════════
    function playBell() {
      const bell = document.getElementById('bellSound');
      if (bell) {
        bell.currentTime = 0;
        bell.play().catch(() => {
          console.log("[KIOSK] Autoplay audio diblokir browser.");
        });
      }
    }

    // ═══════════════════════════════════════════════════════════
    // GENERATE BINGO BOARDS (125 angka: 99 unik + 26 duplikat)
    // ═══════════════════════════════════════════════════════════
    function generateBingoBoards() {
      boards = [];
      boardStates = [];
      lineBonusClaimed = [[], [], [], [], []];

      let primaryPool = Array.from({ length: 99 }, (_, i) => i + 1);
      let duplicatePool = [...primaryPool].sort(() => Math.random() - 0.5).slice(0, 26);
      let finalPool = [...primaryPool, ...duplicatePool].sort(() => Math.random() - 0.5);

      for (let b = 0; b < 5; b++) {
        let board = [];
        let stateBoard = [];
        for (let r = 0; r < 5; r++) {
          for (let c = 0; c < 5; c++) {
            let val = finalPool.pop();
            board.push(val);
            stateBoard.push({ val: val, status: 'default', row: r, col: c });
          }
        }
        boards.push(board);
        boardStates.push(stateBoard);
      }
    }

    // ═══════════════════════════════════════════════════════════
    // INIT USER
    // ═══════════════════════════════════════════════════════════
    function initUser() {
      const sess = localStorage.getItem('userSession');
      if (!sess) {
        window.location.href = '/login.html';
        return;
      }
      userSession = JSON.parse(sess);
      document.getElementById('playerName').textContent = userSession.full_name || userSession.unique_id;
      console.log('[KIOSK] User:', userSession.unique_id);
    }

    // ═══════════════════════════════════════════════════════════
    // RENDER BOARD
    // ═══════════════════════════════════════════════════════════
    function renderBoard(boardIdx) {
      const container = document.getElementById('gridContainer');
      container.innerHTML = '';
      const state = boardStates[boardIdx];

      state.forEach((cell, idx) => {
        const btn = document.createElement('button');
        btn.className = `bingo-cell text-sm transition-all duration-200 `;

        if (cell.status === 'default') {
          btn.className += 'bg-slate-700 text-white hover:bg-slate-600 active:scale-95';
        } else if (cell.status === 'correct') {
          btn.className += 'bg-emerald-500 text-slate-900 font-extrabold shadow-lg shadow-emerald-500/50';
        } else if (cell.status === 'wrong') {
          btn.className += 'bg-rose-600 text-white line-through opacity-60';
        }

        const formattedVal = String(cell.val).padStart(2, '0');
        btn.textContent = formattedVal;

        btn.onclick = () => handleCellClick(boardIdx, idx);
        container.appendChild(btn);
      });
    }

    function switchBoard(idx) {
      currentBoardIndex = idx;
      document.querySelectorAll('.board-tab').forEach((tab, i) => {
        if (i === idx) {
          tab.className = 'board-tab flex-1 py-1.5 text-xs font-bold rounded-lg bg-amber-500 text-slate-900';
        } else {
          tab.className = 'board-tab flex-1 py-1.5 text-xs font-bold rounded-lg bg-slate-800 text-gray-400';
        }
      });
      renderBoard(idx);
    }

    // ═══════════════════════════════════════════════════════════
    // HANDLE CLICK — dengan guard spam
    // ═══════════════════════════════════════════════════════════
    async function handleCellClick(boardIdx, cellIdx) {
  // ✅ Guard: kiosk beku
  if (isFrozen) {
    console.log('[KIOSK] Kiosk beku, klik diabaikan.');
    return;
  }
  // Guard: soal harus aktif & ada kunci jawaban
  if (!isQuestionActive || activeAnswer === null) return;
  // Guard: cegah spam klik
  if (isProcessing) return;

  const cell = boardStates[boardIdx][cellIdx];
  // Guard: sel sudah pernah ditekan
  if (cell.status !== 'default') return;

  isProcessing = true;

  if (cell.val === activeAnswer) {
    cell.status = 'correct';
    await addPoints(1, 'Jawaban Benar (+1)');
    checkBingoBonus(boardIdx);
  } else {
    cell.status = 'wrong';
    await addPoints(-1, 'Salah Tekan (-1)');
  }

  renderBoard(currentBoardIndex);
  isProcessing = false;
}

    // ═══════════════════════════════════════════════════════════
    // BINGO BONUS (baris/kolom penuh = +5)
    // ═══════════════════════════════════════════════════════════
    function checkBingoBonus(boardIdx) {
      const state = boardStates[boardIdx];

      // Check 5 Baris
      for (let r = 0; r < 5; r++) {
        const rowTag = `R-${r}`;
        if (!lineBonusClaimed[boardIdx].includes(rowTag)) {
          const rowCells = state.filter(c => c.row === r);
          if (rowCells.every(c => c.status === 'correct')) {
            lineBonusClaimed[boardIdx].push(rowTag);
            addPoints(5, `BINGO Baris ${r + 1} (+5)`);
          }
        }
      }

      // Check 5 Kolom
      for (let c = 0; c < 5; c++) {
        const colTag = `C-${c}`;
        if (!lineBonusClaimed[boardIdx].includes(colTag)) {
          const colCells = state.filter(cell => cell.col === c);
          if (colCells.every(cell => cell.status === 'correct')) {
            lineBonusClaimed[boardIdx].push(colTag);
            addPoints(5, `BINGO Kolom ${c + 1} (+5)`);
          }
        }
      }
    }

    // ═══════════════════════════════════════════════════════════
    // ADD POINTS — debounced insert ke DB
    // ═══════════════════════════════════════════════════════════
    async function addPoints(pts, reason) {
      scoreAccumulated += pts;
      pendingPoints += pts;

      document.getElementById('totalScoreText').textContent = scoreAccumulated;
      document.getElementById('statusMsg').textContent = reason;

      // Debounce: kumpulkan poin, flush setiap 500ms
      if (!flushTimer) {
        flushTimer = setTimeout(async () => {
          const pointsToSend = pendingPoints;
          pendingPoints = 0;
          flushTimer = null;

          if (pointsToSend === 0) return;

          try {
            const { error } = await supabaseClient.from('game_scores').insert({
              user_unique_id: userSession.unique_id,
              game_name: 'Bingo Math',
              score_obtained: pointsToSend
            });
            if (error) console.error('[KIOSK] Insert score error:', error);
            else console.log(`[KIOSK] Score flushed: ${pointsToSend} pts`);
          } catch (err) {
            console.error('[KIOSK] Insert score exception:', err);
          }
        }, 500);
      }
    }

    // ═══════════════════════════════════════════════════════════
    // FLUSH PENDING POINTS (dipanggil saat soal berakhir)
    // ═══════════════════════════════════════════════════════════
    async function flushPendingPoints() {
      if (pendingPoints === 0) return;

      const pointsToSend = pendingPoints;
      pendingPoints = 0;

      if (flushTimer) {
        clearTimeout(flushTimer);
        flushTimer = null;
      }

      try {
        await supabaseClient.from('game_scores').insert({
          user_unique_id: userSession.unique_id,
          game_name: 'Bingo Math',
          score_obtained: pointsToSend
        });
        console.log(`[KIOSK] Final flush: ${pointsToSend} pts`);
      } catch (err) {
        console.error('[KIOSK] Final flush error:', err);
      }
    }

    // ═══════════════════════════════════════════════════════════
    // LISTEN TO ADMIN — Realtime + Polling Fallback
    // ═══════════════════════════════════════════════════════════
    function listenToAdmin() {
      console.log('[KIOSK] Setup listener...');

      // 1. Realtime Listener
      supabaseClient
        .channel('realtime_bingo')
        .on('postgres_changes', {
          event: '*',
          schema: 'public',
          table: 'system_arithmatic_bingo'
        }, payload => {
          const data = payload.new;
          if (data) handleIncomingQuestion(data);
        })
        .subscribe((status) => {
          console.log('[KIOSK] Realtime status:', status);
        });

      // 2. ✅ POLLING FALLBACK — setiap 1 detik
      setInterval(async () => {
        try {
          const { data, error } = await supabaseClient
            .from('system_arithmatic_bingo')
            .select('*')
            .eq('id', 1)
            .maybeSingle();

          if (!error && data) handleIncomingQuestion(data);
        } catch (err) {
          console.error('[KIOSK] Polling error:', err);
        }
      }, 1000);
    }

    // ═══════════════════════════════════════════════════════════
// ✅ FITUR BARU: FREEZE / UNFREEZE KIOSK
// ═══════════════════════════════════════════════════════════
function setFrozen(state) {
  isFrozen = state;
  const overlay = document.getElementById('freezeOverlay');
  const grid = document.getElementById('gridContainer');
  if (overlay) {
    overlay.style.opacity = state ? '1' : '0';
    overlay.style.pointerEvents = state ? 'auto' : 'none';
  }
  if (grid) {
    grid.classList.toggle('opacity-40', state);
    grid.classList.toggle('grayscale', state);
  }
  console.log(`[KIOSK] Freeze: ${state}`);
}

// ═══════════════════════════════════════════════════════════
// ✅ FITUR BARU: RESET SEL (bukan poin!)
// Dipanggil saat admin mulai game baru (soal #1)
// ═══════════════════════════════════════════════════════════
function resetBoardsCells() {
  // Reset semua status sel ke 'default', tapi angka tetap
  boardStates.forEach(board => {
    board.forEach(cell => {
      cell.status = 'default';
    });
  });
  lineBonusClaimed = [[], [], [], [], []];
  renderBoard(currentBoardIndex);
  console.log('[KIOSK] Sel di-reset (poin tetap).');
}

    // ═══════════════════════════════════════════════════════════
    // HANDLE INCOMING QUESTION — Hindari duplikat
    // ═══════════════════════════════════════════════════════════
    function handleIncomingQuestion(data) {
  // ─── KONDISI 1: Admin clear / belum mulai ───
  if (!data.is_active || data.question_number === 0) {
    if (isQuestionActive || lastQuestionNum !== -1) {
      console.log('[KIOSK] Admin clear/reset. Kembali ke waiting state.');

      isQuestionActive = false;
      activeAnswer = null;
      activeQuestionNum = 0;
      lastQuestionNum = -1;
      currentSessionId = null;

      clearInterval(timerInterval);
      timerInterval = null;

      document.getElementById('questionNum').textContent = 'Soal #-';
      document.getElementById('questionText').textContent = 'Menunggu Admin...';
      document.getElementById('statusMsg').textContent = 'Jawab sebelum waktu habis!';
      document.getElementById('timerDisplay').innerHTML = `<i class="fas fa-clock mr-1"></i>00:20`;
    }

    // ✅ Kiosk beku saat tidak ada soal aktif
    setFrozen(true);
    return;
  }

  // ─── KONDISI 2: Soal baru (nomor beda) ───
  if (data.question_number !== lastQuestionNum) {
    console.log(`[KIOSK] Soal baru #${data.question_number}`);
    lastQuestionNum = data.question_number;

    // ✅ DETEKSI GAME BARU: soal #1 = awal sesi baru
    // Pakai start_time sebagai session ID unik
    const sessionId = data.start_time || `session_${Date.now()}`;

    if (data.question_number === 1 || currentSessionId === null) {
      // Game baru dimulai → reset sel
      console.log('[KIOSK] 🎮 GAME BARU terdeteksi. Reset sel...');
      resetBoardsCells();
      currentSessionId = sessionId;
    } else if (sessionId !== currentSessionId) {
      // Sesi berubah (start_time beda) → tetap reset sel
      console.log('[KIOSK] 🔄 Sesi baru terdeteksi via start_time.');
      resetBoardsCells();
      currentSessionId = sessionId;
    }

    setupNewQuestion(data);
  }

  // ✅ Kiosk terbuka saat soal aktif
  setFrozen(false);
}

    // ═══════════════════════════════════════════════════════════
    // SETUP NEW QUESTION — Timer dari start_time DB
    // ═══════════════════════════════════════════════════════════
    function setupNewQuestion(data) {
      // Flush poin soal sebelumnya (kalau ada)
      flushPendingPoints();

      activeAnswer = data.correct_answer;
      activeQuestionNum = data.question_number;
      isQuestionActive = true;

      document.getElementById('questionNum').textContent = `Soal #${data.question_number}`;
      document.getElementById('questionText').textContent = data.question_text;
      document.getElementById('statusMsg').textContent = 'Cari jawaban di 5 papanmu!';

      // Putar Bunyi Bel
      playBell();

      // ✅ HITUNG TIMER DARI start_time (authoritative source)
      let remaining = QUESTION_DURATION;
      if (data.start_time) {
        const startMs = new Date(data.start_time).getTime();
        const elapsed = Math.floor((Date.now() - startMs) / 1000);
        remaining = Math.max(0, QUESTION_DURATION - elapsed);
        console.log(`[KIOSK] Timer sync: elapsed=${elapsed}s, remaining=${remaining}s`);
      } else {
        console.warn('[KIOSK] start_time tidak ada, pakai default 20s');
      }

      startTimer(remaining);
    }

    // ═══════════════════════════════════════════════════════════
    // START TIMER — handle jika soal masuk telat
    // ═══════════════════════════════════════════════════════════
    function startTimer(secondsLeft) {
      clearInterval(timerInterval);
      timerInterval = null;

      let timeLeft = Math.max(0, secondsLeft);
      updateTimerDisplay(timeLeft);

      // Kalau soal masuk telat & waktu sudah habis
      if (timeLeft <= 0) {
  console.warn('[KIOSK] Soal masuk setelah waktu habis!');
  isQuestionActive = false;
  document.getElementById('statusMsg').textContent = 'Waktu Habis! Soal ditutup.';
  document.getElementById('questionText').textContent = '⏰ Menunggu soal berikutnya...';
  setFrozen(true);  // ✅ tambahkan ini
  flushPendingPoints();
  return;
}

      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay(timeLeft);

        if (timeLeft <= 0) {
  clearInterval(timerInterval);
  timerInterval = null;
  isQuestionActive = false;
  document.getElementById('statusMsg').textContent = 'Waktu Habis! Soal ditutup.';
  document.getElementById('questionText').textContent = '⏰ Menunggu soal berikutnya...';

  // ✅ Freeze kiosk saat waktu habis
  setFrozen(true);

  flushPendingPoints();
}
      }, 1000);
    }

    function updateTimerDisplay(seconds) {
      const secFormatted = seconds < 10 ? `0${seconds}` : seconds;
      document.getElementById('timerDisplay').innerHTML =
        `<i class="fas fa-clock mr-1"></i>00:${secFormatted}`;
    }

    // ═══════════════════════════════════════════════════════════
    // FLUSH POIN SEBELUM TAB CLOSE (safety)
    // ═══════════════════════════════════════════════════════════
    window.addEventListener('beforeunload', () => {
      if (pendingPoints !== 0 && userSession) {
        // Pakai sendBeacon kalau memungkinkan (fire-and-forget)
        const payload = JSON.stringify({
          user_unique_id: userSession.unique_id,
          game_name: 'Bingo Math',
          score_obtained: pendingPoints
        });
        // Fallback: sync insert (bisa di-skip browser, tapi coba)
        navigator.sendBeacon?.(
          `${supabaseUrl}/rest/v1/game_scores?apikey=${supabaseKey}`,
          new Blob([payload], { type: 'application/json' })
        );
      }
    });

    // ═══════════════════════════════════════════════════════════
    // INIT
    // ═══════════════════════════════════════════════════════════
    async function init() {
  console.log('[KIOSK] Booting...');

  initUser();
  generateBingoBoards();
  renderBoard(0);
  setFrozen(true);   // ✅ default beku sebelum state diketahui
  listenToAdmin();

  const { data } = await supabaseClient
    .from('system_arithmatic_bingo')
    .select('*')
    .eq('id', 1)
    .maybeSingle();

  if (data) handleIncomingQuestion(data);

  console.log('[KIOSK] Ready');
}

    init();

    // Expose untuk onclick
    window.switchBoard = switchBoard;
    window.handleCellClick = handleCellClick;
  </script>
</body>
</html>
