<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Arithmatic Bingo - Peserta</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      overscroll-behavior-y: contain;
      /* ⭐ TIDAK pakai overflow-hidden — biar bisa di-scroll */
    }

    /* ═══════════════════════════════════════════════════════════
       BINGO GRID
       ═══════════════════════════════════════════════════════════ */
    .bingo-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 6px;
    }
    .bingo-cell-wrap {
      position: relative;
      width: 100%;
      padding-bottom: 100%;
    }
    .bingo-cell {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      border-radius: 8px;
      user-select: none;
      touch-action: manipulation;
      -webkit-appearance: none;
      border: none;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.15s, background 0.2s;
    }

    /* ═══════════════════════════════════════════════════════════
       ANIMASI
       ═══════════════════════════════════════════════════════════ */

    @keyframes questionPop {
      0% { opacity: 0; transform: scale(0.5) rotate(-5deg); }
      60% { opacity: 1; transform: scale(1.08) rotate(2deg); }
      100% { opacity: 1; transform: scale(1) rotate(0); }
    }
    .anim-question-pop {
      animation: questionPop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes bgFlash {
      0% { background-color: rgba(245, 158, 11, 0.4); }
      100% { background-color: rgba(30, 41, 59, 0); }
    }
    .anim-bg-flash {
      animation: bgFlash 0.7s ease-out;
    }

    @keyframes waitingPulse {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    .anim-waiting-dot {
      animation: waitingPulse 1s ease-in-out infinite;
    }

    @keyframes timerShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-2px); }
      75% { transform: translateX(2px); }
    }
    @keyframes timerHeartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }
    .anim-timer-critical {
      animation: timerShake 0.4s ease-in-out infinite,
                 timerHeartbeat 0.6s ease-in-out infinite;
      color: #f43f5e !important;
      text-shadow: 0 0 12px rgba(244, 63, 94, 0.9);
    }

    @keyframes timerWarning {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    .anim-timer-warning {
      animation: timerWarning 0.8s ease-in-out infinite;
      color: #f59e0b !important;
      text-shadow: 0 0 8px rgba(245, 158, 11, 0.6);
    }

    @keyframes correctPop {
      0% { transform: scale(1); }
      40% { transform: scale(1.3); box-shadow: 0 0 30px rgba(16,185,129,1); }
      100% { transform: scale(1); }
    }
    .anim-correct-pop {
      animation: correctPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes wrongShake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .anim-wrong-shake {
      animation: wrongShake 0.4s ease-in-out;
    }

    @keyframes bingoBurst {
      0% { opacity: 0; transform: scale(0.3) rotate(-15deg); }
      50% { opacity: 1; transform: scale(1.15) rotate(5deg); }
      100% { opacity: 0; transform: scale(2) rotate(-5deg); }
    }
    .anim-bingo-burst {
      animation: bingoBurst 1.4s cubic-bezier(0.4, 0, 0.6, 1) forwards;
    }

    @keyframes timeupFlash {
      0% { opacity: 0; transform: scale(0.5); }
      20% { opacity: 1; transform: scale(1.2); }
      40% { transform: scale(1); }
      100% { opacity: 1; transform: scale(1); }
    }
    .anim-timeup {
      animation: timeupFlash 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes scorePopUp {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-40px) scale(1.6); opacity: 0; }
    }
    .anim-score-popup {
      animation: scorePopUp 0.9s ease-out forwards;
      pointer-events: none;
    }

    @keyframes scoreFlashGreen {
      0% { transform: scale(1); color: #22c55e; }
      50% { transform: scale(1.3); color: #86efac; }
      100% { transform: scale(1); color: #22c55e; }
    }
    @keyframes scoreFlashRed {
      0% { transform: scale(1); color: #ef4444; }
      50% { transform: scale(0.85); color: #fca5a5; }
      100% { transform: scale(1); color: #ef4444; }
    }
    .anim-score-green { animation: scoreFlashGreen 0.5s ease-out; }
    .anim-score-red   { animation: scoreFlashRed 0.5s ease-out; }

    @keyframes confettiFall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(80px) rotate(720deg); opacity: 0; }
    }
    .confetti-piece {
      position: fixed;
      width: 8px;
      height: 8px;
      border-radius: 2px;
      pointer-events: none;
      animation: confettiFall 1s ease-out forwards;
      z-index: 9999;
    }

    @keyframes questionGlow {
      0%, 100% { box-shadow: 0 0 20px rgba(245, 158, 11, 0.3); }
      50% { box-shadow: 0 0 40px rgba(245, 158, 11, 0.7); }
    }
    .anim-question-glow {
      animation: questionGlow 2s ease-in-out infinite;
    }

    @keyframes screenShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    .anim-screen-shake {
      animation: screenShake 0.5s ease-in-out;
    }
  </style>
</head>

<script>
const SUPABASE_URL = 'https://endlrberfaxqhjrpvoss.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ts7-cOhRLAKGP4dqa4nExA_6hCktIHa';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const QUESTION_DURATION = 20;
const MAX_QUESTIONS = 99;
const TIMER_TICK_MS = 200;
const TAG = '[ADMIN]';

const LOG = {
  ok:   (m, d) => console.log(`%c${TAG} ✅ ${m}`, 'color:#10b981;font-weight:bold', d ?? ''),
  info: (m, d) => console.log(`%c${TAG} ℹ️ ${m}`, 'color:#3b82f6;font-weight:bold', d ?? ''),
  warn: (m, d) => console.warn(`%c${TAG} ⚠️ ${m}`, 'color:#f59e0b;font-weight:bold', d ?? ''),
  err:  (m, d) => console.error(`%c${TAG} ❌ ${m}`, 'color:#ef4444;font-weight:bold', d ?? '')
};

const STATE = {
  usedAnswers: new Set(),
  qCount: 0,
  autoInterval: null,
  timerInterval: null,
  timerEndAt: 0,
  isAutoRunning: false,
  isAnswerVisible: false,
  isProcessingStart: false,
  realtimeConnected: false
};

const UI = {
  setText(id, txt) { const el = document.getElementById(id); if (el) el.textContent = txt; },
  setHTML(id, html) { const el = document.getElementById(id); if (el) el.innerHTML = html; },
  debug(state, qNum, conn = null) {
    UI.setText('dbgState', state);
    UI.setText('dbgQ', `#${qNum}`);
    if (conn !== null) UI.setText('dbgConn', conn);
  }
};

function playBell() {
  const bell = document.getElementById('bellSound');
  if (!bell) return;
  try {
    bell.currentTime = 0;
    bell.play().catch(() => LOG.warn('Autoplay diblokir'));
  } catch (e) { LOG.warn('Bell error', e); }
}

function buildQuestion(ans) {
  const mode = Math.floor(Math.random() * 3);

  if (mode === 0) {
    const a = Math.floor(Math.random() * (ans - 1)) + 1;
    return `${a} + ${ans - a} = ?`;
  }
  if (mode === 1) {
    const add = Math.floor(Math.random() * 30) + 5;
    return `${ans + add} - ${add} = ?`;
  }
  let mult = 2;
  if (ans % 3 === 0) mult = 3;
  if (ans % 5 === 0) mult = 5;
  if (ans % mult === 0 && (ans / mult) >= 1) {
    return `${ans / mult} × ${mult} = ?`;
  }
  return `${ans + 10} - 10 = ?`;
}

async function generateAndPublishQuestion() {
  if (STATE.qCount >= MAX_QUESTIONS) {
    stopAutoRun();
    UI.setText('currentQuestion', 'BINGO SELESAI!');
    UI.setText('qNumDisplay', `Soal #${MAX_QUESTIONS} / ${MAX_QUESTIONS}`);
    UI.debug('finished', MAX_QUESTIONS);
    LOG.ok('Semua soal selesai');
    return;
  }

  if (STATE.qCount === 0) {
    STATE.usedAnswers.clear();
    LOG.ok('🎮 Sesi baru dimulai — pool jawaban di-reset');
  }

  let ans;
  let guard = 0;
  do {
    ans = Math.floor(Math.random() * 99) + 1;
    guard++;
    if (guard > 500) break;
  } while (STATE.usedAnswers.has(ans) && STATE.usedAnswers.size < 99);

  STATE.usedAnswers.add(ans);
  STATE.qCount++;

  const qText = buildQuestion(ans);
  const formattedAns = String(ans).padStart(2, '0');
  const startTime = new Date().toISOString();

  UI.setText('qNumDisplay', `Soal #${STATE.qCount} / ${MAX_QUESTIONS}`);
  UI.setText('currentQuestion', qText);
  UI.setText('currentAnswer', formattedAns);
  UI.debug(STATE.isAutoRunning ? 'running' : 'ready', STATE.qCount);

  playBell();

  try {
    const { error } = await supabaseClient
      .from('system_arithmatic_bingo')
      .update({
        question_text: qText,
        correct_answer: ans,
        question_number: STATE.qCount,
        start_time: startTime,
        is_active: true
      })
      .eq('id', 1);

    if (error) LOG.err('Publish soal gagal', error);
    else LOG.ok(`Soal #${STATE.qCount} dipublish: ${qText} = ${ans}`);
  } catch (e) {
    LOG.err('Publish soal exception', e);
  }

  startAdminTimer(QUESTION_DURATION);
}

function startAdminTimer(seconds) {
  if (STATE.timerInterval) {
    clearInterval(STATE.timerInterval);
    STATE.timerInterval = null;
  }

  STATE.timerEndAt = Date.now() + (seconds * 1000);

  const tick = () => {
    const remaining = Math.max(0, Math.ceil((STATE.timerEndAt - Date.now()) / 1000));
    UI.setHTML('timerAdmin', `<i class="fas fa-clock mr-1"></i>${remaining}`);

    if (remaining <= 0) {
      clearInterval(STATE.timerInterval);
      STATE.timerInterval = null;
    }
  };

  UI.setHTML('timerAdmin', `<i class="fas fa-clock mr-1"></i>${seconds}`);
  STATE.timerInterval = setInterval(tick, TIMER_TICK_MS);
}

async function toggleAutoRun() {
  if (STATE.isProcessingStart) return;
  STATE.isProcessingStart = true;

  try {
    if (!STATE.isAutoRunning) {
      await startAutoRun();
    } else {
      stopAutoRun();
    }
  } finally {
    STATE.isProcessingStart = false;
  }
}

async function startAutoRun() {
  LOG.ok(`▶ Start auto-run. qCount saat ini: ${STATE.qCount}`);

  if (STATE.qCount === 0) {
    LOG.info('Sesi baru terdeteksi — clear DB dulu supaya kiosk reset');

    try {
      await supabaseClient
        .from('system_arithmatic_bingo')
        .update({
          question_text: '',
          correct_answer: 0,
          question_number: 0,
          start_time: new Date().toISOString(),
          is_active: false
        })
        .eq('id', 1);

      await new Promise(r => setTimeout(r, 800));
      LOG.ok('DB cleared & kiosk notified');
    } catch (e) {
      LOG.err('Clear DB gagal', e);
    }
  }

  STATE.isAutoRunning = true;

  const btn = document.getElementById('btnStartGame');
  btn.className = "px-6 py-3 rounded-xl font-black text-sm transition-all bg-rose-600 hover:bg-rose-500 text-white pulse-slow shadow-lg shadow-rose-600/20";
  btn.innerHTML = `<i class="fas fa-stop"></i> Hentikan Loop Auto`;

  UI.debug('running', STATE.qCount);

  await generateAndPublishQuestion();

  STATE.autoInterval = setInterval(() => {
    if (!STATE.isAutoRunning) return;
    generateAndPublishQuestion();
  }, QUESTION_DURATION * 1000);
}

function stopAutoRun() {
  LOG.warn('⏹ Stop auto-run');

  STATE.isAutoRunning = false;

  if (STATE.autoInterval) {
    clearInterval(STATE.autoInterval);
    STATE.autoInterval = null;
  }
  if (STATE.timerInterval) {
    clearInterval(STATE.timerInterval);
    STATE.timerInterval = null;
  }

  const btn = document.getElementById('btnStartGame');
  btn.className = "px-6 py-3 rounded-xl font-black text-sm transition-all bg-emerald-600 hover:bg-emerald-500 text-slate-950 shadow-lg shadow-emerald-600/20 active:scale-95 flex items-center gap-2";

  const label = STATE.qCount >= MAX_QUESTIONS
    ? `<i class="fas fa-redo"></i> Mulai Ulang (Sesi Baru)`
    : `<i class="fas fa-play"></i> Lanjutkan Game (Auto Loop 20s)`;
  btn.innerHTML = label;

  UI.debug(STATE.qCount >= MAX_QUESTIONS ? 'finished' : 'paused', STATE.qCount);
}

async function clearGameState() {
  const ok = confirm(
    "Yakin ingin CLEAR semua soal?\n\n" +
    "• Auto loop dihentikan\n" +
    "• Nomor soal reset ke 0\n" +
    "• Kiosk peserta akan reset papan & skor lokal\n" +
    "• Poin peserta di DB TIDAK dihapus\n\n" +
    "Lanjutkan?"
  );
  if (!ok) return;

  if (STATE.isAutoRunning) stopAutoRun();

  LOG.warn('🧹 Clear game state');

  try {
    const { error } = await supabaseClient
      .from('system_arithmatic_bingo')
      .update({
        question_text: '',
        correct_answer: 0,
        question_number: 0,
        start_time: new Date().toISOString(),
        is_active: false
      })
      .eq('id', 1);

    if (error) {
      LOG.err('Clear gagal', error);
      alert('Gagal clear: ' + error.message);
      return;
    }
  } catch (e) {
    LOG.err('Clear exception', e);
    alert('Gagal clear: ' + e.message);
    return;
  }

  STATE.usedAnswers.clear();
  STATE.qCount = 0;

  UI.setText('qNumDisplay', `Soal #0 / ${MAX_QUESTIONS}`);
  UI.setText('currentQuestion', 'Siap Memulai?');
  UI.setText('currentAnswer', '??');
  UI.setHTML('timerAdmin', `<i class="fas fa-clock mr-1"></i>${QUESTION_DURATION}`);
  UI.debug('waiting', 0);

  const btn = document.getElementById('btnStartGame');
  btn.className = "px-6 py-3 rounded-xl font-black text-sm transition-all bg-emerald-600 hover:bg-emerald-500 text-slate-950 shadow-lg shadow-emerald-600/20 active:scale-95 flex items-center gap-2";
  btn.innerHTML = `<i class="fas fa-play"></i> Mulai Game (Auto Loop 20s)`;

  STATE.isAnswerVisible = false;
  document.getElementById('currentAnswer').classList.add('blur-sm');
  document.getElementById('eyeIcon').className = 'fas fa-eye';

  LOG.ok('✅ Clear selesai');
  alert("✅ Soal di-clear. Kiosk & layout kembali ke state siap.");
}

function toggleAnswerVisibility() {
  STATE.isAnswerVisible = !STATE.isAnswerVisible;
  const ansEl = document.getElementById('currentAnswer');
  const iconEl = document.getElementById('eyeIcon');

  if (STATE.isAnswerVisible) {
    ansEl.classList.remove('blur-sm');
    iconEl.className = 'fas fa-eye-slash';
  } else {
    ansEl.classList.add('blur-sm');
    iconEl.className = 'fas fa-eye';
  }
}

async function switchStageView(viewName) {
  const payload = {
    current_view: viewName,
    updated_at: new Date().toISOString()
  };

  if (viewName === 'leaderboard') {
    payload.revealed_rank = 0;
  }

  try {
    const { error } = await supabaseClient
      .from('admin_layout_arithmatic_bingo')
      .update(payload)
      .eq('id', 1);

    if (error) LOG.err('Switch view gagal', error);
    else LOG.ok(`Switch view → ${viewName}`);
  } catch (e) {
    LOG.err('Switch view exception', e);
  }
}

async function revealRankOnStage(rankNum) {
  try {
    const { error } = await supabaseClient
      .from('admin_layout_arithmatic_bingo')
      .update({
        current_view: 'leaderboard',
        revealed_rank: rankNum,
        updated_at: new Date().toISOString()
      })
      .eq('id', 1);

    if (error) LOG.err(`Reveal rank #${rankNum} gagal`, error);
    else LOG.ok(`Reveal rank #${rankNum}`);
  } catch (e) {
    LOG.err('Reveal exception', e);
  }
}

// ⭐ RESET POIN via RPC
async function resetBingoScores() {
  const ok = confirm("Yakin ingin MENGHAPUS SEMUA POIN peserta untuk Arithmetic Bingo?\n\nSemua poin di tabel point_arithmatic_bingo akan direset ke 0.");
  if (!ok) return;

  try {
    const { error } = await supabaseClient.rpc('reset_all_points_arithmatic_bingo');

    if (error) {
      LOG.err('Reset poin gagal', error);
      alert('Gagal reset poin: ' + error.message);
    } else {
      LOG.ok('Semua poin direset ke 0');
      alert('✅ Poin peserta berhasil direset ke 0.');
      loadScoresData();
    }
  } catch (e) {
    LOG.err('Reset poin exception', e);
  }
}

// ⭐ LOAD SCORES dari tabel baru
async function loadScoresData() {
  try {
    const { data, error } = await supabaseClient
      .from('point_arithmatic_bingo')
      .select('unique_id, name, point')
      .order('point', { ascending: false });

    if (error || !data) {
      LOG.err('Load scores error', error);
      return;
    }

    const mapped = data.map(row => ({
      uid: row.name || String(row.unique_id),
      total: row.point ?? 0
    }));

    renderTop10(mapped.slice(0, 10));
    renderAllParticipants(mapped);
  } catch (e) {
    LOG.err('loadScoresData exception', e);
  }
}

function renderTop10(top10) {
  const container = document.getElementById('leaderboardList');
  if (!container) return;
  container.innerHTML = '';

  if (top10.length === 0) {
    container.innerHTML = `<p class="text-xs text-gray-500 text-center py-4">Belum ada skor masuk.</p>`;
    return;
  }

  top10.forEach((item, idx) => {
    const row = document.createElement('div');
    row.className = `flex items-center justify-between p-2.5 rounded-xl text-xs ${
      idx === 0
        ? 'bg-amber-500/20 border border-amber-500/40 text-amber-300 font-bold'
        : 'bg-slate-800/60 text-gray-300'
    }`;

    let badge = `#${idx + 1}`;
    if (idx === 0) badge = '🥇';
    if (idx === 1) badge = '🥈';
    if (idx === 2) badge = '🥉';

    row.innerHTML = `
      <div class="flex items-center gap-2 overflow-hidden">
        <span class="w-5 text-center font-bold">${badge}</span>
        <span class="truncate">${item.uid}</span>
      </div>
      <span class="font-mono font-bold text-amber-400">+${item.total}</span>
    `;
    container.appendChild(row);
  });
}

function renderAllParticipants(allData) {
  const container = document.getElementById('allParticipantsList');
  const countDisplay = document.getElementById('totalParticipantCount');
  if (!container) return;

  container.innerHTML = '';
  if (countDisplay) countDisplay.textContent = `${allData.length} Peserta`;

  if (allData.length === 0) {
    container.innerHTML = `<p class="col-span-full text-xs text-gray-500 text-center py-4">Belum ada peserta terdaftar.</p>`;
    return;
  }

  allData.forEach((item, idx) => {
    const card = document.createElement('div');
    card.className = "bg-slate-800/80 border border-slate-700/50 p-3 rounded-xl flex items-center justify-between text-xs";
    card.innerHTML = `
      <div class="flex items-center gap-2 overflow-hidden">
        <span class="text-slate-500 font-mono text-[10px]">#${idx + 1}</span>
        <span class="font-bold text-slate-200 truncate">${item.uid}</span>
      </div>
      <span class="font-mono font-bold text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20">+${item.total}</span>
    `;
    container.appendChild(card);
  });
}

// ⭐ Realtime sekarang listen ke point_arithmatic_bingo
function subscribeRealtimeScores() {
  supabaseClient
    .channel('admin_leaderboard_bingo')
    .on('postgres_changes', {
      event: '*',
      schema: 'public',
      table: 'point_arithmatic_bingo'
    }, () => {
      loadScoresData();
    })
    .subscribe(status => {
      STATE.realtimeConnected = (status === 'SUBSCRIBED');
      UI.debug(
        STATE.isAutoRunning ? 'running' : 'ready',
        STATE.qCount,
        STATE.realtimeConnected ? 'rt' : 'poll'
      );
    });

  setInterval(() => {
    loadScoresData();
    UI.debug(
      STATE.isAutoRunning ? 'running' : 'ready',
      STATE.qCount,
      STATE.realtimeConnected ? 'rt' : 'poll'
    );
  }, 2000);
}

// Auto-clear sesi lama saat admin buka
(async () => {
  try {
    const { data } = await supabaseClient
      .from('system_arithmatic_bingo')
      .select('is_active, question_number')
      .eq('id', 1)
      .maybeSingle();

    if (data && (data.is_active || (data.question_number || 0) > 0)) {
      LOG.warn('Sesi lama terdeteksi — reset ke state awal');
      await supabaseClient
        .from('system_arithmatic_bingo')
        .update({
          question_text: '',
          correct_answer: 0,
          question_number: 0,
          start_time: new Date().toISOString(),
          is_active: false
        })
        .eq('id', 1);

      LOG.ok('State awal siap');
    }
  } catch (e) {
    LOG.err('Auto-clear error', e);
  }

  loadScoresData();
  subscribeRealtimeScores();
  UI.debug('ready', 0);
  LOG.ok('══════════ ADMIN READY ══════════');
})();
</script>
