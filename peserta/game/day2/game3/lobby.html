<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lobby - Forsaken City Recall</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome untuk ikon tombol -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      user-select: none;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <!-- CARD LOBBY MAIN CONTAINER -->
  <main class="w-full max-w-xl bg-slate-800 border border-slate-700 rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden">
    
    <!-- BADGE GAME DAY 2 -->
    <div class="flex items-center justify-between mb-6">
      <span class="bg-amber-500/10 border border-amber-500/30 text-amber-400 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">
        Day 2 • Game 3
      </span>
      <div id="userBadge" class="text-xs text-slate-400 font-medium">
        <!-- Nama Player dari localStorage akan muncul di sini -->
      </div>
    </div>

    <!-- TITLE & LOGO SECTION -->
    <div class="text-center mb-8">
      <!-- Container Logo / Icon Gambar -->
      <div class="inline-flex items-center justify-center w-24 h-24 bg-amber-500/10 rounded-2xl mb-4 border border-amber-500/30 overflow-hidden shadow-inner p-2">
        <!-- Ganti src di bawah dengan path gambar logo Forsaken City Recall kamu -->
        <img src="assets/images/forsaken_city_recall_logo.png" alt="Forsaken City Recall Logo" class="w-full h-full object-contain" onerror="this.onerror=null; this.src='https://via.placeholder.com/96?text=LOGO';" />
      </div>
      
      <h1 class="text-3xl font-black tracking-wide text-white">FORSAKEN CITY RECALL</h1>
      <p class="text-sm text-slate-400 mt-2 max-w-md mx-auto leading-relaxed">
        Petakan kembali ingatan dan jejak lokasi di kota mati yang terbengkalai, rekonstruksi petunjuk dengan ketepatan memori terbaikmu!
      </p>
    </div>

    <!-- ACTION BUTTONS SECTION -->
    <div class="space-y-4">
      
      <!-- 1. TOMBOL JOIN GAME (MAIN ACTION) -->
      <button onclick="handleJoinGame()" class="w-full py-4 px-6 bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 text-slate-950 font-black text-lg rounded-2xl shadow-lg transition transform active:scale-95 flex items-center justify-center gap-3">
        <i class="fa-solid fa-gamepad text-xl"></i>
        <span>JOIN GAME NOW</span>
      </button>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
        <!-- 2. TOMBOL SIMULASI VIDEO -->
        <button onclick="openVideoModal()" class="py-3 px-4 bg-slate-700 hover:bg-slate-600 border border-slate-600 text-slate-200 font-bold rounded-xl transition flex items-center justify-center gap-2 text-sm">
          <i class="fa-solid fa-circle-play text-red-400 text-base"></i>
          <span>Video Tutorial</span>
        </button>

        <!-- 3. TOMBOL SIMULASI PERMAINAN (DEMO/PRACTICE) -->
        <button onclick="handleStartSimulation()" class="py-3 px-4 bg-slate-700 hover:bg-slate-600 border border-slate-600 text-slate-200 font-bold rounded-xl transition flex items-center justify-center gap-2 text-sm">
          <i class="fa-solid fa-vial text-emerald-400 text-base"></i>
          <span>Coba Simulasi</span>
        </button>
      </div>

    </div>

  </main>

  <!-- MODAL POPUP VIDEO SIMULASI -->
  <div id="videoModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-3xl w-full max-w-2xl overflow-hidden shadow-2xl relative">
      
      <!-- Modal Header -->
      <div class="flex items-center justify-between p-4 border-b border-slate-700">
        <h3 class="font-bold text-white flex items-center gap-2">
          <span>🎬</span> Simulasi Cara Bermain Forsaken City Recall
        </h3>
        <button onclick="closeVideoModal()" class="text-slate-400 hover:text-white text-xl font-bold w-8 h-8 rounded-full hover:bg-slate-700 flex items-center justify-center">
          &times;
        </button>
      </div>

      <!-- Modal Body (Video Embed / Player) -->
      <div class="p-4 bg-black flex items-center justify-center min-h-[300px]">
        <video id="tutorialVideo" controls class="w-full rounded-xl">
          <source src="assets/videos/forsaken_city_recall_tutorial.mp4" type="video/mp4">
          Browser Anda tidak mendukung pemutaran video.
        </video>
      </div>

      <!-- Modal Footer -->
      <div class="p-4 border-t border-slate-700 text-right">
        <button onclick="closeVideoModal()" class="px-5 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-xl text-sm font-semibold">
          Tutup
        </button>
      </div>

    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // Ambil data user dari localStorage
    const userSession = JSON.parse(localStorage.getItem('userSession') || '{}');
    const userBadgeEl = document.getElementById('userBadge');

    if (userSession && userSession.full_name) {
      userBadgeEl.textContent = `👤 ${userSession.full_name}`;
    } else {
      userBadgeEl.textContent = `👤 Guest`;
    }

    // 1. Handlers Tombol Join Game
    function handleJoinGame() {
      window.location.href = 'forsaken_city_recall_game.html';
    }

    // 2. Handlers Modal Video Tutorial
    const videoModal = document.getElementById('videoModal');
    const tutorialVideo = document.getElementById('tutorialVideo');

    function openVideoModal() {
      videoModal.classList.remove('hidden');
    }

    function closeVideoModal() {
      videoModal.classList.add('hidden');
      if (tutorialVideo) {
        tutorialVideo.pause();
        tutorialVideo.currentTime = 0;
      }
    }

    // 3. Handlers Simulasi Permainan (Practice Mode)
    function handleStartSimulation() {
      window.location.href = 'forsaken_city_recall_simulation.html';
    }
  </script>
</body>
</html>
