      const { data, error } = await supabaseClient
        .from('cataclysm_memory_teams')
        .select('unique_id, full_name, team')
        .order('team', { ascending: true })
        .order('full_name', { ascending: true });

      if (error) {
        console.error('[STAGE] Fetch teams error:', error);
        return;
      }

      teamsData = {};
      for (let i = 1; i <= TEAM_COUNT; i++) teamsData[i] = [];

        teamsData[row.team].push({
          unique_id: row.unique_id,
          full_name: row.full_name || row.unique_id
        });

      console.log('[STAGE] Teams fetched');
      if (currentView === 'team_assignment') startTeamRotation();

      rotateTeams();

      teamRotateInterval = setInterval(() => {
        if (currentView !== 'team_assignment') return;
        currentTeamIndex = (currentTeamIndex + 2) % 10;
        rotateTeams();
      }, 3000);
    }

    function rotateTeams() {
      // Ambil 2 tim: currentTeamIndex dan currentTeamIndex+1
      const teamA = (currentTeamIndex % 10) + 1;
      const teamB = ((currentTeamIndex + 1) % 10) + 1;

      renderTeamContainer('teamContainerA', teamA);
      renderTeamContainer('teamContainerB', teamB);

      // Update dots
      const dots = document.querySelectorAll('.rotate-dot');
      const activeIdx = Math.floor(currentTeamIndex / 2);
      dots.forEach((d, i) => {
        d.className = `rotate-dot w-3 h-3 rounded-full transition-all ${i === activeIdx ? 'bg-cyan-400 scale-125' : 'bg-slate-700'}`;
      });

      playBell();
    }

    function stopTeamRotation() {
      if (teamRotateInterval) { clearInterval(teamRotateInterval); teamRotateInterval = null; }
    }

    // ═══════════════════════════════════════════════════════════
    // ANSWER PHASE — countdown besar
    // ═══════════════════════════════════════════════════════════
    function startAnswerTimer(startTime, duration) {
      if (answerTimerInterval) clearInterval(answerTimerInterval);

      const display = document.getElementById('answerTimerDisplay');
      if (!display) return;

      const startMs = new Date(startTime).getTime();

      const tick = () => {
        const elapsed = Math.floor((Date.now() - startMs) / 1000);
        const remaining = Math.max(0, duration - elapsed);

        const m = Math.floor(remaining / 60);
        const s = remaining % 60;
        display.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;

        // Warna berubah saat kritis
        if (remaining <= 30) {
          display.className = 'text-[180px] md:text-[240px] font-black font-math text-rose-500 leading-none animate-timer-pulse';
        } else if (remaining <= 60) {
          display.className = 'text-[180px] md:text-[240px] font-black font-math text-amber-400 leading-none animate-timer-pulse';
        } else {
          display.className = 'text-[180px] md:text-[240px] font-black font-math text-emerald-400 leading-none animate-timer-pulse';
        }

        if (remaining <= 0) clearInterval(answerTimerInterval);
      };

      tick();
      answerTimerInterval = setInterval(tick, 500);
    }

    function stopAnswerTimer() {
      if (answerTimerInterval) { clearInterval(answerTimerInterval); answerTimerInterval = null; }
    }

    // ═══════════════════════════════════════════════════════════
    // TEAM STANDINGS — reveal team 10 → 1
    // ═══════════════════════════════════════════════════════════
    async function fetchTeamStandings() {
      // Fetch teams
      const { data: teams } = await supabaseClient
        .from('cataclysm_memory_teams')
        .select('unique_id, full_name, team');

      // Fetch scores
      const { data: scores } = await supabaseClient
        .from('game_scores')
        .select('user_unique_id, score_obtained')
        .eq('game_name', GAME_NAME);

      // Team totals
      const teamTotals = {};
      for (let i = 1; i <= TEAM_COUNT; i++) teamTotals[i] = { total: 0, members: [] };

      (teams || []).forEach(t => {
        if (teamTotals[t.team]) {
          teamTotals[t.team].members.push({
            unique_id: t.unique_id,
            full_name: t.full_name || t.unique_id,
            score: 0
          });
        }
      });

      // Assign score per user
      const scoreMap = {};
      (scores || []).forEach(s => {
        scoreMap[s.user_unique_id] = (scoreMap[s.user_unique_id] || 0) + (s.score_obtained || 0);
      });

      Object.keys(teamTotals).forEach(tn => {
        teamTotals[tn].members.forEach(m => {
          m.score = scoreMap[m.unique_id] || 0;
          teamTotals[tn].total += m.score;
        });
      });

      // Sort teams by total desc
      cachedTeamStandings = Object.keys(teamTotals)
        .map(tn => ({
          team: parseInt(tn),
          total: teamTotals[tn].total,
          members: teamTotals[tn].members.sort((a, b) => b.score - a.score)
        }))
        .sort((a, b) => b.total - a.total);

      console.log('[STAGE] Team standings cached:', cachedTeamStandings.length);
    }

    function renderTeamStandingReveal(rank) {
      const container = document.getElementById('teamStandingReveal');
      if (!container) return;

      // rank 1 = juara 1 = index 0
      const targetIdx = rank - 1;
      const target = cachedTeamStandings[targetIdx];

      if (!target) {
        container.innerHTML = `<p class="text-slate-400 text-xl">Belum ada data untuk peringkat ${rank}</p>`;
        return;

      const teamNum = target.team;

        const avatar = `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(m.unique_id)}`;

      container.innerHTML = `

    // ═══════════════════════════════════════════════════════════
    // LEADERBOARD — top 10 akumulasi semua game
    // ═══════════════════════════════════════════════════════════
    async function fetchGlobalScores() {
      // Fetch SEMUA game_scores (akumulasi semua game)
      const { data, error } = await supabaseClient
        .from('game_scores')
        .select('user_unique_id, score_obtained');

      if (error || !data) return;

      const scoreMap = {};
      data.forEach(row => {
        const uid = row.user_unique_id || 'Tanpa Nama';
        scoreMap[uid] = (scoreMap[uid] || 0) + (row.score_obtained || 0);
      });

      cachedGlobalScores = Object.keys(scoreMap)
        .map(uid => ({ uid, total: scoreMap[uid] }))
        .sort((a, b) => b.total - a.total);

      console.log('[STAGE] Global scores cached:', cachedGlobalScores.length);
    }

    // ═══════════════════════════════════════════════════════════
// VIEW SWITCHER — dengan guard anti re-render
// ═══════════════════════════════════════════════════════════
function handleViewSwitch(viewName, revealedRank) {
  console.log('[STAGE] View switch:', viewName, 'rank:', revealedRank);

  const views = {
    team_assignment: document.getElementById('viewTeamAssignment'),
    memorize_phase: document.getElementById('viewMemorizePhase'),
    answer_phase: document.getElementById('viewAnswerPhase'),
    team_standings: document.getElementById('viewTeamStandings'),
    leaderboard: document.getElementById('viewLeaderboard')
  };

  // ═══════════════════════════════════════════════════════
  // GUARD 1: Kalau view SAMA dan rank SAMA → skip total
  // ═══════════════════════════════════════════════════════
  const isSameView = (currentView === viewName);
  const isSameRank = (lastRevealedRank === revealedRank);

  if (isSameView && isSameRank) {
    // Hanya update rank kalau berubah di view leaderboard/team_standings
    if (viewName === 'leaderboard' && revealedRank !== lastRevealedRank) {
      lastRevealedRank = revealedRank;
      renderLeaderboardReveal(revealedRank);
    } else if (viewName === 'team_standings' && revealedRank !== lastRevealedRank) {
      lastRevealedRank = revealedRank;
      renderTeamStandingReveal(revealedRank);
    }
    return;
  }

  // ═══════════════════════════════════════════════════════
  // GUARD 2: Kalau view SAMA tapi rank beda (hanya untuk
  // leaderboard/team_standings) → update rank saja, JANGAN
  // restart view
  // ═══════════════════════════════════════════════════════
  if (isSameView && !isSameRank) {
    lastRevealedRank = revealedRank;

    if (viewName === 'leaderboard') {
      fetchGlobalScores().then(() => renderLeaderboardReveal(revealedRank));
    } else if (viewName === 'team_standings') {
      fetchTeamStandings().then(() => renderTeamStandingReveal(revealedRank));
    }
    return;
  }

  // ═══════════════════════════════════════════════════════
  // Kalau view BEDA → baru switch
  // ═══════════════════════════════════════════════════════
  Object.values(views).forEach(v => {
    if (v) { v.classList.add('hidden-view'); v.classList.remove('active-view'); }
  });

  // Stop rotation view lama
  stopTeamRotation();
  stopDisasterRotation();
  stopAnswerTimer();

  // Aktifkan view baru
  if (views[viewName]) {
    views[viewName].classList.remove('hidden-view');
    views[viewName].classList.add('active-view');
  }

  currentView = viewName;
  lastRevealedRank = revealedRank;

  // Handle view specific
  if (viewName === 'team_assignment') {
    fetchTeams().then(() => startTeamRotation());
  } else if (viewName === 'memorize_phase') {
    startDisasterRotation();
  } else if (viewName === 'answer_phase') {
    loadSessionAndStartTimer();
  } else if (viewName === 'team_standings') {
    fetchTeamStandings().then(() => renderTeamStandingReveal(revealedRank));
  } else if (viewName === 'leaderboard') {
    fetchGlobalScores().then(() => renderLeaderboardReveal(revealedRank));
  }
}

    // ═══════════════════════════════════════════════════════════
    // SESSION — untuk answer_phase timer
    // ═══════════════════════════════════════════════════════════
    async function loadSessionAndStartTimer() {
      const { data } = await supabaseClient
        .from('system_cataclysm_memory')
        .select('is_active, session_start_time, session_duration')
        .eq('id', 1)
        .maybeSingle();

      if (data && data.is_active && data.session_start_time) {
        startAnswerTimer(data.session_start_time, data.session_duration || 300);
      } else {
        const display = document.getElementById('answerTimerDisplay');
        if (display) display.textContent = '--:--';
      }
    }

    // ═══════════════════════════════════════════════════════════
// SIGNATURE CACHE — cegah re-render berulang
// ═══════════════════════════════════════════════════════════
let lastLayoutSignature = '';

// ═══════════════════════════════════════════════════════════
// REALTIME — admin_layout
// ═══════════════════════════════════════════════════════════


    // ═══════════════════════════════════════════════════════════
       // ═══════════════════════════════════════════════════════════
    // REALTIME — admin_layout
    // ═══════════════════════════════════════════════════════════
    function subscribeLayout() {
      supabaseClient
        .channel('stage_cataclysm_layout')
        .on('postgres_changes', {
          event: 'UPDATE',
          schema: 'public',
          table: 'admin_layout_cataclysm_memory'
        }, (payload) => {
          if (payload.new) handleViewSwitch(payload.new.current_view, payload.new.revealed_rank);
        })
        .subscribe();

      // Polling
      setInterval(async () => {
        const { data } = await supabaseClient
          .from('admin_layout_cataclysm_memory')
          .select('*')
          .eq('id', 1)
          .maybeSingle();
        if (data) handleViewSwitch(data.current_view, data.revealed_rank);
      }, 1500);
    }
    // ═══════════════════════════════════════════════════════════
    // REALTIME — teams
    // ═══════════════════════════════════════════════════════════
    function subscribeTeams() {
      supabaseClient
        .channel('stage_cataclysm_teams')
        .on('postgres_changes', {
          event: '*',
          schema: 'public',
          table: 'cataclysm_memory_teams'
        }, () => {
          if (currentView === 'team_assignment') {
            fetchTeams().then(() => startTeamRotation());
          }
        })
        .subscribe();
    }
    // ═══════════════════════════════════════════════════════════
    // REALTIME — system_cataclysm_memory (untuk timer)
    // ═══════════════════════════════════════════════════════════
    function subscribeSystem() {
      supabaseClient
        .channel('stage_cataclysm_system')
        .on('postgres_changes', {
          event: '*',
          schema: 'public',
          table: 'system_cataclysm_memory'
        }, (payload) => {
          if (currentView === 'answer_phase' && payload.new) {
            if (payload.new.is_active && payload.new.session_start_time) {
              startAnswerTimer(payload.new.session_start_time, payload.new.session_duration || 300);
            }
          }
        })
        .subscribe();
    }
    // ═══════════════════════════════════════════════════════════
    // INIT
    // ═══════════════════════════════════════════════════════════
    async function init() {
  console.log('[STAGE] Init Cataclysm Memory...');

  const { data: layout } = await supabaseClient
    .from('admin_layout_cataclysm_memory')
    .select('*')
    .eq('id', 1)
    .maybeSingle();

  if (layout) {
    // Set signature SEBELUM handleViewSwitch biar tidak trigger re-render
    lastLayoutSignature = `${layout.current_view}|${layout.revealed_rank}|${layout.updated_at}`;
    handleViewSwitch(layout.current_view, layout.revealed_rank);
  } else {
    lastLayoutSignature = 'team_assignment|0|';
    handleViewSwitch('team_assignment', 0);
  }

  subscribeLayout();
  subscribeSystem();
  subscribeTeams();
}

    init();
  </script>
</body>
