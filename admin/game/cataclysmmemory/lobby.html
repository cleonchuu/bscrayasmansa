<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lobby Operator - Cataclysm Memory</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome untuk ikon tombol -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      user-select: none;
    }

    /* Animasi masuk kartu */
    @keyframes cardFadeIn {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-card-in { animation: cardFadeIn 0.5s ease-out forwards; }

    /* Hover glow tiap tombol */
    .btn-admin:hover { box-shadow: 0 0 30px rgba(245, 158, 11, 0.45); }
    .btn-layout:hover { box-shadow: 0 0 30px rgba(6, 182, 212, 0.45); }
    .btn-panitia:hover { box-shadow: 0 0 30px rgba(16, 185, 129, 0.45); }

    /* Pulse titik status */
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.15); }
    }
    .animate-pulse-dot { animation: pulseDot 1.5s ease-in-out infinite; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <!-- CARD LOBBY MAIN CONTAINER -->
  <main class="animate-card-in w-full max-w-2xl bg-slate-800 border border-slate-700 rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden">

    <!-- BADGE GAME DAY 1 -->
    <div class="flex items-center justify-between mb-6">
      <span class="bg-purple-500/10 border border-purple-500/30 text-purple-400 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">
        <i class="fas fa-brain mr-1"></i> Cataclysm Memory • Operator Panel
      </span>
      <div id="userBadge" class="text-xs text-slate-400 font-medium">
        <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-slate-700 text-slate-300">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse-dot"></span> Panel Akses
        </span>
      </div>
    </div>

    <!-- TITLE & LOGO SECTION -->
    <div class="text-center mb-8">
      <!-- Container Logo / Icon Gambar -->
      <div class="inline-flex items-center justify-center w-24 h-24 bg-purple-500/10 rounded-2xl mb-4 border border-purple-500/30 overflow-hidden shadow-inner p-3">
        <i class="fas fa-meteor text-5xl text-purple-400"></i>
      </div>

      <h1 class="text-3xl font-black tracking-wide text-white">CATACLYSM MEMORY</h1>
      <p class="text-sm text-slate-400 mt-2 max-w-md mx-auto leading-relaxed">
        Pilih peranan tampilan untuk memulai sesi game ini.
        <b class="text-amber-400">Admin</b> untuk kontrol game,
        <b class="text-cyan-400">Layout</b> untuk tampilan layar panggung,
        <b class="text-emerald-400">Panitia</b> untuk assign tim manual.
      </p>
    </div>

    <!-- ACTION BUTTONS SECTION (3 Tombol Utama) -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">

      <!-- 1. TOMBOL AKSES ADMIN -->
      <button onclick="handleNavigate('admin.html')" class="btn-admin py-5 px-6 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-slate-950 font-black rounded-2xl shadow-lg transition transform active:scale-95 flex flex-col items-center justify-center gap-2 group">
        <i class="fa-solid fa-sliders text-3xl group-hover:scale-110 transition-transform"></i>
        <span class="text-lg">ADMIN</span>
        <span class="text-[11px] font-medium text-slate-900/80">Kontrol Game &amp; Leaderboard</span>
      </button>

      <!-- 2. TOMBOL AKSES LAYOUT (STAGE/DISPLAY) -->
      <button onclick="handleNavigate('layout.html')" class="btn-layout py-5 px-6 bg-slate-700 hover:bg-slate-600 border border-slate-600 text-slate-100 font-black rounded-2xl shadow-lg transition transform active:scale-95 flex flex-col items-center justify-center gap-2 group">
        <i class="fa-solid fa-desktop text-3xl text-cyan-400 group-hover:scale-110 transition-transform"></i>
        <span class="text-lg">LAYOUT</span>
        <span class="text-[11px] font-medium text-slate-400">Tampilan Layar Panggung</span>
      </button>

      <!-- 3. TOMBOL AKSES PANITIA (ASSIGN TIM) -->
      <button onclick="handleNavigate('team.html')" class="btn-panitia py-5 px-6 bg-slate-700 hover:bg-slate-600 border border-slate-600 text-slate-100 font-black rounded-2xl shadow-lg transition transform active:scale-95 flex flex-col items-center justify-center gap-2 group">
        <i class="fa-solid fa-users-gear text-3xl text-emerald-400 group-hover:scale-110 transition-transform"></i>
        <span class="text-lg">PANITIA</span>
        <span class="text-[11px] font-medium text-slate-400">Assign Tim Manual</span>
      </button>

    </div>

    <!-- FOOTER INFO -->
    <div class="mt-8 pt-5 border-t border-slate-700 flex flex-col sm:flex-row items-center justify-between gap-2 text-[11px] text-slate-500">
      <span>
        <i class="fas fa-info-circle"></i> Gunakan tombol sesuai peran Anda.
      </span>
      <span class="font-mono">
        v1.0 • Cataclysm Memory
      </span>
    </div>

  </main>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // ═══════════════════════════════════════════════════════════
    // HANDLER NAVIGASI
    // ═══════════════════════════════════════════════════════════
    function handleNavigate(targetPage) {
      console.log('[LOBBY] Navigate →', targetPage);
      window.location.href = targetPage;
    }

    // ═══════════════════════════════════════════════════════════
    // CEK USER SESSION (opsional)
    // ═══════════════════════════════════════════════════════════
    function checkUserSession() {
      const sess = localStorage.getItem('userSession');
      const badge = document.getElementById('userBadge');

      if (!sess) {
        badge.innerHTML = `
          <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-rose-500/10 border border-rose-500/30 text-rose-400">
            <span class="w-2 h-2 rounded-full bg-rose-400"></span> Belum Login
          </span>
        `;
        return;
      }

      try {
        const parsed = JSON.parse(sess);
        if (parsed && parsed.full_name) {
          badge.innerHTML = `
            <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400">
              <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse-dot"></span>
              ${parsed.full_name}
            </span>
          `;
        }
      } catch (e) {
        badge.innerHTML = `
          <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-400">
            <span class="w-2 h-2 rounded-full bg-amber-400"></span> Session Error
          </span>
        `;
      }
    }

    // ═══════════════════════════════════════════════════════════
    // INIT
    // ═══════════════════════════════════════════════════════════
    document.addEventListener('DOMContentLoaded', () => {
      checkUserSession();
      console.log('[LOBBY] Cataclysm Memory lobby ready');
    });
  </script>
</body>
</html>
