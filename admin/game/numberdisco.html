<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Disco - Display Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;600;800&display=swap');

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #050b14;
      color: #ffffff;
      overflow-x: hidden;
    }

    .font-math {
      font-family: 'Orbitron', sans-serif;
    }

    .glow-blue {
      box-shadow: 0 0 25px rgba(59, 130, 246, 0.25);
      border: 3px solid #1e40af;
    }

    .glow-red {
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.25);
      border: 3px solid #991b1b;
    }

    .active-speaking-blue {
      box-shadow: 0 0 80px rgba(59, 130, 246, 0.9) !important;
      border-color: #3b82f6 !important;
      background-color: rgba(30, 58, 138, 0.3) !important;
      transform: scale(1.02);
    }

    .active-speaking-red {
      box-shadow: 0 0 80px rgba(239, 68, 68, 0.9) !important;
      border-color: #ef4444 !important;
      background-color: rgba(127, 29, 29, 0.3) !important;
      transform: scale(1.02);
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen p-4 lg:p-6 flex flex-col justify-between space-y-6">

  <!-- HEADER CONTROL PANEL -->
  <header class="bg-slate-900/90 border border-slate-800 p-4 rounded-3xl flex flex-wrap items-center justify-between gap-4 shadow-2xl">
    <div class="flex items-center gap-3">
      <div class="p-3 bg-indigo-600/20 text-indigo-400 rounded-2xl border border-indigo-500/30">
        <i class="fas fa-compact-disc fa-spin text-2xl"></i>
      </div>
      <div>
        <h1 class="text-2xl font-black tracking-wider text-white uppercase font-math">NUMBER DISCO</h1>
        <p class="text-xs text-slate-400">Display Angka & Real-time Verification</p>
      </div>
    </div>

    <!-- STATUS & CONTROLS -->
    <div class="flex items-center gap-3">
      <!-- TIMER WAKTU TERSISA & STATUS MENGULANGI (LANSUNG DITAMPILKAN) -->
      <div class="flex items-center gap-3 bg-slate-950/80 border border-slate-800 px-4 py-2 rounded-2xl shadow-inner">
        <div id="repeatIndicator" class="hidden items-center gap-2 border-r border-slate-800 pr-3">
          <span class="flex h-2.5 w-2.5 relative">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-amber-500"></span>
          </span>
          <span class="text-amber-400 font-bold text-xs tracking-wider uppercase font-math">MENGULANGI</span>
        </div>
        <div class="flex items-center gap-2">
          <i class="fas fa-stopwatch text-slate-400 text-xs"></i>
          <span class="text-slate-400 text-xs font-semibold uppercase">Waktu:</span>
          <span id="timerDisplay" class="text-emerald-400 font-mono text-sm font-bold">05:00</span>
        </div>
      </div>

      <button id="btnStartGame" onclick="app.startGame()" class="px-6 py-3 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-bold text-sm rounded-2xl shadow-lg shadow-emerald-600/30 transition-all flex items-center gap-2">
        <i class="fas fa-play"></i> Mulai Game (10 Ronde)
      </button>

      <button id="btnReset" onclick="app.resetGame()" class="px-4 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-sm rounded-2xl border border-slate-700 transition-all">
        <i class="fas fa-undo"></i> Reset
      </button>
    </div>
  </header>

  <!-- MAIN DISPLAY -->
  <main class="grid grid-cols-1 md:grid-cols-2 gap-8 my-auto">
    
    <!-- KONTAINER BIRU (CEWEK) -->
    <div id="containerBlue" class="bg-slate-900/40 rounded-3xl p-8 flex items-center justify-center min-h-[900px] glow-blue transition-all duration-300">
      <div id="displayBlueFormatted" class="text-7xl lg:text-9xl font-black font-math text-white tracking-widest drop-shadow-[0_0_30px_rgba(59,130,246,0.8)]">
        --
      </div>
    </div>

    <!-- KONTAINER MERAH (COWOK) -->
    <div id="containerRed" class="bg-slate-900/40 rounded-3xl p-8 flex items-center justify-center min-h-[900px] glow-red transition-all duration-300">
      <div id="displayRedFormatted" class="text-7xl lg:text-9xl font-black font-math text-white tracking-widest drop-shadow-[0_0_30px_rgba(239,68,68,0.8)]">
        --
      </div>
    </div>

  </main>

 <!-- CDN Supabase JS (Pastikan ini ada sebelum script utama agar tidak error) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- JAVASCRIPT ENGINE -->
<script>
  const SUPABASE_URL = "https://endlrberfaxqhjrpvoss.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_ts7-cOhRLAKGP4dqa4nExA_6hCktIHa";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const STORAGE_BASE_URL = `${SUPABASE_URL}/storage/v1/object/public`;

  // Offset potong hening di akhir audio (dalam detik)
  const SILENCE_OFFSET = 1; 

  function getAudioUrl(gender, filename) {
    const bucketName = gender === 'female' ? 'voice_female' : 'voice_male';
    return `${STORAGE_BASE_URL}/${bucketName}/${filename}`;
  }

  // Helper khusus untuk memanggil sound effect dari bucket sounds_effect
  function getSoundEffectUrl(filename) {
    return `${STORAGE_BASE_URL}/sounds_effect/${filename}`;
  }

  const SOUND_BELL = getSoundEffectUrl('bell.mp3');
  const SOUND_BEEP = getSoundEffectUrl('bell.mp3');

  /**
   * MATH GENERATOR ENGINE
   */
  class MathGenerator {
    static PERFECT_SQUARES = [4, 9, 16, 25, 36, 49, 64, 81, 100, 121, 144, 169, 196, 225];

    static getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    static generateInitialNumber(genderFolder = 'female') {
      const type = Math.random();
      if (type < 0.4) {
        const val = this.getRandomInt(2, 20);
        return { 
          value: val, 
          display: `${val}`, 
          audioUrls: [getAudioUrl(genderFolder, `${val}.mp3`)] 
        };
      } else if (type < 0.7) {
        const base = this.getRandomInt(2, 6);
        const val = Math.pow(base, 2);
        return { 
          value: val, 
          display: `${base}²`, 
          audioUrls: [
            getAudioUrl(genderFolder, `${base}.mp3`), 
            getAudioUrl(genderFolder, `pangkat_dua.mp3`)
          ] 
        };
      } else {
        const sq = this.PERFECT_SQUARES[Math.floor(Math.random() * this.PERFECT_SQUARES.length)];
        const val = Math.sqrt(sq);
        return { 
          value: val, 
          display: `√${sq}`, 
          audioUrls: [
            getAudioUrl(genderFolder, `akar_dari.mp3`), 
            getAudioUrl(genderFolder, `${sq}.mp3`)
          ] 
        };
      }
    }

    static generateOperation(currentValue, genderFolder = 'male') {
      const ops = ['+', '-', '×', '÷'];
      const op = ops[Math.floor(Math.random() * ops.length)];
      let operandObj = {};
      let finalVal = currentValue;

      if (op === '+') {
        operandObj = this.generateOperandValue(genderFolder);
        finalVal = currentValue + operandObj.value;
      } else if (op === '-') {
        operandObj = this.generateOperandValue(genderFolder);
        finalVal = currentValue - operandObj.value;
      } else if (op === '×') {
        const mult = this.getRandomInt(2, 5);
        operandObj = { 
          value: mult, 
          display: `${mult}`, 
          audioUrls: [getAudioUrl(genderFolder, `${mult}.mp3`)] 
        };
        finalVal = currentValue * mult;
      } else if (op === '÷') {
        const factors = [];
        for (let i = 1; i <= Math.abs(currentValue); i++) {
          if (currentValue % i === 0) factors.push(i);
        }
        const div = factors.length > 1 ? factors[this.getRandomInt(1, factors.length - 1)] : 1;
        operandObj = { 
          value: div, 
          display: `${div}`, 
          audioUrls: [getAudioUrl(genderFolder, `${div}.mp3`)] 
        };
        finalVal = currentValue / div;
      }

      let opFileName = "";
      if (op === '+') opFileName = "ditambah.mp3";
      else if (op === '-') opFileName = "dikurangi.mp3";
      else if (op === '×') opFileName = "dikali.mp3";
      else if (op === '÷') opFileName = "dibagi.mp3";

      const opAudioUrl = getAudioUrl(genderFolder, opFileName);

      return {
        operator: op,
        operand: operandObj,
        newTotal: finalVal,
        display: `${op} ${operandObj.display}`,
        audioUrls: [opAudioUrl, ...operandObj.audioUrls]
      };
    }

    static generateOperandValue(genderFolder = 'female') {
      const type = Math.random();
      if (type < 0.5) {
        const val = this.getRandomInt(1, 15);
        return { 
          value: val, 
          display: `${val}`, 
          audioUrls: [getAudioUrl(genderFolder, `${val}.mp3`)] 
        };
      } else if (type < 0.8) {
        const base = this.getRandomInt(2, 5);
        return { 
          value: Math.pow(base, 2), 
          display: `${base}²`, 
          audioUrls: [
            getAudioUrl(genderFolder, `${base}.mp3`), 
            getAudioUrl(genderFolder, `pangkat_dua.mp3`)
          ] 
        };
      } else {
        const sq = this.PERFECT_SQUARES[this.getRandomInt(0, 6)];
        return { 
          value: Math.sqrt(sq), 
          display: `√${sq}`, 
          audioUrls: [
            getAudioUrl(genderFolder, `akar_dari.mp3`), 
            getAudioUrl(genderFolder, `${sq}.mp3`)
          ] 
        };
      }
    }
  }

  /**
   * FAST AUDIO ENGINE (Web Audio API)
   */
  class WebAudioEngine {
    constructor() {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.cache = new Map();
      this.activeSource = null;
    }

    async preloadAudio(url) {
      if (this.cache.has(url)) return this.cache.get(url);

      try {
        const res = await fetch(url);
        const arrayBuffer = await res.arrayBuffer();
        const audioBuffer = await this.ctx.decodeAudioData(arrayBuffer);
        this.cache.set(url, audioBuffer);
        return audioBuffer;
      } catch (e) {
        console.warn(`Gagal memuat/mendecode audio: ${url}`, e);
        return null;
      }
    }

    async preloadBatch(urls) {
      const uniqueUrls = [...new Set(urls)];
      await Promise.all(uniqueUrls.map(u => this.preloadAudio(u)));
    }

    playBuffer(buffer, offsetTrim = SILENCE_OFFSET) {
      return new Promise((resolve) => {
        if (!buffer) return resolve();

        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }

        const source = this.ctx.createBufferSource();
        source.buffer = buffer;
        source.connect(this.ctx.destination);

        this.activeSource = source;

        // Untuk sound effect (bell/beep), mainkan full tanpa offset potong hening
        const isSFX = buffer.duration < 1.0; 
        const playDuration = isSFX ? buffer.duration : Math.max(0.1, buffer.duration - offsetTrim);

        source.start(0);

        setTimeout(() => {
          resolve();
        }, playDuration * 1000);
      });
    }

    async playSequence(urls) {
      for (const url of urls) {
        const buffer = await this.preloadAudio(url);
        await this.playBuffer(buffer);
      }
    }

    stop() {
      if (this.activeSource) {
        try { this.activeSource.stop(); } catch(e){}
        this.activeSource = null;
      }
    }
  }

  /**
   * APP CONTROLLER
   */
  class MathDiscoAdmin {
    constructor() {
      this.isPlaying = false;
      this.femaleTotal = 0; 
      this.maleTotal = 0;   
      this.historySteps = [];
      this.timerInterval = null;
      this.remainingSeconds = 300;
      this.audioEngine = new WebAudioEngine();
    }

    async startGame() {
      if (this.isPlaying) return;
      this.isPlaying = true;
      this.resetGameDisplay();
      this.historySteps = [];

      const btnStart = document.getElementById('btnStartGame');
      if (btnStart) {
        btnStart.disabled = true;
        btnStart.classList.add('opacity-50', 'cursor-not-allowed');
      }

      // 1. Generate alur game (7 operasi) & daftar semua audio
      const allAudioUrls = this.generateFullGameSteps();

      // 2. Pre-download audio
      this.showLoadingStatus("Mengunduh Suara Audio...", true);
      await this.audioEngine.preloadBatch(allAudioUrls);
      this.showLoadingStatus("", false);

      // 3. Jalankan Timer
      this.start5MinTimer();

      // 4. Update Target Jawaban ke Supabase DB
      await this.upsertTargetAnswers(this.femaleTotal, this.maleTotal);

      // 5. Mainkan ronde utama
      for (const step of this.historySteps) {
        if (!this.isPlaying) return;

        this.updateDisplay(step.team, step.display, true);
        await this.audioEngine.playSequence(step.audioUrls);
        this.updateDisplay(step.team, step.display, false);

        await this.delay(200);
      }

      // Selesai ronde utama -> Bunyikan BELL
      if (this.isPlaying && this.remainingSeconds > 0) {
        await this.audioEngine.playSequence([SOUND_BELL]);
      }

      // Masuk ke Mode Looping / Repeat
      await this.enterRepeatMode();
    }

    generateFullGameSteps() {
      const audioUrls = [];

      // Ronde 1: Tim Biru (Female)
      const initBlue = MathGenerator.generateInitialNumber('female');
      this.femaleTotal = initBlue.value;
      this.historySteps.push({ team: 'blue', display: initBlue.display, audioUrls: initBlue.audioUrls });
      audioUrls.push(...initBlue.audioUrls);

      // Ronde 1: Tim Merah (Male)
      const initRed = MathGenerator.generateInitialNumber('male');
      this.maleTotal = initRed.value;
      this.historySteps.push({ team: 'red', display: initRed.display, audioUrls: initRed.audioUrls });
      audioUrls.push(...initRed.audioUrls);

      // Ronde 2 s.d 10
      for (let step = 2; step <= 7; step++) {
        const blueOp = MathGenerator.generateOperation(this.femaleTotal, 'female');
        this.femaleTotal = blueOp.newTotal;
        this.historySteps.push({ team: 'blue', display: blueOp.display, audioUrls: blueOp.audioUrls });
        audioUrls.push(...blueOp.audioUrls);

        const redOp = MathGenerator.generateOperation(this.maleTotal, 'male');
        this.maleTotal = redOp.newTotal;
        this.historySteps.push({ team: 'red', display: redOp.display, audioUrls: redOp.audioUrls });
        audioUrls.push(...redOp.audioUrls);
      }

      // Tambahkan SFX ke preloader
      audioUrls.push(SOUND_BELL, SOUND_BEEP);
      return audioUrls;
    }

    async enterRepeatMode() {
      const repeatIndicator = document.getElementById('repeatIndicator');
      if (repeatIndicator) {
        repeatIndicator.classList.remove('hidden');
        repeatIndicator.classList.add('flex');
      }

      while (this.isPlaying && this.remainingSeconds > 0) {
        for (const step of this.historySteps) {
          if (!this.isPlaying || this.remainingSeconds <= 0) break;

          this.updateDisplay(step.team, step.display, true);
          await this.audioEngine.playSequence(step.audioUrls);
          this.updateDisplay(step.team, step.display, false);

          await this.delay(200);
        }

        // Setiap kali satu putaran looping selesai -> Bunyikan BELL lagi
        if (this.isPlaying && this.remainingSeconds > 0) {
          await this.audioEngine.playSequence([SOUND_BELL]);
        }
      }
    }

    showLoadingStatus(msg, show) {
      let loadingElem = document.getElementById('audioLoadingMsg');
      if (!loadingElem) {
        loadingElem = document.createElement('div');
        loadingElem.id = 'audioLoadingMsg';
        loadingElem.className = 'fixed top-4 right-4 bg-blue-600 text-white px-4 py-2 rounded-lg shadow-lg font-bold text-sm animate-bounce z-50';
        document.body.appendChild(loadingElem);
      }

      if (show) {
        loadingElem.textContent = msg;
        loadingElem.classList.remove('hidden');
      } else {
        loadingElem.classList.add('hidden');
      }
    }

    start5MinTimer() {
      this.stopGameTimer();
      this.remainingSeconds = 300;
      this.updateTimerUI();

      this.timerInterval = setInterval(() => {
        this.remainingSeconds--;
        this.updateTimerUI();

        if (this.remainingSeconds <= 0) {
          this.stopGameTimer();
          this.resetGame();
        }
      }, 1000);
    }

    stopGameTimer() {
      if (this.timerInterval) {
        clearInterval(this.timerInterval);
        this.timerInterval = null;
      }
    }

    updateTimerUI() {
      const mins = Math.floor(this.remainingSeconds / 60);
      const secs = this.remainingSeconds % 60;
      const formatted = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      
      const timerElem = document.getElementById('timerDisplay');
      if (timerElem) {
        timerElem.textContent = formatted;
        if (this.remainingSeconds <= 30) {
          timerElem.className = "text-red-400 font-mono text-sm font-bold animate-pulse";
        } else {
          timerElem.className = "text-emerald-400 font-mono text-sm font-bold";
        }
      }
    }

    async upsertTargetAnswers(femaleAnswer, maleAnswer) {
      try {
        const { error } = await supabaseClient
          .from('system_number_disco')
          .upsert([
            { id: 1, team_gender: 'female', target_answer: femaleAnswer, updated_at: new Date() },
            { id: 2, team_gender: 'male', target_answer: maleAnswer, updated_at: new Date() }
          ]);

        if (error) console.error('Error updating target answers:', error);
      } catch (err) {
        console.error('Network Exception:', err);
      }
    }

    updateDisplay(team, formattedText, isSpeaking) {
      const container = document.getElementById(team === 'blue' ? 'containerBlue' : 'containerRed');
      const displayFormatted = document.getElementById(team === 'blue' ? 'displayBlueFormatted' : 'displayRedFormatted');

      if (displayFormatted) displayFormatted.textContent = formattedText;

      if (container) {
        if (isSpeaking) {
          container.classList.add(team === 'blue' ? 'active-speaking-blue' : 'active-speaking-red');
        } else {
          container.classList.remove(team === 'blue' ? 'active-speaking-blue' : 'active-speaking-red');
        }
      }
    }

    resetGameDisplay() {
      this.femaleTotal = 0;
      this.maleTotal = 0;
      const blueDisp = document.getElementById('displayBlueFormatted');
      const redDisp = document.getElementById('displayRedFormatted');
      if (blueDisp) blueDisp.textContent = "--";
      if (redDisp) redDisp.textContent = "--";
      
      const repeatIndicator = document.getElementById('repeatIndicator');
      if (repeatIndicator) {
        repeatIndicator.classList.add('hidden');
        repeatIndicator.classList.remove('flex');
      }
    }

    resetGame() {
      this.audioEngine.stop();
      this.stopGameTimer();
      this.isPlaying = false;
      this.resetGameDisplay();
      this.remainingSeconds = 300;
      this.updateTimerUI();
      const btnStart = document.getElementById('btnStartGame');
      if (btnStart) {
        btnStart.disabled = false;
        btnStart.classList.remove('opacity-50', 'cursor-not-allowed');
      }
    }
    async resetGame() {
      this.audioEngine.stop();
      this.stopGameTimer();
      
      // Bunyikan BEEP pas waktu habis / game selesai berakhir
      if (this.isPlaying) {
        await this.audioEngine.playSequence([SOUND_BEEP]);
      }

      this.isPlaying = false;
      this.resetGameDisplay();
      this.remainingSeconds = 300;
      this.updateTimerUI();
      const btnStart = document.getElementById('btnStartGame');
      if (btnStart) {
        btnStart.disabled = false;
        btnStart.classList.remove('opacity-50', 'cursor-not-allowed');
      }
    }

    delay(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }
  }

  const app = new MathDiscoAdmin();
</script>
