<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout Stage - Arithmetic Bingo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    body {
      background-color: #030712;
      color: #ffffff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
    }

    .stage-view {
      transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .stage-view.hidden-view {
      opacity: 0;
      transform: scale(0.92);
      pointer-events: none;
      position: absolute;
      inset: 0;
    }
    .stage-view.active-view {
      opacity: 1;
      transform: scale(1);
      position: relative;
    }

    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.5); border-radius: 10px; }

    @keyframes cardZoomIn {
      0% { opacity: 0; transform: scale(0.7) translateY(40px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .animate-card-pop {
      animation: cardZoomIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .glow-gold { box-shadow: 0 0 60px rgba(245, 158, 11, 0.3); }
    .glow-cyan { box-shadow: 0 0 45px rgba(6, 182, 212, 0.25); }
    .glow-indigo { box-shadow: 0 0 45px rgba(99, 102, 241, 0.35); }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 md:p-12 relative">

  <div class="absolute inset-0 bg-[radial-gradient(circle_at_top,_var(--tw-gradient-stops))] from-indigo-950/40 via-slate-950 to-slate-950 pointer-events-none"></div>

  <div class="w-full max-w-5xl relative z-10">

    <!-- 1. VIEW SOAL -->
    <div id="viewQuestion" class="stage-view active-view bg-slate-900/90 border border-slate-800 rounded-3xl p-10 md:p-16 text-center shadow-2xl backdrop-blur-md glow-cyan">
      <div class="flex items-center justify-center gap-3 mb-8">
        <span class="bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 font-black text-sm px-5 py-2 rounded-full uppercase tracking-widest flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-pulse"></span> ARITHMETIC BINGO • DAY 1
        </span>
      </div>

      <div class="flex items-center justify-between border-b border-slate-800 pb-6 mb-8 max-w-2xl mx-auto">
        <span id="stageQuestionNum" class="text-xl font-bold text-amber-400 font-mono">SOAL #0 / 99</span>
        <div class="flex items-center gap-2 text-rose-400 font-mono font-black text-2xl bg-rose-500/10 px-4 py-1.5 rounded-xl border border-rose-500/20">
          <i class="fas fa-clock"></i>
          <span id="stageTimer">0s</span>
        </div>
      </div>

      <div class="min-h-[200px] flex items-center justify-center">
        <h1 id="stageQuestionText" class="text-3xl md:text-5xl font-black text-slate-400 tracking-wider drop-shadow-lg">
          Menunggu Admin Memulai Permainan...
        </h1>
      </div>

      <div class="mt-8 pt-6 border-t border-slate-800/80 text-slate-500 text-sm font-medium">
        Jawab cepat di perangkat peserta masing-masing!
      </div>
    </div>


    <!-- 2. VIEW PAPAN PERINGKAT TOP 10 (MODE FOCUS CARD 1 PER 1) -->
    <div id="viewLeaderboard" class="stage-view hidden-view bg-slate-900/90 border border-amber-500/30 rounded-3xl p-8 md:p-12 shadow-2xl backdrop-blur-md glow-gold text-center relative">
      <div class="mb-6">
        <span class="bg-amber-500/10 border border-amber-500/30 text-amber-400 font-black text-xs px-4 py-1.5 rounded-full uppercase tracking-widest">
          FINAL STANDINGS
        </span>
        <h2 class="text-3xl md:text-5xl font-black text-white mt-3 tracking-wide flex items-center justify-center gap-3">
          <i class="fas fa-trophy text-amber-400"></i> PAPAN PERINGKAT TOP 10
        </h2>
      </div>

      <!-- KARTU UTAMA TAMPILAN PERINGKAT -->
      <div class="relative max-w-lg mx-auto min-h-[420px] flex items-center justify-center">

        <!-- Tombol Panah Kiri (Visual Hiasan) -->
        <div class="absolute -left-12 md:-left-20 text-4xl text-amber-500/40 animate-pulse pointer-events-none hidden sm:block">
          <i class="fas fa-chevron-left"></i>
        </div>

        <!-- Container Kartu Aktif -->
        <div id="stageLeaderboardGrid" class="w-full">
          <p class="text-slate-500 text-lg py-12 font-medium">Menunggu Admin Menekan Tombol Peringkat...</p>
        </div>

        <!-- Tombol Panah Kanan (Visual Hiasan) -->
        <div class="absolute -right-12 md:-right-20 text-4xl text-amber-500/40 animate-pulse pointer-events-none hidden sm:block">
          <i class="fas fa-chevron-right"></i>
        </div>

      </div>
    </div>


    <!-- 3. VIEW SELURUH PESERTA -->
    <div id="viewAllPlayers" class="stage-view hidden-view bg-slate-900/90 border border-indigo-500/30 rounded-3xl p-8 md:p-10 shadow-2xl backdrop-blur-md glow-indigo">
      <div class="text-center mb-6">
        <span class="bg-indigo-500/10 border border-indigo-500/30 text-indigo-400 font-black text-xs px-4 py-1.5 rounded-full uppercase tracking-widest">
          TOTAL SCORE LIST
        </span>
        <h2 class="text-3xl md:text-4xl font-black text-white mt-2 tracking-wide flex items-center justify-center gap-3">
          <i class="fas fa-users text-indigo-400"></i> REKAP POIN SELURUH PESERTA
        </h2>
      </div>

      <div id="scrollContainer" class="max-w-4xl mx-auto max-h-[500px] overflow-y-auto custom-scroll pr-2">
        <div id="allPlayersGrid" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
      </div>
    </div>

  </div>

  <script>
    const supabaseUrl = 'https://endlrberfaxqhjrpvoss.supabase.co';
    const supabaseKey = 'sb_publishable_ts7-cOhRLAKGP4dqa4nExA_6hCktIHa';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    let stageTimerInterval = null;
    let autoScrollInterval = null;
    let currentRevealedRank = -1;
    let cachedScores = [];
    let lastQuestionNumber = 0;

    function subscribeAdminLayoutRemote() {
      // Realtime Listener
      supabaseClient
        .channel('layout_remote_channel')
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'admin_layout_arithmatic_bingo' }, (payload) => {
          if (payload.new) handleViewSwitch(payload.new.current_view, payload.new.revealed_rank);
        })
        .subscribe();

      // Polling Backup
      setInterval(async () => {
        const { data } = await supabaseClient
          .from('admin_layout_arithmatic_bingo')
          .select('*')
          .eq('id', 1)
          .maybeSingle();
        
        if (data) handleViewSwitch(data.current_view, data.revealed_rank);
      }, 1000);
    }

    function subscribeQuestionState() {
      // Realtime listener
      supabaseClient
        .channel('layout_question_channel')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'system_arithmatic_bingo' }, (payload) => {
          if (payload.new) updateQuestionDisplay(payload.new);
        })
        .subscribe((status) => {
          console.log('[LAYOUT] Realtime question status:', status);
        });

      // ═══════════════════════════════════════════════════════════
      // POLLING FALLBACK — cek setiap 1 detik
      // ═══════════════════════════════════════════════════════════
      setInterval(async () => {
        const { data } = await supabaseClient
          .from('system_arithmatic_bingo')
          .select('*')
          .eq('id', 1)
          .maybeSingle();
        
        if (data) updateQuestionDisplay(data);
      }, 1000);
    }

    let lastLayoutSignature = '';

    function handleViewSwitch(viewName, revealedRank) {
      // Signature check — skip kalau tidak ada perubahan
      const sig = `${viewName}|${revealedRank}`;
      if (sig === lastLayoutSignature) return;
      lastLayoutSignature = sig;

      console.log('[LAYOUT] View switch:', viewName, 'rank:', revealedRank);

      const qView = document.getElementById('viewQuestion');
      const lbView = document.getElementById('viewLeaderboard');
      const allView = document.getElementById('viewAllPlayers');

      stopAutoScroll();

      qView.classList.add('hidden-view'); qView.classList.remove('active-view');
      lbView.classList.add('hidden-view'); lbView.classList.remove('active-view');
      allView.classList.add('hidden-view'); allView.classList.remove('active-view');

      const newRank = revealedRank || 0;

      if (viewName === 'leaderboard') {
        lbView.classList.remove('hidden-view');
        lbView.classList.add('active-view');
        
        if (newRank !== currentRevealedRank) {
          currentRevealedRank = newRank;
          fetchAndRenderStageScores(false);
        }
      } else if (viewName === 'all_players') {
        allView.classList.remove('hidden-view');
        allView.classList.add('active-view');
        currentRevealedRank = -1;
        fetchAndRenderStageScores(true);
      } else {
        qView.classList.remove('hidden-view');
        qView.classList.add('active-view');
        currentRevealedRank = -1;
      }
    }

    function updateQuestionDisplay(data) {
      const qTextElem = document.getElementById('stageQuestionText');
      const qNumElem = document.getElementById('stageQuestionNum');

      if (!data.is_active || data.question_number === 0) {
        qNumElem.textContent = `SOAL #0 / 99`;
        qTextElem.textContent = "Menunggu Admin Memulai Permainan...";
        qTextElem.className = "text-3xl md:text-5xl font-black text-slate-400 tracking-wider drop-shadow-lg";
        document.getElementById('stageTimer').textContent = "0s";
        clearInterval(stageTimerInterval);
        return;
      }

      qNumElem.textContent = `SOAL #${data.question_number} / 99`;
      qTextElem.textContent = data.question_text || "SIAP MEMULAI?";
      qTextElem.className = "text-6xl md:text-8xl font-black text-white tracking-wider drop-shadow-lg";

      if (lastQuestionNumber !== data.question_number) {
        lastQuestionNumber = data.question_number;
        startStageTimer(20);
      }
    }

    function startStageTimer(seconds) {
      clearInterval(stageTimerInterval);
      let left = seconds;
      document.getElementById('stageTimer').textContent = `${left}s`;

      stageTimerInterval = setInterval(() => {
        left--;
        if (left < 0) left = 0;
        document.getElementById('stageTimer').textContent = `${left}s`;
        if (left <= 0) clearInterval(stageTimerInterval);
      }, 1000);
    }

    async function fetchAndRenderStageScores(isAllPlayersView) {
      const { data, error } = await supabaseClient
        .from('game_scores')
        .select('user_unique_id, score_obtained')
        .eq('game_name', 'Bingo Math');

      if (error || !data) return;

      let scoreMap = {};
      data.forEach(row => {
        scoreMap[row.user_unique_id] = (scoreMap[row.user_unique_id] || 0) + row.score_obtained;
      });

      cachedScores = Object.keys(scoreMap)
        .map(uid => ({ uid, total: scoreMap[uid] }))
        .sort((a, b) => b.total - a.total);

      if (isAllPlayersView) {
        renderAllPlayersList();
        startAutoScroll();
      } else {
        renderStageLeaderboard();
      }
    }

    // RENDER FOKUS 1 KARTU BERDASARKAN TOMBOL REVEAL ADMIN
    function renderStageLeaderboard() {
      const container = document.getElementById('stageLeaderboardGrid');
      
      if (currentRevealedRank === 0 || cachedScores.length === 0) {
        container.innerHTML = `<p class="text-slate-500 text-lg py-12 font-medium">Siap-siap... Pengumuman Pemenang!</p>`;
        return;
      }

      const targetIdx = currentRevealedRank - 1;
      const targetPlayer = cachedScores[targetIdx];

      if (!targetPlayer) {
        container.innerHTML = `<p class="text-slate-400 text-lg py-12">Belum ada data untuk Peringkat #${currentRevealedRank}</p>`;
        return;
      }

      let cardTheme = "from-slate-800 to-slate-900 border-slate-700/80 text-white";
      let badgeLabel = `PERINGKAT #${currentRevealedRank}`;
      let badgeBg = "bg-slate-700/60 text-slate-300 border-slate-600";
      let glowEffect = "shadow-slate-900/50";

      if (currentRevealedRank === 1) {
        cardTheme = "from-amber-950/80 via-yellow-900/60 to-amber-950/80 border-amber-400/80 text-amber-100";
        badgeLabel = "👑 JUARA 1 (WINNER)";
        badgeBg = "bg-amber-400 text-slate-950 border-amber-300 font-black";
        glowEffect = "shadow-2xl shadow-amber-500/30";
      } else if (currentRevealedRank === 2) {
        cardTheme = "from-slate-800 via-slate-700/80 to-slate-900 border-slate-300/80 text-slate-100";
        badgeLabel = "🥈 JUARA 2 (RUNNER UP)";
        badgeBg = "bg-slate-200 text-slate-950 border-white font-black";
        glowEffect = "shadow-xl shadow-slate-300/20";
      } else if (currentRevealedRank === 3) {
        cardTheme = "from-amber-950/60 via-amber-900/40 to-slate-900 border-amber-600/80 text-amber-200";
        badgeLabel = "🥉 JUARA 3";
        badgeBg = "bg-amber-600 text-white border-amber-500 font-black";
        glowEffect = "shadow-xl shadow-amber-700/20";
      }

      const avatarUrl = `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(targetPlayer.uid)}`;

      container.innerHTML = `
        <div class="animate-card-pop bg-gradient-to-b ${cardTheme} border-2 rounded-3xl p-8 md:p-10 ${glowEffect} flex flex-col items-center justify-center space-y-6 relative overflow-hidden">
          
          <div class="px-5 py-2 rounded-full border text-xs md:text-sm font-black tracking-widest uppercase ${badgeBg}">
            ${badgeLabel}
          </div>

          <div class="relative">
            <div class="w-36 h-36 md:w-44 md:h-44 rounded-3xl bg-slate-950/80 border-2 border-white/20 overflow-hidden shadow-inner flex items-center justify-center p-2">
              <img src="${avatarUrl}" alt="${targetPlayer.uid}" class="w-full h-full object-contain" />
            </div>
          </div>

          <div class="space-y-2">
            <h3 class="text-2xl md:text-4xl font-black truncate max-w-xs md:max-w-md mx-auto tracking-wide">
              ${targetPlayer.uid}
            </h3>
            <div class="inline-block text-xl md:text-3xl font-mono font-black text-amber-400 bg-amber-500/10 px-6 py-2 rounded-2xl border border-amber-500/30">
              +${targetPlayer.total} PTS
            </div>
          </div>

        </div>
      `;
    }

    function renderAllPlayersList() {
      const container = document.getElementById('allPlayersGrid');
      container.innerHTML = '';

      if (cachedScores.length === 0) {
        container.innerHTML = `<p class="col-span-2 text-center text-slate-500 py-10">Belum ada peserta terdaftar.</p>`;
        return;
      }

      cachedScores.forEach((item, idx) => {
        const rankNumber = idx + 1;
        const avatarUrl = `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(item.uid)}`;

        const card = document.createElement('div');
        card.className = "p-3 rounded-xl border border-slate-800 bg-slate-800/50 flex items-center justify-between";
        card.innerHTML = `
          <div class="flex items-center gap-3 overflow-hidden">
            <span class="text-xs font-mono font-bold px-2.5 py-1 bg-slate-900/80 rounded-lg text-slate-400 border border-slate-700">#${rankNumber}</span>
            <img src="${avatarUrl}" class="w-8 h-8 rounded-lg bg-slate-900 border border-slate-700" />
            <span class="text-sm font-semibold text-slate-200 truncate">${item.uid}</span>
          </div>
          <span class="text-sm font-mono font-bold text-indigo-400 bg-indigo-500/10 px-3 py-1 rounded-lg border border-indigo-500/20">+${item.total} PTS</span>
        `;
        container.appendChild(card);
      });
    }

    function startAutoScroll() {
      stopAutoScroll();
      const scrollElem = document.getElementById('scrollContainer');
      let isWaiting = false;

      autoScrollInterval = setInterval(() => {
        if (isWaiting) return;
        scrollElem.scrollTop += 1.5;

        if (scrollElem.scrollTop + scrollElem.clientHeight >= scrollElem.scrollHeight - 2) {
          isWaiting = true;
          setTimeout(() => {
            scrollElem.scrollTo({ top: 0, behavior: 'smooth' });
            setTimeout(() => { isWaiting = false; }, 1200);
          }, 2000);
        }
      }, 30);
    }

    function stopAutoScroll() {
      if (autoScrollInterval) clearInterval(autoScrollInterval);
    }

    async function initStage() {
      // Fetch layout awal
      const { data: layoutData } = await supabaseClient
        .from('admin_layout_arithmatic_bingo')
        .select('*')
        .eq('id', 1)
        .maybeSingle();

      if (layoutData) {
        // Set signature SEBELUM handleViewSwitch
        lastLayoutSignature = `${layoutData.current_view}|${layoutData.revealed_rank || 0}`;
        handleViewSwitch(layoutData.current_view, layoutData.revealed_rank);
      }

      // Fetch soal awal
      const { data: sysData } = await supabaseClient
        .from('system_arithmatic_bingo')
        .select('*')
        .eq('id', 1)
        .maybeSingle();
      if (sysData) updateQuestionDisplay(sysData);

      // Subscribe
      subscribeAdminLayoutRemote();
      subscribeQuestionState();

      console.log('[LAYOUT] Init complete');
    }

    initStage();
  </script>
</body>
</html>
