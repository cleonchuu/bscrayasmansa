<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Number Disco</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;600;800&display=swap');

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #030712;
      color: #ffffff;
    }

    .font-math {
      font-family: 'Orbitron', sans-serif;
    }

    .glow-blue {
      box-shadow: 0 0 25px rgba(59, 130, 246, 0.25);
      border: 2px solid #1e40af;
    }

    .glow-red {
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.25);
      border: 2px solid #991b1b;
    }
  </style>
</head>
<body class="min-h-screen p-4 lg:p-6 flex flex-col justify-between space-y-6 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black select-none">

  <!-- HEADER CONTROL PANEL -->
  <header class="bg-slate-900/90 border border-slate-800 p-4 rounded-3xl flex flex-wrap items-center justify-between gap-4 shadow-2xl backdrop-blur-md">
    <div class="flex items-center gap-3">
      <div class="p-3 bg-indigo-600/20 text-indigo-400 rounded-2xl border border-indigo-500/30">
        <i class="fas fa-compact-disc fa-spin text-2xl"></i>
      </div>
      <div>
        <h1 class="text-2xl font-black tracking-wider text-white uppercase font-math">NUMBER DISCO</h1>
        <p class="text-xs text-slate-400">Control Panel Admin & Stage Control</p>
      </div>
    </div>

    <!-- KONTROL STAGE VIEW -->
    <div class="flex items-center gap-2 bg-slate-950/80 p-1.5 rounded-2xl border border-slate-800">
      <span class="text-xs text-slate-400 font-bold px-3 uppercase tracking-wider hidden sm:inline">Stage View:</span>
      <button onclick="switchStageView('game')" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-xl transition-all">
        <i class="fas fa-tv"></i> Tampilan Game
      </button>
      <button onclick="switchStageView('leaderboard')" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white font-bold text-xs rounded-xl transition-all">
        <i class="fas fa-trophy"></i> Papan Peringkat
      </button>
      <button onclick="switchStageView('all_players')" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs rounded-xl transition-all">
        <i class="fas fa-users"></i> Poin Peserta
      </button>
    </div>

    <!-- KONTROL TOMBOL UTAMA -->
    <div class="flex items-center gap-3">
      <button id="btnStartGame" onclick="triggerStartGame()" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-bold text-xs rounded-2xl shadow-lg transition-all flex items-center gap-2">
        <i class="fas fa-play"></i> <span id="btnStartText">Mulai Game (10 Ronde)</span>
      </button>
      <button id="btnReset" onclick="sendControlAction('RESET')" class="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs rounded-2xl border border-slate-700 transition-all">
        <i class="fas fa-undo"></i> Reset
      </button>
    </div>
  </header>

  <!-- MAIN MONITORING DISPLAY (KUNCI JAWABAN LANGSUNG DI TENAH LAYAR) -->
  <main class="grid grid-cols-1 md:grid-cols-2 gap-6 my-auto">
    <!-- TIM BIRU -->
    <div id="containerBlue" class="bg-slate-900/60 rounded-3xl p-8 flex flex-col items-center justify-center min-h-[480px] glow-blue transition-all duration-300 relative">
      <span class="absolute top-4 left-4 bg-blue-500/10 border border-blue-500/30 text-blue-400 text-xs font-bold px-3 py-1 rounded-full uppercase">
        <i class="fas fa-venus"></i> TIM BIRU (FEMALE)
      </span>
      <!-- JAWABAN AKHIR KINI BERADA DI TENAH LAYAR -->
      <div id="targetBlue" class="text-7xl lg:text-9xl font-black font-math text-blue-400 tracking-widest drop-shadow-[0_0_30px_rgba(59,130,246,0.5)]">
        --
      </div>
    </div>

    <!-- TIM MERAH -->
    <div id="containerRed" class="bg-slate-900/60 rounded-3xl p-8 flex flex-col items-center justify-center min-h-[480px] glow-red transition-all duration-300 relative">
      <span class="absolute top-4 left-4 bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs font-bold px-3 py-1 rounded-full uppercase">
        <i class="fas fa-mars"></i> TIM MERAH (MALE)
      </span>
      <!-- JAWABAN AKHIR KINI BERADA DI TENAH LAYAR -->
      <div id="targetRed" class="text-7xl lg:text-9xl font-black font-math text-rose-400 tracking-widest drop-shadow-[0_0_30px_rgba(239,68,68,0.5)]">
        --
      </div>
    </div>
  </main>

  <!-- PANEL REKAPITULASI POIN SELURUH PESERTA -->
  <section class="bg-slate-900/90 border border-slate-800 rounded-3xl p-6 shadow-2xl backdrop-blur-md">
    <div class="flex items-center justify-between border-b border-slate-800 pb-4 mb-4">
      <div class="flex items-center gap-3">
        <i class="fas fa-users text-indigo-400 text-lg"></i>
        <h3 class="text-lg font-bold text-white uppercase tracking-wider">Daftar Seluruh Peserta & Poin</h3>
      </div>
      <button onclick="fetchAndRenderScores()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-xl border border-slate-700 transition-all">
        <i class="fas fa-sync-alt"></i> Refresh Poin
      </button>
    </div>
    <div id="adminScoresGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3 max-h-48 overflow-y-auto pr-1"></div>
  </section>

  <script>
    const SUPABASE_URL = "https://endlrberfaxqhjrpvoss.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_ts7-cOhRLAKGP4dqa4nExA_6hCktIHa";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let resetTimer = null;

    // Switch Layar Panggung (Stage View)
    async function switchStageView(viewName) {
      await supabaseClient
        .from('admin_layout_number_disco')
        .update({ current_view: viewName, updated_at: new Date().toISOString() })
        .eq('id', 1);
    }

    // Kirim Perintah Kontrol ke Supabase
    async function sendControlAction(action) {
      await supabaseClient
        .from('system_number_disco_control')
        .update({ action: action, updated_at: new Date().toISOString() })
        .eq('id', 1);
    }

    // Fungsi Mulai Game + Auto-Reset Sinyal ke IDLE setelah 10 Detik
    async function triggerStartGame() {
      const btnStart = document.getElementById('btnStartGame');
      const btnText = document.getElementById('btnStartText');

      // Reset Jawaban di Layar Admin Saat Tombol Mulai Ditekan
      updateTargetAnswerUI('female', '--');
      updateTargetAnswerUI('male', '--');

      // 1. Kirim Sinyal START_GAME ke Layout
      await sendControlAction('START_GAME');

      // 2. Tampilkan Efek Countdown 10 Detik pada Tombol Admin
      btnStart.disabled = true;
      btnStart.classList.add('opacity-50', 'cursor-not-allowed');

      let countdown = 10;
      btnText.textContent = `Sinyal Dikirim (${countdown}s)...`;

      if (resetTimer) clearInterval(resetTimer);

      resetTimer = setInterval(async () => {
        countdown--;
        if (countdown > 0) {
          btnText.textContent = `Sinyal Dikirim (${countdown}s)...`;
        } else {
          clearInterval(resetTimer);
          btnText.textContent = "Mulai Game (10 Ronde)";
          btnStart.disabled = false;
          btnStart.classList.remove('opacity-50', 'cursor-not-allowed');

          // 3. MATIKAN SINYAL (KEMBALIKAN KE 'IDLE') SETELAH 10 DETIK
          await sendControlAction('IDLE');
        }
      }, 1000);
    }

    // Dengarkan Perubahan Kunci Jawaban Target (system_number_disco) secara Realtime
    supabaseClient.channel('system_number_disco_target_changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'system_number_disco' }, (payload) => {
        if (payload.new) {
          updateTargetAnswerUI(payload.new.team_gender, payload.new.target_answer);
        }
      })
      .subscribe();

    // Init Ambil Data Jawaban Target Pertama Kali Saat Halaman Dimuat
    supabaseClient.from('system_number_disco').select('*').then(({ data }) => {
      if (data) {
        data.forEach(r => updateTargetAnswerUI(r.team_gender, r.target_answer));
      }
    });

    function updateTargetAnswerUI(gender, answer) {
      const elemId = gender === 'female' ? 'targetBlue' : 'targetRed';
      const elem = document.getElementById(elemId);
      if (elem) {
        elem.textContent = (answer !== null && answer !== undefined && answer !== '') ? answer : '--';
      }
    }

    // Ambil Skor Poin Seluruh Peserta
    async function fetchAndRenderScores() {
      const grid = document.getElementById('adminScoresGrid');
      const { data } = await supabaseClient.from('game_scores').select('user_unique_id, score_obtained').eq('game_name', 'Number Disco');
      if (!data) return;

      let scoreMap = {};
      data.forEach(r => { scoreMap[r.user_unique_id] = (scoreMap[r.user_unique_id] || 0) + r.score_obtained; });

      grid.innerHTML = '';
      const sortedKeys = Object.keys(scoreMap).sort((a,b) => scoreMap[b] - scoreMap[a]);
      if (sortedKeys.length === 0) {
        grid.innerHTML = '<p class="col-span-full text-center text-slate-500 py-4 font-bold text-xs">Belum Ada Skor Terdaftar</p>';
        return;
      }

      sortedKeys.forEach((uid, idx) => {
        const card = document.createElement('div');
        card.className = "bg-slate-950 border border-slate-800 p-2.5 rounded-xl flex items-center justify-between text-xs";
        card.innerHTML = `<div><span class="text-slate-500 font-mono">#${idx+1}</span> <span class="font-semibold text-slate-200 ml-1">${uid}</span></div><span class="font-bold font-math text-emerald-400">+${scoreMap[uid]}</span>`;
        grid.appendChild(card);
      });
    }

    fetchAndRenderScores();
  </script>
</body>
</html>
